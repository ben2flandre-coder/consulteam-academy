<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">Chaîne d'un système de sécurité incendie</title><desc id="d">Détecteurs et déclencheurs vers l'ECS, puis le CMSI qui commande les DAS ; l'alimentation de sécurité alimente le système.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#102c53}.b{font-weight:700}.s{font-size:12.5px}.m{font-size:15px}.w{fill:#fff}</style><rect width="760" height="340" rx="16" fill="#f4f7fb"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#102c53"/></marker></defs><text x="30" y="34" class="b m">Du détecteur à la mise en sécurité</text><rect x="30" y="70" width="170" height="64" rx="12" fill="#f6b63d"/><text x="115.0" y="96.0" text-anchor="middle" class="b m">Détecteurs</text><text x="115.0" y="116.0" text-anchor="middle" class="s">automatiques</text><rect x="30" y="160" width="170" height="64" rx="12" fill="#f6b63d"/><text x="115.0" y="186.0" text-anchor="middle" class="b m">Déclencheurs</text><text x="115.0" y="206.0" text-anchor="middle" class="s">manuels</text><path d="M200 102 L262 128" stroke="#102c53" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M200 192 L262 168" stroke="#102c53" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="264" y="110" width="150" height="80" rx="12" fill="#102c53"/><text x="339.0" y="144.0" text-anchor="middle" class="b m w">ECS</text><text x="339.0" y="164.0" text-anchor="middle" class="s w">contrôle et signalisation</text><path d="M414 150 L478 150" stroke="#102c53" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="480" y="110" width="130" height="80" rx="12" fill="#2a6fb0"/><text x="545.0" y="144.0" text-anchor="middle" class="b m w">CMSI</text><text x="545.0" y="164.0" text-anchor="middle" class="s w">mise en sécurité</text><path d="M610 130 L640 86" stroke="#102c53" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M610 170 L640 214" stroke="#102c53" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="640" y="56" width="100" height="60" rx="12" fill="#1d7a4d"/><text x="690.0" y="80.0" text-anchor="middle" class="b m w">DAS</text><text x="690.0" y="100.0" text-anchor="middle" class="s w">portes, clapets</text><rect x="640" y="184" width="100" height="60" rx="12" fill="#1d7a4d"/><text x="690.0" y="208.0" text-anchor="middle" class="b m w">Diffuseurs</text><text x="690.0" y="228.0" text-anchor="middle" class="s w">sonores</text><rect x="30" y="262" width="580" height="54" rx="12" fill="#fff" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 5"/><text x="320" y="285" text-anchor="middle" class="b m">Alimentation de sécurité (AES) : secteur + batterie</text><text x="320" y="304" text-anchor="middle" class="s">La batterie reste une source quand le secteur est coupé</text><text x="614" y="278" class="s b" fill="#c0392b">SDI : détection</text><text x="614" y="296" class="s b">SMSI : mise en sécurité</text></svg>