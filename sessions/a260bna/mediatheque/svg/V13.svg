<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">BR : rester dans l’intervention confiée</title><desc id="desc">Assistance possible dans le cadre prévu : effectif et titres à confirmer.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S02.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V13 · BR : rester dans l’intervention confiée</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Assistance possible dans le cadre prévu : effectif et titres à confirmer.</text><rect x="90" y="240" width="650" height="430" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="114" y="282" font-size="27" fill="#173b50">Intervention générale BT</text><text x="114" y="323" font-size="22" fill="#173b50">Objet curatif / entretien défini</text><text x="114" y="355" font-size="22" fill="#173b50">Faible étendue et courte durée</text><text x="114" y="387" font-size="22" fill="#173b50">Consignation pour cette intervention</text><text x="114" y="419" font-size="22" fill="#173b50">Titre et compétences adéquats</text><rect x="860" y="240" width="650" height="430" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="884" y="282" font-size="27" fill="#173b50">Changer de cadre si nécessaire</text><text x="884" y="323" font-size="22" fill="#173b50">Périmètre qui s’étend</text><text x="884" y="355" font-size="22" fill="#173b50">Modification importante</text><text x="884" y="387" font-size="22" fill="#173b50">Organisation de travaux requise</text><text x="884" y="419" font-size="22" fill="#173b50">Nouvelle analyse avant poursuite</text><text x="100" y="770" font-size="25" fill="#173b50">Ne pas transformer les limites de connexion en présence de tension en plafond général du BR.</text><rect x="35" y="875" width="1530" height="100" rx="10" fill="#fff0cc"/><text x="55" y="911" font-size="23" fill="#173b50">SUPPORT PÉDAGOGIQUE — PAS UNE PROCÉDURE VALIDÉE POUR LE SITE</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S02</text></g></svg>