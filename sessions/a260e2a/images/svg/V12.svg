<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Consignation pour des travaux : coordination</title><desc id="desc">Vue d’échanges ; modèle non contractuel, non destiné à être signé.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S02, S03.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V12 · Consignation pour des travaux : coordination</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Vue d’échanges ; modèle non contractuel, non destiné à être signé.</text><rect x="70" y="280" width="440" height="360" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="94" y="322" font-size="27" fill="#173b50">Exploitation</text><text x="94" y="363" font-size="22" fill="#173b50">Installation et disponibilité</text><text x="94" y="395" font-size="22" fill="#173b50">Limites et contraintes</text><text x="94" y="427" font-size="22" fill="#173b50">Autorisation selon organisation</text><rect x="580" y="280" width="440" height="360" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="604" y="322" font-size="27" fill="#173b50">BC</text><text x="604" y="363" font-size="22" fill="#173b50">Consignation du périmètre</text><text x="604" y="395" font-size="22" fill="#173b50">Information / documents</text><text x="604" y="427" font-size="22" fill="#173b50">Déconsignation organisée</text><rect x="1090" y="280" width="440" height="360" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="1114" y="322" font-size="27" fill="#173b50">B2V</text><text x="1114" y="363" font-size="22" fill="#173b50">Préparation des travaux</text><text x="1114" y="395" font-size="22" fill="#173b50">Zone et équipe</text><text x="1114" y="427" font-size="22" fill="#173b50">Restitution en fin de travaux</text><path d="M510,450 L580,450" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><path d="M1020,450 L1090,450" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><text x="100" y="760" font-size="26" fill="#173b50">Les responsabilités exactes, attestations et échanges dépendent de la procédure retenue.</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S02, S03</text></g></svg>