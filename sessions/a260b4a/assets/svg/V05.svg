<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">VAT et mesurage : objectifs distincts</title><desc id="desc">Une indication chiffrée seule ne constitue pas la preuve recherchée.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S01, S07.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V05 · VAT et mesurage : objectifs distincts</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Une indication chiffrée seule ne constitue pas la preuve recherchée.</text><rect x="90" y="250" width="650" height="400" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="114" y="292" font-size="27" fill="#173b50">VAT</text><text x="114" y="333" font-size="22" fill="#173b50">Établir l’absence de tension</text><text x="114" y="365" font-size="22" fill="#173b50">Appareil conçu pour cette fonction</text><text x="114" y="397" font-size="22" fill="#173b50">Adéquation AC/DC et domaine</text><text x="114" y="429" font-size="22" fill="#173b50">Notice de l’appareil à appliquer</text><rect x="860" y="250" width="650" height="400" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="884" y="292" font-size="27" fill="#173b50">Mesurage de diagnostic</text><text x="884" y="333" font-size="22" fill="#173b50">Rechercher une grandeur</text><text x="884" y="365" font-size="22" fill="#173b50">Choisir fonction et accessoires</text><text x="884" y="397" font-size="22" fill="#173b50">Maîtriser les risques du mesurage</text><text x="884" y="429" font-size="22" fill="#173b50">Ne remplace pas la VAT</text><text x="100" y="755" font-size="25" fill="#173b50">Pas de pointes dessinées sur des bornes : implantation et méthode à valider sur le matériel réel.</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S01, S07</text></g></svg>