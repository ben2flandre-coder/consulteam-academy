<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Lire une notice, pas seulement un marquage</title><desc id="desc">Document d’exercice : aucune référence ni valeur fabricant n’est inventée.</desc><rect width="1100" height="620" fill="#fff"/><style>text{font-family:Segoe UI,Arial,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect x="0" y="0" width="14" height="620" rx="0" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="40" y="56" font-size="34" fill="#102c53" font-weight="800">Lire une notice, pas seulement un marquage</text><text x="40" y="94" font-size="23" fill="#52677d" font-weight="500">Document d’exercice : aucune référence ni valeur fabricant n’est inventée.</text><rect x="45" y="146" width="440" height="340" rx="5" fill="#fff" stroke="#cbd8e5" stroke-width="3"/><rect x="45" y="146" width="440" height="65" rx="0" fill="#102c53" stroke="none" stroke-width="3"/><text x="67" y="189" font-size="26" fill="#fff" font-weight="700">IDENTIFIER</text><text x="69" y="256" font-size="21" fill="#52677d" font-weight="500">Produit et référence</text><text x="69" y="284" font-size="25" fill="#102c53" font-weight="700">________________________</text><text x="69" y="317" font-size="21" fill="#52677d" font-weight="500">Génération / édition</text><text x="69" y="345" font-size="25" fill="#102c53" font-weight="700">________________________</text><text x="69" y="378" font-size="21" fill="#52677d" font-weight="500">Fonction du système</text><text x="69" y="406" font-size="25" fill="#102c53" font-weight="700">________________________</text><text x="69" y="439" font-size="21" fill="#52677d" font-weight="500">Historique / suivi</text><text x="69" y="467" font-size="25" fill="#102c53" font-weight="700">________________________</text><rect x="600" y="146" width="440" height="340" rx="5" fill="#fff" stroke="#cbd8e5" stroke-width="3"/><rect x="600" y="146" width="440" height="65" rx="0" fill="#102c53" stroke="none" stroke-width="3"/><text x="622" y="189" font-size="26" fill="#fff" font-weight="700">VÉRIFIER L’EMPLOI</text><text x="624" y="256" font-size="21" fill="#52677d" font-weight="500">Combinaisons autorisées</text><text x="624" y="284" font-size="25" fill="#102c53" font-weight="700">________________________</text><text x="624" y="317" font-size="21" fill="#52677d" font-weight="500">Masse et position d’ancrage</text><text x="624" y="345" font-size="25" fill="#102c53" font-weight="700">________________________</text><text x="624" y="378" font-size="21" fill="#52677d" font-weight="500">Limites et espace libre</text><text x="624" y="406" font-size="25" fill="#102c53" font-weight="700">________________________</text><text x="624" y="439" font-size="21" fill="#52677d" font-weight="500">Contrôles et secours</text><text x="624" y="467" font-size="25" fill="#102c53" font-weight="700">________________________</text><path d="M505 300 L580 300" fill="none" stroke="#f6b63d" stroke-width="5"/><path d="M570 291 L580 300 L570 309" fill="none" stroke="#f6b63d" stroke-width="4"/><text x="81" y="535" font-size="26" fill="#b8322a" font-weight="700">Une information essentielle absente impose de différer la décision.</text><path d="M40 570 L1060 570" fill="none" stroke="#d6e0ea" stroke-width="2"/><text x="40" y="603" font-size="19" fill="#52677d" font-weight="500">Schéma de principe • à confronter à la notice et au site réel</text></svg>