<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t d" font-family="Segoe UI,system-ui,Arial,sans-serif"><title id="t">Flexion et torsion</title><desc id="d">À gauche, un personnage fléchi et tourné qui saisit une charge ; à droite, un personnage genoux fléchis, dos gainé, qui pivote avec les pieds.</desc><rect x="1" y="1" width="718" height="403" rx="16" fill="#fff" stroke="#e4dde9" stroke-width="2"/><text x="360" y="34" font-size="20" fill="#1b2a41" text-anchor="middle" font-weight="700" >Flexion + torsion : à éviter, à privilégier</text><rect x="30" y="52" width="320" height="310" rx="14" fill="#fdf3f2" stroke="#d33a2c" stroke-width="2.5"/><rect x="30" y="52" width="320" height="38" rx="14" fill="#d33a2c" stroke="#d33a2c" stroke-width="2"/><text x="190" y="77" font-size="17" fill="#fff" text-anchor="middle" font-weight="700" >À éviter</text><line x1="126.28571428571429" y1="217.42857142857142" x2="141.28571428571428" y2="268.0" stroke="#1b2a41" stroke-width="7" stroke-linecap="round"/><line x1="141.28571428571428" y1="268.0" x2="130" y2="318" stroke="#1b2a41" stroke-width="7" stroke-linecap="round"/><line x1="130" y1="318" x2="152" y2="318" stroke="#1b2a41" stroke-width="7" stroke-linecap="round"/><line x1="126.28571428571429" y1="217.42857142857142" x2="182.2568886320384" y2="182.4538999891799" stroke="#1b2a41" stroke-width="7" stroke-linecap="round"/><line x1="182.2568886320384" y1="182.4538999891799" x2="232.2568886320384" y2="224.4538999891799" stroke="#1b2a41" stroke-width="7" stroke-linecap="round"/><circle cx="196.67370626669765" cy="170.4452724972154" r="13" fill="#1b2a41"/><rect x="228.2568886320384" y="218.4538999891799" width="48" height="38" rx="4" fill="#c98f4f" stroke="#8a5a24" stroke-width="2"/><path d="M 158.2568886320384 166.4538999891799 q 24 -22 50 0" fill="none" stroke="#d33a2c" stroke-width="3"/><polygon points="209.2568886320384,166.4538999891799 200.2568886320384,158.4538999891799 199.2568886320384,172.4538999891799" fill="#d33a2c"/><text x="190" y="342" font-size="12.5" fill="#1b2a41" text-anchor="middle" font-weight="600" >dos fléchi et tourné en même temps</text><text x="190" y="358" font-size="11.5" fill="#5b5166" text-anchor="middle" font-weight="400" >le disque encaisse mal la torsion sous charge</text><line x1="60" y1="318" x2="320" y2="318" stroke="#e4dde9" stroke-width="3"/><rect x="370" y="52" width="320" height="310" rx="14" fill="#f2faf5" stroke="#2e9f5b" stroke-width="2.5"/><rect x="370" y="52" width="320" height="38" rx="14" fill="#2e9f5b" stroke="#2e9f5b" stroke-width="2"/><text x="530" y="77" font-size="17" fill="#fff" text-anchor="middle" font-weight="700" >À privilégier</text><line x1="444.0" y1="262.0" x2="489.0" y2="292.0" stroke="#1b2a41" stroke-width="7" stroke-linecap="round"/><line x1="489.0" y1="292.0" x2="470" y2="318" stroke="#1b2a41" stroke-width="7" stroke-linecap="round"/><line x1="470" y1="318" x2="492" y2="318" stroke="#1b2a41" stroke-width="7" stroke-linecap="round"/><line x1="444.0" y1="262.0" x2="466.5733294594941" y2="199.98028702813005" stroke="#1b2a41" stroke-width="7" stroke-linecap="round"/><line x1="466.5733294594941" y1="199.98028702813005" x2="492.5733294594941" y2="249.98028702813005" stroke="#1b2a41" stroke-width="7" stroke-linecap="round"/><circle cx="472.3876718960305" cy="181.0055124747696" r="13" fill="#1b2a41"/><rect x="488.5733294594941" y="245.98028702813005" width="48" height="38" rx="4" fill="#c98f4f" stroke="#8a5a24" stroke-width="2"/><line x1="500" y1="309" x2="555.5" y2="309.0" stroke="#2e9f5b" stroke-width="3" stroke-linecap="round"/><polygon points="560,309 551.8959760788259,312.9146898070011 551.8959760788259,305.0853101929989" fill="#2e9f5b"/><line x1="560" y1="309" x2="504.5" y2="309.0" stroke="#2e9f5b" stroke-width="3" stroke-linecap="round"/><polygon points="500,309 508.1040239211741,305.0853101929989 508.1040239211741,312.9146898070011" fill="#2e9f5b"/><text x="530" y="342" font-size="12.5" fill="#1b2a41" text-anchor="middle" font-weight="600" >genoux fléchis, dos gainé, charge collée</text><text x="530" y="358" font-size="11.5" fill="#5b5166" text-anchor="middle" font-weight="400" >pivoter avec les pieds, pas avec le dos</text><line x1="400" y1="318" x2="660" y2="318" stroke="#e4dde9" stroke-width="3"/></svg>