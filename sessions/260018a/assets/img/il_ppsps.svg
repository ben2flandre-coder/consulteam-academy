<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Calendrier du PPSPS : contrat signé, 30 jours, remise au coordonnateur, début des travaux"><title>Calendrier du PPSPS : contrat signé, 30 jours, remise au coordonnateur, début des travaux</title><defs></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}</style><rect width="1200" height="360" rx="22" fill="#f4f8fc"/><text x="600" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#0b2545">PPSPS : le calendrier d’une entreprise</text><path d="M90 150 H1110" stroke="#0b2545" stroke-width="6" stroke-linecap="round"/><circle cx="120" cy="150" r="26" fill="#095ea4" stroke="#fff" stroke-width="6"/><text x="120" y="175" text-anchor="middle" font-size="0"> </text><text x="120" y="212" text-anchor="middle" font-size="22" font-weight="800" fill="#0b2545">Contrat signé</text><text x="120" y="240" text-anchor="middle" font-size="15" fill="#53677d">réception par l’entreprise</text><circle cx="430" cy="150" r="26" fill="#f7bc46" stroke="#fff" stroke-width="6"/><text x="430" y="175" text-anchor="middle" font-size="0"> </text><text x="430" y="212" text-anchor="middle" font-size="22" font-weight="800" fill="#0b2545">30 jours</text><text x="430" y="240" text-anchor="middle" font-size="15" fill="#53677d">au plus pour établir le plan</text><circle cx="740" cy="150" r="26" fill="#0f8b8d" stroke="#fff" stroke-width="6"/><text x="740" y="175" text-anchor="middle" font-size="0"> </text><text x="740" y="212" text-anchor="middle" font-size="22" font-weight="800" fill="#0b2545">PPSPS remis</text><text x="740" y="240" text-anchor="middle" font-size="15" fill="#53677d">au coordonnateur SPS</text><circle cx="1050" cy="150" r="26" fill="#126448" stroke="#fff" stroke-width="6"/><text x="1050" y="175" text-anchor="middle" font-size="0"> </text><text x="1050" y="212" text-anchor="middle" font-size="22" font-weight="800" fill="#0b2545">Travaux</text><text x="1050" y="240" text-anchor="middle" font-size="15" fill="#53677d">plan établi avant le début</text><g font-size="14" font-weight="700" fill="#0b2545"><rect x="90" y="272" width="1020" height="64" rx="14" fill="#fff" stroke="#d5dfeb"/><circle cx="150" cy="304" r="9" fill="#095ea4"/><text x="170" y="309">Procédés d’exécution</text><circle cx="400" cy="304" r="9" fill="#c0392b"/><text x="420" y="309">Risques prévisibles</text><circle cx="650" cy="304" r="9" fill="#126448"/><text x="670" y="309">Protections collectives</text><circle cx="900" cy="304" r="9" fill="#f7bc46"/><text x="920" y="309">Secours et hygiène</text></g></svg>