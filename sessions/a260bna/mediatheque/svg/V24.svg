<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">VAT : contrôler aussi le vérificateur</title><desc id="desc">Repères de formation, sans tutoriel de manipulation sur une installation sous tension.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S01, S07, S10.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V24 · VAT : contrôler aussi le vérificateur</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Repères de formation, sans tutoriel de manipulation sur une installation sous tension.</text><rect x="60" y="250" width="460" height="420" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="84" y="292" font-size="27" fill="#173b50">Avant la vérification</text><text x="84" y="333" font-size="22" fill="#173b50">Définir la partie concernée</text><text x="84" y="365" font-size="22" fill="#173b50">Choisir le VAT adapté</text><text x="84" y="397" font-size="22" fill="#173b50">Lire sa notice exacte</text><text x="84" y="429" font-size="22" fill="#173b50">Vérifier son fonctionnement</text><rect x="570" y="250" width="460" height="420" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="594" y="292" font-size="27" fill="#173b50">Vérification</text><text x="594" y="333" font-size="22" fill="#173b50">Points et conducteurs à identifier</text><text x="594" y="365" font-size="22" fill="#173b50">Méthode prévue à appliquer</text><text x="594" y="397" font-size="22" fill="#173b50">Toute anomalie impose l’arrêt</text><text x="594" y="429" font-size="22" fill="#173b50">Pas de lecture fictive affichée</text><rect x="1080" y="250" width="460" height="420" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="1104" y="292" font-size="27" fill="#173b50">Après la vérification</text><text x="1104" y="333" font-size="22" fill="#173b50">Contrôler le fonctionnement</text><text x="1104" y="365" font-size="22" fill="#173b50">Selon la notice du matériel</text><text x="1104" y="397" font-size="22" fill="#173b50">Échec : résultat non établi</text><text x="1104" y="429" font-size="22" fill="#173b50">Faire résoudre le doute</text><path d="M520,450 L570,450" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><path d="M1030,450 L1080,450" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><text x="80" y="780" font-size="24" fill="#173b50">En formation : montrer le matériel réel et sa notice ; ce visuel ne prescrit pas les contacts de pointes.</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S01, S07, S10</text></g></svg>