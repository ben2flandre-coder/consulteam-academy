<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Séparer illustration et preuve</title><desc id="desc">Un rendu réaliste ne prouve aucun état électrique.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S01, S04.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V17 · Séparer illustration et preuve</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Un rendu réaliste ne prouve aucun état électrique.</text><rect x="80" y="260" width="640" height="390" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="104" y="302" font-size="27" fill="#173b50">Média illustratif</text><text x="104" y="343" font-size="22" fill="#173b50">Photo synthétique ou dessin</text><text x="104" y="375" font-size="22" fill="#173b50">Contexte fictif</text><text x="104" y="407" font-size="22" fill="#173b50">Aide à observer / questionner</text><text x="104" y="439" font-size="22" fill="#173b50">Aucune attestation de sécurité</text><rect x="880" y="260" width="640" height="390" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="904" y="302" font-size="27" fill="#173b50">Preuve opérationnelle</text><text x="904" y="343" font-size="22" fill="#173b50">Identification réelle</text><text x="904" y="375" font-size="22" fill="#173b50">Actes réalisés et contrôlés</text><text x="904" y="407" font-size="22" fill="#173b50">Documents applicables</text><text x="904" y="439" font-size="22" fill="#173b50">Validation des responsables</text><text x="100" y="770" font-size="28" fill="#173b50">Aucune procédure opérationnelle validée n’est contenue dans cette bibliothèque.</text><rect x="35" y="875" width="1530" height="100" rx="10" fill="#fff0cc"/><text x="55" y="911" font-size="23" fill="#173b50">SUPPORT PÉDAGOGIQUE — PAS UNE PROCÉDURE VALIDÉE POUR LE SITE</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S01, S04</text></g></svg>