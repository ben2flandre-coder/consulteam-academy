<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="t"><title id="t">Dimensions du garde-corps réglementaire</title><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#112f43}.b{font-weight:700}.w{fill:#fff}.s{font-size:13px}.xs{font-size:12px}.m{font-size:15px}.l{font-size:18px}.n{fill:#082b45}.red{fill:#b3261e}.grn{fill:#147a51}</style><rect width="100%" height="100%" rx="14" fill="#fff"/><text x="24" y="28" class="m b n">Garde-corps réglementaire (R. 4323-59)</text><rect x="30" y="292" width="400" height="16" fill="#cddae3"/><path d="M110 292 V84 M270 292 V84" stroke="#082b45" stroke-width="7"/><path d="M104 86 H276" stroke="#ec168c" stroke-width="7"/><path d="M110 190 H270" stroke="#075b9b" stroke-width="5"/><rect x="110" y="268" width="160" height="24" fill="#8ea3b1"/><path d="M64 84 v208" stroke="#112f43" stroke-width="2"/><path d="M58 92 l6 -9 l6 9 M58 284 l6 9 l6 -9" fill="none" stroke="#112f43" stroke-width="2"/><text x="52" y="188" transform="rotate(-90 52 188)" text-anchor="middle" class="s b">1 à 1,10 m</text><text x="290" y="90" class="s b red">main courante</text><text x="290" y="184" class="s b" style="fill:#075b9b">lisse intermédiaire</text><text x="290" y="202" class="xs">à mi-hauteur</text><text x="290" y="276" class="s b">plinthe de butée</text><text x="290" y="294" class="xs">10 à 15 cm</text><rect x="452" y="56" width="168" height="252" rx="12" fill="#f4f8fb" stroke="#cddae3"/><text x="468" y="84" class="m b n">Exigences</text><text x="468" y="110" class="xs">• rigide</text><text x="468" y="132" class="xs">• intégré ou fixé</text><text x="468" y="150" class="xs">  de manière sûre</text><text x="468" y="174" class="xs">• résistance</text><text x="468" y="192" class="xs">  appropriée</text><text x="468" y="222" class="xs">ou tout autre moyen</text><text x="468" y="240" class="xs">assurant une sécurité</text><text x="468" y="258" class="xs">équivalente</text></svg>