<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" role="img" aria-labelledby="t"><title id="t">Facteur de chute selon la position de l’ancrage</title><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#112f43}.b{font-weight:700}.w{fill:#fff}.s{font-size:13px}.xs{font-size:12px}.m{font-size:15px}.l{font-size:18px}.n{fill:#082b45}.red{fill:#b3261e}.grn{fill:#147a51}</style><rect width="100%" height="100%" rx="14" fill="#fff"/><text x="320" y="28" text-anchor="middle" class="l b n">Facteur de chute = H ÷ L</text><text x="320" y="46" text-anchor="middle" class="xs">H : hauteur de chute · L : longueur de liaison</text><rect x="20" y="58" width="290" height="262" rx="12" fill="#f4f8fb" stroke="#cddae3"/><text x="165" y="82" text-anchor="middle" class="m b n">Ancrage au-dessus de l’utilisateur</text><rect x="120" y="92" width="90" height="8" fill="#082b45"/><rect x="158" y="80" width="14" height="12" fill="#075b9b"/><path d="M165 92 V178" stroke="#075b9b" stroke-width="3"/><g stroke="#082b45" stroke-width="4" stroke-linecap="round" fill="none"><circle cx="165" cy="178" r="8.1" fill="#fff"/><path d="M165 186.1 v27.0 M165 192.4 l-12.6 12.6 M165 192.4 l12.6 12.6 M165 213.1 l-9.9 23.4 M165 213.1 l9.9 23.4"/></g><text x="200" y="140" class="xs b">L</text><text x="200" y="158" class="xs b red">H ≈ 0</text><text x="165" y="292" text-anchor="middle" class="m b grn">facteur ≈ 0 : le plus favorable</text><text x="165" y="310" text-anchor="middle" class="xs">chute libre quasi nulle</text><rect x="330" y="58" width="290" height="262" rx="12" fill="#f4f8fb" stroke="#cddae3"/><text x="475" y="82" text-anchor="middle" class="m b n">Ancrage sous l’utilisateur</text><rect x="400" y="176" width="110" height="8" fill="#082b45"/><rect x="448" y="164" width="14" height="12" fill="#075b9b"/><path d="M455 172 V136" stroke="#075b9b" stroke-width="3"/><g stroke="#082b45" stroke-width="4" stroke-linecap="round" fill="none"><circle cx="455" cy="92" r="5.4" fill="#fff"/><path d="M455 97.4 v18.0 M455 101.6 l-8.4 8.4 M455 101.6 l8.4 8.4 M455 115.4 l-6.6 15.6 M455 115.4 l6.6 15.6"/></g><path d="M455 176 V228" stroke="#075b9b" stroke-width="3" stroke-dasharray="5 4"/><g stroke="#b3261e" stroke-width="4" stroke-linecap="round" fill="none"><circle cx="455" cy="190" r="5.4" fill="#fff"/><path d="M455 195.4 v18.0 M455 199.6 l-8.4 8.4 M455 199.6 l8.4 8.4 M455 213.4 l-6.6 15.6 M455 213.4 l6.6 15.6"/></g><path d="M540 132 V232" stroke="#b3261e" stroke-width="2"/><path d="M534 226 l6 9 l6 -9" fill="none" stroke="#b3261e" stroke-width="2"/><text x="552" y="184" class="xs b red">H = 2 L</text><text x="478" y="130" class="xs b">L</text><text x="475" y="270" text-anchor="middle" class="m b red">facteur 2 : le plus sévère</text><text x="475" y="290" text-anchor="middle" class="xs">L de chute libre + L d’allongement</text></svg>