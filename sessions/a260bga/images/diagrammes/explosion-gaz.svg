<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t d" font-family="Segoe UI,system-ui,Arial,sans-serif"><title id="t">Explosion ou fuite de gaz</title><desc id="d">Une explosion et une personne qui s’éloigne ; interdits : flamme et interrupteur ; alerter le 18 ou le 112.</desc><rect x="1" y="1" width="718" height="403" rx="16" fill="#fff" stroke="#CFD9EA" stroke-width="2"/><text x="360" y="34" font-size="20" fill="#161616" text-anchor="middle" font-weight="700" >Explosion ou fuite de gaz : s’éloigner</text><polygon points="220,190 189,206 199,239 166,229 150,260 134,229 101,239 111,206 80,190 111,174 101,141 134,151 150,120 166,151 199,141 189,174" fill="#E8501E" stroke="#C23B12" stroke-width="4"/><polygon points="186,190 170,198 175,215 158,210 150,226 142,210 125,215 130,198 114,190 130,182 125,165 142,170 150,154 158,170 175,165 170,182" fill="#ffd54a"/><text x="150" y="290" font-size="13" fill="#C23B12" text-anchor="middle" font-weight="700" >zone dangereuse</text><circle cx="400" cy="150" r="11" fill="#161616"/><line x1="400" y1="162" x2="400" y2="205" stroke="#161616" stroke-width="6" stroke-linecap="round"/><line x1="400" y1="172" x2="384" y2="194" stroke="#161616" stroke-width="5" stroke-linecap="round"/><line x1="400" y1="172" x2="416" y2="194" stroke="#161616" stroke-width="5" stroke-linecap="round"/><line x1="400" y1="205" x2="386" y2="242" stroke="#161616" stroke-width="6" stroke-linecap="round"/><line x1="400" y1="205" x2="414" y2="242" stroke="#161616" stroke-width="6" stroke-linecap="round"/><line x1="300" y1="210" x2="354.0" y2="210.0" stroke="#1F8A70" stroke-width="6" stroke-linecap="round"/><polygon points="360,210 349.1946347717679,215.21958640933477 349.1946347717679,204.78041359066523" fill="#1F8A70"/><line x1="430" y1="262" x2="514.0" y2="262.0" stroke="#1F8A70" stroke-width="6" stroke-linecap="round"/><polygon points="520,262 509.1946347717679,267.21958640933474 509.1946347717679,256.78041359066526" fill="#1F8A70"/><text x="470" y="300" font-size="13" fill="#1F8A70" text-anchor="middle" font-weight="700" >s’éloigner, se mettre à l’abri</text><circle cx="560" cy="110" r="30" fill="#fff" stroke="#C23B12" stroke-width="5"/><line x1="539" y1="89" x2="581" y2="131" stroke="#C23B12" stroke-width="5"/><text x="560" y="162" font-size="12.5" fill="#161616" text-anchor="middle" font-weight="600" >flamme</text><circle cx="640" cy="110" r="30" fill="#fff" stroke="#C23B12" stroke-width="5"/><line x1="619" y1="89" x2="661" y2="131" stroke="#C23B12" stroke-width="5"/><text x="640" y="162" font-size="12.5" fill="#161616" text-anchor="middle" font-weight="600" >interrupteur</text><path transform="translate(560,122) scale(0.55)" d="M0 0 C-14 -16 -10 -34 0 -48 C2 -36 14 -30 12 -12 C10 -4 6 0 0 0Z" fill="#C23B12"/><path transform="translate(560,122) scale(0.55)" d="M0 0 C-6 -8 -4 -18 1 -24 C3 -16 8 -12 5 -4Z" fill="#ffd54a"/><rect x="632" y="96" width="16" height="28" rx="3" fill="#161616"/><rect x="637" y="100" width="6" height="10" rx="2" fill="#fff"/><text x="600" y="200" font-size="12.5" fill="#4d4d4d" text-anchor="middle" font-weight="400" >ni flamme, ni étincelle,</text><text x="600" y="218" font-size="12.5" fill="#4d4d4d" text-anchor="middle" font-weight="400" >ni interrupteur</text><rect x="30" y="330" width="660" height="44" rx="10" fill="#EEF3FA" stroke="#CFD9EA" stroke-width="1.5"/><text x="360" y="358" font-size="13" fill="#161616" text-anchor="middle" font-weight="600" >Alerter le 18 ou le 112 · ne pas revenir : une seconde explosion est possible</text></svg>