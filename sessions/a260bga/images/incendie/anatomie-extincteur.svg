e-width="1.5"/><text x="344" y="60" text-anchor="start" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="17" font-weight="700" fill="#2C3E50">Poignée de transport</text><circle cx="272" cy="125" r="4" fill="#2C3E50"/><polyline points="272,125 316,112 336,112" fill="none" stroke="#2C3E50" stroke-width="1.5"/><text x="344" y="118" text-anchor="start" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="17" font-weight="700" fill="#2C3E50">Poignée de commande</text><text x="344" y="138" text-anchor="start" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="400" fill="#4B4B4B">on la presse pour lâcher l’agent</text><circle cx="284" cy="136" r="4" fill="#2C3E50"/><polyline points="284,136 316,176 336,176" fill="none" stroke="#2C3E50" stroke-width="1.5"/><text x="344" y="182" text-anchor="start" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="17" font-weight="700" fill="#2C3E50">Goupille et scellé</text><text x="344" y="202" text-anchor="start" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="400" fill="#4B4B4B">à retirer en premier</text><circle cx="238" cy="146" r="4" fill="#2C3E50"/><polyline points="238,146 316,240 336,240" fill="none" stroke="#2C3E50" stroke-width="1.5"/><text x="344" y="246" text-anchor="start" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="17" font-weight="700" fill="#2C3E50">Manomètre</text><text x="344" y="266" text-anchor="start" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="400" fill="#4B4B4B">sur les appareils à pression permanente</text><circle cx="234" cy="270" r="4" fill="#2C3E50"/><polyline points="234,270 316,304 336,304" fill="none" stroke="#2C3E50" stroke-width="1.5"/><text x="344" y="310" text-anchor="start" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="17" font-weight="700" fill="#2C3E50">Étiquette</text><tex