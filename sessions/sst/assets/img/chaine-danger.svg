<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Du danger au dommage</title><desc id="d">Chaîne en quatre temps, avec l’exemple d’un sol mouillé : danger, situation dangereuse, événement déclencheur, dommage.</desc><rect width="1200" height="560" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Du danger au dommage</text><rect x="52.0" y="150" width="250" height="250" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="52.0" y="150" width="250" height="58" rx="14" fill="#102c53"/><rect x="52.0" y="190" width="250" height="18" fill="#102c53"/><text x="177.0" y="189" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Danger</text><circle cx="82.0" cy="144" r="22" fill="#f6b63d" stroke="#102c53" stroke-width="3"/><text x="82.0" y="152" font-size="24" font-weight="700" fill="#102c53" text-anchor="middle">1</text><text x="177.0" y="248" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">Ce qui peut</text><text x="177.0" y="275" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">faire mal</text><text x="177.0" y="303" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">Ex. un sol mouillé</text><path d="M305.0 275H317.0" stroke="#102c53" stroke-width="5" fill="none"/><path d="M331.0 275l-18 -11v22z" fill="#102c53"/><rect x="334.0" y="150" width="250" height="250" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="334.0" y="150" width="250" height="58" rx="14" fill="#102c53"/><rect x="334.0" y="190" width="250" height="18" fill="#102c53"/><text x="459.0" y="189" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="700">Situation dangereuse</text><circle cx="364.0" cy="144" r="22" fill="#f6b63d" stroke="#102c53" stroke-width="3"/><text x="364.0" y="152" font-size="24" font-weight="700" fill="#102c53" text-anchor="middle">2</text><text x="459.0" y="248" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">Une personne y est</text><text x="459.0" y="275" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">exposée</text><text x="459.0" y="303" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">Ex. elle circule</text><text x="459.0" y="330" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">sur le sol mouillé</text><path d="M587.0 275H599.0" stroke="#102c53" stroke-width="5" fill="none"/><path d="M613.0 275l-18 -11v22z" fill="#102c53"/><rect x="616.0" y="150" width="250" height="250" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="616.0" y="150" width="250" height="58" rx="14" fill="#102c53"/><rect x="616.0" y="190" width="250" height="18" fill="#102c53"/><text x="741.0" y="189" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="700">Événement déclencheur</text><circle cx="646.0" cy="144" r="22" fill="#f6b63d" stroke="#102c53" stroke-width="3"/><text x="646.0" y="152" font-size="24" font-weight="700" fill="#102c53" text-anchor="middle">3</text><text x="741.0" y="248" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">Ce qui fait</text><text x="741.0" y="275" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">passer à l’accident</text><text x="741.0" y="303" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">Ex. une glissade</text><path d="M869.0 275H881.0" stroke="#102c53" stroke-width="5" fill="none"/><path d="M895.0 275l-18 -11v22z" fill="#102c53"/><rect x="898.0" y="150" width="250" height="250" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="898.0" y="150" width="250" height="58" rx="14" fill="#102c53"/><rect x="898.0" y="190" width="250" height="18" fill="#102c53"/><text x="1023.0" y="189" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Dommage</text><circle cx="928.0" cy="144" r="22" fill="#f6b63d" stroke="#102c53" stroke-width="3"/><text x="928.0" y="152" font-size="24" font-weight="700" fill="#102c53" text-anchor="middle">4</text><text x="1023.0" y="248" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">La blessure</text><text x="1023.0" y="275" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">Ex. une fracture</text><text x="1023.0" y="303" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">du poignet</text><rect x="52.0" y="445" width="1096" height="64" rx="12" fill="#fff6dc" stroke="#f6b63d" stroke-width="2"/><text x="600" y="485" font-size="22" fill="#102c53" text-anchor="middle" font-weight="700">On prévient en agissant sur le danger ou sur l’exposition, avant l’événement.</text><text x="1160" y="544" font-size="14" text-anchor="end" fill="#53657a">Consulteam · SST</text></svg>