<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Sauveteur secouriste : les quatre temps</title><desc id="d">Protéger, examiner, alerter, secourir.</desc><rect width="1200" height="675" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Sauveteur secouriste : les quatre temps</text><rect x="40" y="150" width="255" height="340" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><circle cx="167" cy="215" r="40" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="167" y="230" font-size="44" fill="#102c53" text-anchor="middle" font-weight="700">1</text><text x="167" y="320" font-size="36" fill="#102c53" text-anchor="middle" font-weight="700">Protéger</text><text x="167" y="370.0" font-size="22" fill="#5a6b80" text-anchor="middle" font-weight="400">écarter le danger</text><line x1="295" y1="320" x2="319.0" y2="320.0" stroke="#0b68ae" stroke-width="5"/><polygon points="325,320 310.6,327.0 310.6,313.0" fill="#0b68ae"/><rect x="325" y="150" width="255" height="340" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><circle cx="452" cy="215" r="40" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="452" y="230" font-size="44" fill="#102c53" text-anchor="middle" font-weight="700">2</text><text x="452" y="320" font-size="36" fill="#102c53" text-anchor="middle" font-weight="700">Examiner</text><text x="452" y="370.0" font-size="22" fill="#5a6b80" text-anchor="middle" font-weight="400">saigne ? s’étouffe ?</text><text x="452" y="397.5" font-size="22" fill="#5a6b80" text-anchor="middle" font-weight="400">répond ? respire ?</text><line x1="580" y1="320" x2="604.0" y2="320.0" stroke="#0b68ae" stroke-width="5"/><polygon points="610,320 595.6,327.0 595.6,313.0" fill="#0b68ae"/><rect x="610" y="150" width="255" height="340" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><circle cx="737" cy="215" r="40" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="737" y="230" font-size="44" fill="#102c53" text-anchor="middle" font-weight="700">3</text><text x="737" y="320" font-size="36" fill="#102c53" text-anchor="middle" font-weight="700">Alerter</text><text x="737" y="370.0" font-size="22" fill="#5a6b80" text-anchor="middle" font-weight="400">15 · 18 · 112</text><line x1="865" y1="320" x2="889.0" y2="320.0" stroke="#0b68ae" stroke-width="5"/><polygon points="895,320 880.6,327.0 880.6,313.0" fill="#0b68ae"/><rect x="895" y="150" width="255" height="340" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><circle cx="1022" cy="215" r="40" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="1022" y="230" font-size="44" fill="#102c53" text-anchor="middle" font-weight="700">4</text><text x="1022" y="320" font-size="36" fill="#102c53" text-anchor="middle" font-weight="700">Secourir</text><text x="1022" y="370.0" font-size="22" fill="#5a6b80" text-anchor="middle" font-weight="400">geste adapté,</text><text x="1022" y="397.5" font-size="22" fill="#5a6b80" text-anchor="middle" font-weight="400">surveiller</text><rect x="60" y="530" width="1080" height="90" rx="14" fill="#fff7e0" stroke="#f6b63d" stroke-width="2.5"/><text x="80" y="585" font-size="26" fill="#102c53" text-anchor="start" font-weight="700">En cas de doute sur le danger : ne pas approcher, faire alerter.</text><text x="40" y="653" font-size="18" fill="#5a6b80" text-anchor="start" font-weight="400">Démarche SST (INRS). Référentiel en vigueur et formateur certifié font foi.</text></svg>