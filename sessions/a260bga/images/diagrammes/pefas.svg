<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t d" font-family="Segoe UI,system-ui,Arial,sans-serif"><title id="t">PEFAS</title><desc id="d">Quatre étapes de la conduite à tenir en cas d’accident : protéger, examiner, faire alerter, secourir.</desc><rect x="1" y="1" width="718" height="403" rx="16" fill="#fff" stroke="#e4dde9" stroke-width="2"/><text x="360" y="34" font-size="20" fill="#1b2a41" text-anchor="middle" font-weight="700" >PEFAS : protéger, examiner, faire alerter, secourir</text><rect x="26" y="70" width="156" height="230" rx="12" fill="#e5007d" stroke="none" stroke-width="2"/><circle cx="104" cy="122" r="36" fill="#fff"/><text x="104" y="134" font-size="32" fill="#e5007d" text-anchor="middle" font-weight="800" >P</text><text x="104" y="190" font-size="17" fill="#fff" text-anchor="middle" font-weight="700" >Protéger</text><text x="104" y="214" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >se protéger, écarter</text><text x="104" y="230" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >le danger, baliser,</text><text x="104" y="246" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >couper le courant ou</text><text x="104" y="262" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >le gaz si possible</text><line x1="184" y1="185" x2="192.5" y2="185.0" stroke="#5b5166" stroke-width="3" stroke-linecap="round"/><polygon points="196,185 189.69687028353127,188.04475873877863 189.69687028353127,181.95524126122137" fill="#5b5166"/><rect x="198" y="70" width="156" height="230" rx="12" fill="#db0d5d" stroke="none" stroke-width="2"/><circle cx="276" cy="122" r="36" fill="#fff"/><text x="276" y="134" font-size="32" fill="#db0d5d" text-anchor="middle" font-weight="800" >E</text><text x="276" y="190" font-size="17" fill="#fff" text-anchor="middle" font-weight="700" >Examiner</text><text x="276" y="214" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >la victime :</text><text x="276" y="230" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >consciente ? respire ?</text><text x="276" y="246" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >saigne ?</text><line x1="356" y1="185" x2="364.5" y2="185.0" stroke="#5b5166" stroke-width="3" stroke-linecap="round"/><polygon points="368,185 361.69687028353127,188.04475873877863 361.69687028353127,181.95524126122137" fill="#5b5166"/><rect x="370" y="70" width="156" height="230" rx="12" fill="#d21b3e" stroke="none" stroke-width="2"/><circle cx="448" cy="122" r="36" fill="#fff"/><text x="448" y="134" font-size="32" fill="#d21b3e" text-anchor="middle" font-weight="800" >FA</text><text x="448" y="190" font-size="17" fill="#fff" text-anchor="middle" font-weight="700" >Faire alerter</text><text x="448" y="214" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >15, 18 ou 112 : qui,</text><text x="448" y="230" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >où, quoi ; ne pas</text><text x="448" y="246" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >raccrocher le premier</text><line x1="528" y1="185" x2="536.5" y2="185.0" stroke="#5b5166" stroke-width="3" stroke-linecap="round"/><polygon points="540,185 533.6968702835312,188.04475873877863 533.6968702835312,181.95524126122137" fill="#5b5166"/><rect x="542" y="70" width="156" height="230" rx="12" fill="#c8281e" stroke="none" stroke-width="2"/><circle cx="620" cy="122" r="36" fill="#fff"/><text x="620" y="134" font-size="32" fill="#c8281e" text-anchor="middle" font-weight="800" >S</text><text x="620" y="190" font-size="17" fill="#fff" text-anchor="middle" font-weight="700" >Secourir</text><text x="620" y="214" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >le geste adapté à la</text><text x="620" y="230" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >victime, jusqu’à</text><text x="620" y="246" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >l’arrivée des secours</text><text x="360" y="336" font-size="13.5" fill="#1b2a41" text-anchor="middle" font-weight="600" >Brûlure : refroidir longuement à l’eau courante, sans retirer ce qui adhère.</text><text x="360" y="360" font-size="13.5" fill="#1b2a41" text-anchor="middle" font-weight="600" >Explosion ou fuite de gaz : s’éloigner et alerter, ne pas revenir.</text><text x="360" y="388" font-size="11.5" fill="#5b5166" text-anchor="middle" font-weight="400" >À adapter au référentiel SST du formateur.</text></svg>