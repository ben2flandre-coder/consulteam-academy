<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Après l’arrêt d’une chute</title><desc id="desc">L’alerte, la protection et la récupération préparée se coordonnent.</desc><rect width="1100" height="620" fill="#fff"/><style>text{font-family:Segoe UI,Arial,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect x="0" y="0" width="14" height="620" rx="0" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="40" y="56" font-size="34" fill="#102c53" font-weight="800">Après l’arrêt d’une chute</text><text x="40" y="94" font-size="23" fill="#52677d" font-weight="500">L’alerte, la protection et la récupération préparée se coordonnent.</text><rect x="60" y="180" width="222" height="246" rx="14" fill="#102c53" stroke="none" stroke-width="3"/><text x="80" y="230" font-size="43" fill="#fff" font-weight="800">1</text><text x="80" y="298" font-size="23" fill="#fff" font-weight="500">ALERTER</text><text x="80" y="335" font-size="23" fill="#fff" font-weight="500">Lieu exact</text><text x="80" y="372" font-size="23" fill="#fff" font-weight="500">Durée, état</text><rect x="314" y="180" width="222" height="246" rx="14" fill="#e7eff7" stroke="none" stroke-width="3"/><text x="334" y="230" font-size="43" fill="#0b68ae" font-weight="800">2</text><text x="334" y="298" font-size="23" fill="#102c53" font-weight="500">PROTÉGER</text><text x="334" y="335" font-size="23" fill="#102c53" font-weight="500">Éviter un</text><text x="334" y="372" font-size="23" fill="#102c53" font-weight="500">second accident</text><rect x="568" y="180" width="222" height="246" rx="14" fill="#e8f4ed" stroke="none" stroke-width="3"/><text x="588" y="230" font-size="43" fill="#0b68ae" font-weight="800">3</text><text x="588" y="298" font-size="23" fill="#102c53" font-weight="500">RÉCUPÉRER</text><text x="588" y="335" font-size="23" fill="#102c53" font-weight="500">Procédure prévue</text><text x="588" y="372" font-size="23" fill="#102c53" font-weight="500">Intervenants formés</text><rect x="822" y="180" width="222" height="246" rx="14" fill="#fff5d9" stroke="none" stroke-width="3"/><text x="842" y="230" font-size="43" fill="#0b68ae" font-weight="800">4</text><text x="842" y="298" font-size="23" fill="#102c53" font-weight="500">ÉCARTER</text><text x="842" y="335" font-size="23" fill="#102c53" font-weight="500">Équipements</text><text x="842" y="372" font-size="23" fill="#102c53" font-weight="500">Traçabilité</text><text x="80" y="504" font-size="24" fill="#102c53" font-weight="700">Après récupération : examen et gestes selon la formation du secouriste.</text><path d="M40 570 L1060 570" fill="none" stroke="#d6e0ea" stroke-width="2"/><text x="40" y="603" font-size="19" fill="#52677d" font-weight="500">Aucun délai de suspension « sûr » • suivre les consignes du plan de secours et la régulation médicale</text></svg>