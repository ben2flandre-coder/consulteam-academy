<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">B2V, BR, BC : trois missions</title><desc id="desc">Le titre employeur et la tâche réelle déterminent le périmètre.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S02, S03.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V01 · B2V, BR, BC : trois missions</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Le titre employeur et la tâche réelle déterminent le périmètre.</text><rect x="60" y="240" width="460" height="390" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="84" y="282" font-size="27" fill="#173b50">B2V</text><text x="84" y="323" font-size="22" fill="#173b50">Chargé de travaux BT</text><text x="84" y="355" font-size="22" fill="#173b50">Organisation et surveillance</text><text x="84" y="387" font-size="22" fill="#173b50">Travaux hors tension</text><text x="84" y="419" font-size="22" fill="#173b50">Voisinage si autorisé et maîtrisé</text><rect x="570" y="240" width="460" height="390" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="594" y="282" font-size="27" fill="#173b50">BR</text><text x="594" y="323" font-size="22" fill="#173b50">Chargé d’intervention générale</text><text x="594" y="355" font-size="22" fill="#173b50">Dépannage BT de faible étendue</text><text x="594" y="387" font-size="22" fill="#173b50">Durée courte ; périmètre défini</text><text x="594" y="419" font-size="22" fill="#173b50">Consignation dans ce cadre</text><rect x="1080" y="240" width="460" height="390" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="1104" y="282" font-size="27" fill="#173b50">BC</text><text x="1104" y="323" font-size="22" fill="#173b50">Chargé de consignation BT</text><text x="1104" y="355" font-size="22" fill="#173b50">Consignation / déconsignation</text><text x="1104" y="387" font-size="22" fill="#173b50">Pour les travaux confiés</text><text x="1104" y="419" font-size="22" fill="#173b50">Pas de travaux par ce seul titre</text><text x="80" y="730" font-size="27" fill="#173b50">Cumul de symboles possible : vérifier les symboles et limites figurant sur le titre.</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S02, S03</text></g></svg>