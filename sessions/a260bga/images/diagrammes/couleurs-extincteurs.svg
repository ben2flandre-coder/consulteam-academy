<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t d" font-family="Segoe UI,system-ui,Arial,sans-serif"><title id="t">Couleurs des extincteurs</title><desc id="d">Trois extincteurs à corps rouge avec étiquette bleue (eau), jaune (poudre), grise (CO2) ; seule l’étiquette fait foi.</desc><rect x="1" y="1" width="718" height="403" rx="16" fill="#fff" stroke="#e4dde9" stroke-width="2"/><text x="360" y="34" font-size="20" fill="#1b2a41" text-anchor="middle" font-weight="700" >Repères de couleur : indicatifs, jamais suffisants</text><rect x="74" y="70" width="52" height="150" rx="14" fill="#c62828" stroke="#8e1b1b" stroke-width="2"/><rect x="84" y="56" width="32" height="18" rx="4" fill="#444" stroke="none" stroke-width="2"/><path d="M 116 62 q 30 -4 30 22 v 40" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/><rect x="78" y="122" width="44" height="46" rx="6" fill="#2d6fd1" stroke="#00000033" stroke-width="1.5"/><text x="100" y="250" font-size="15" fill="#1b2a41" text-anchor="middle" font-weight="700" >Eau</text><text x="100" y="268" font-size="11.5" fill="#5b5166" text-anchor="middle" font-weight="400" >bleu (parfois vert)</text><rect x="234" y="70" width="52" height="150" rx="14" fill="#c62828" stroke="#8e1b1b" stroke-width="2"/><rect x="244" y="56" width="32" height="18" rx="4" fill="#444" stroke="none" stroke-width="2"/><path d="M 276 62 q 30 -4 30 22 v 40" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/><rect x="238" y="122" width="44" height="46" rx="6" fill="#f2c200" stroke="#00000033" stroke-width="1.5"/><text x="260" y="250" font-size="15" fill="#1b2a41" text-anchor="middle" font-weight="700" >Poudre</text><text x="260" y="268" font-size="11.5" fill="#5b5166" text-anchor="middle" font-weight="400" >jaune</text><rect x="394" y="70" width="52" height="150" rx="14" fill="#c62828" stroke="#8e1b1b" stroke-width="2"/><rect x="404" y="56" width="32" height="18" rx="4" fill="#444" stroke="none" stroke-width="2"/><path d="M 436 62 q 30 -4 30 22 v 40" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/><rect x="398" y="122" width="44" height="46" rx="6" fill="#6b6b6b" stroke="#00000033" stroke-width="1.5"/><text x="420" y="250" font-size="15" fill="#1b2a41" text-anchor="middle" font-weight="700" >CO₂</text><text x="420" y="268" font-size="11.5" fill="#5b5166" text-anchor="middle" font-weight="400" >gris ou noir</text><rect x="520" y="86" width="170" height="170" rx="14" fill="#fdf3f2" stroke="#d33a2c" stroke-width="2"/><text x="605" y="112" font-size="15" fill="#d33a2c" text-anchor="middle" font-weight="800" >Corps rouge</text><text x="605" y="134" font-size="12.5" fill="#1b2a41" text-anchor="middle" font-weight="400" >Toujours le même :</text><text x="605" y="151" font-size="12.5" fill="#1b2a41" text-anchor="middle" font-weight="400" >il ne dit pas</text><text x="605" y="168" font-size="12.5" fill="#1b2a41" text-anchor="middle" font-weight="400" >quel agent contient</text><text x="605" y="185" font-size="12.5" fill="#1b2a41" text-anchor="middle" font-weight="400" >l’appareil.</text><text x="605" y="214" font-size="13.5" fill="#d33a2c" text-anchor="middle" font-weight="800" >Seule l’étiquette</text><text x="605" y="232" font-size="13.5" fill="#d33a2c" text-anchor="middle" font-weight="800" >fait foi.</text><text x="360" y="386" font-size="12" fill="#5b5166" text-anchor="middle" font-weight="400" >Code non universel : varie selon le fabricant et l’âge de l’appareil. Vert : fluor ou douche de secours.</text></svg>