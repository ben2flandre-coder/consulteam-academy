<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Nettoyage et électricité : coordonner</title><desc id="desc">Scène d’analyse agroalimentaire fictive.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S01, S04.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V11 · Nettoyage et électricité : coordonner</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Scène d’analyse agroalimentaire fictive.</text><rect x="80" y="250" width="630" height="430" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="104" y="292" font-size="27" fill="#173b50">Équipe de nettoyage</text><text x="104" y="333" font-size="22" fill="#173b50">Lavage planifié</text><text x="104" y="365" font-size="22" fill="#173b50">Produits / humidité</text><text x="104" y="397" font-size="22" fill="#173b50">Accès et horaires partagés</text><text x="104" y="429" font-size="22" fill="#173b50">État de la zone à signaler</text><rect x="890" y="250" width="630" height="430" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="914" y="292" font-size="27" fill="#173b50">Équipe de maintenance</text><text x="914" y="333" font-size="22" fill="#173b50">Intervention préparée</text><text x="914" y="365" font-size="22" fill="#173b50">Équipement et accès identifiés</text><text x="914" y="397" font-size="22" fill="#173b50">Protection contre les projections</text><text x="914" y="429" font-size="22" fill="#173b50">Conditions de reprise définies</text><path d="M710,460 L890,460" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><text x="100" y="770" font-size="27" fill="#173b50">Ne pas ouvrir un coffret exposé au lavage ; suspendre et faire sécuriser la situation.</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S01, S04</text></g></svg>