<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">EPI : partir de l’analyse de l’opération</title><desc id="desc">Le symbole d’habilitation ne suffit pas à choisir les protections.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S01.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V10 · EPI : partir de l’analyse de l’opération</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Le symbole d’habilitation ne suffit pas à choisir les protections.</text><rect x="80" y="300" width="390" height="270" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="104" y="342" font-size="27" fill="#173b50">Risques réels</text><text x="104" y="383" font-size="22" fill="#173b50">Contact / arc / projection</text><text x="104" y="415" font-size="22" fill="#173b50">Énergie disponible</text><text x="104" y="447" font-size="22" fill="#173b50">Environnement / tâche</text><rect x="600" y="300" width="400" height="270" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="624" y="342" font-size="27" fill="#173b50">Choix documenté</text><text x="624" y="383" font-size="22" fill="#173b50">Performance adaptée</text><text x="624" y="415" font-size="22" fill="#173b50">Compatibilité des EPI</text><text x="624" y="447" font-size="22" fill="#173b50">Notice et état</text><rect x="1130" y="300" width="390" height="270" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="1154" y="342" font-size="27" fill="#173b50">Avant emploi</text><text x="1154" y="383" font-size="22" fill="#173b50">Vérifications prévues</text><text x="1154" y="415" font-size="22" fill="#173b50">Limites d’utilisation</text><text x="1154" y="447" font-size="22" fill="#173b50">Personnel formé</text><path d="M470,440 L600,440" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><path d="M1000,440 L1130,440" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><text x="100" y="745" font-size="27" fill="#173b50">Aucune classe, catégorie d’arc ou protection universelle attribuée à B2V, BR ou BC.</text><rect x="35" y="875" width="1530" height="100" rx="10" fill="#fff0cc"/><text x="55" y="911" font-size="23" fill="#173b50">SUPPORT PÉDAGOGIQUE — PAS UNE PROCÉDURE VALIDÉE POUR LE SITE</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S01</text></g></svg>