<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t d" font-family="Segoe UI,system-ui,Arial,sans-serif"><title id="t">Du danger au dommage</title><desc id="d">Quatre étapes : danger, situation dangereuse, événement déclencheur, dommage ; deux leviers d’action sur le risque.</desc><rect x="1" y="1" width="718" height="403" rx="16" fill="#fff" stroke="#e4dde9" stroke-width="2"/><text x="360" y="40" font-size="22" fill="#1b2a41" text-anchor="middle" font-weight="700" >Du danger au dommage</text><rect x="18" y="80" width="152" height="140" rx="12" fill="#e5007d" stroke="none" stroke-width="2"/><text x="94.0" y="130" font-size="16" fill="#fff" text-anchor="middle" font-weight="700" >Danger</text><text x="94.0" y="172" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="400" >charge, geste,</text><text x="94.0" y="189" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="400" >cadence</text><line x1="173" y1="150" x2="192.5" y2="150.0" stroke="#5b5166" stroke-width="3" stroke-linecap="round"/><polygon points="197,150 188.8959760788259,153.91468980700108 188.8959760788259,146.08531019299892" fill="#5b5166"/><rect x="200" y="80" width="152" height="140" rx="12" fill="#db0d5d" stroke="none" stroke-width="2"/><text x="276.0" y="118" font-size="16" fill="#fff" text-anchor="middle" font-weight="700" >Situation</text><text x="276.0" y="138" font-size="16" fill="#fff" text-anchor="middle" font-weight="700" >dangereuse</text><text x="276.0" y="172" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="400" >exposition</text><text x="276.0" y="189" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="400" >répétée</text><line x1="355" y1="150" x2="374.5" y2="150.0" stroke="#5b5166" stroke-width="3" stroke-linecap="round"/><polygon points="379,150 370.8959760788259,153.91468980700108 370.8959760788259,146.08531019299892" fill="#5b5166"/><rect x="382" y="80" width="152" height="140" rx="12" fill="#d21b3e