cuit (organe</text><text class="lbl" x="702" y="244" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">magnétique)</text><circle cx="682" cy="267" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="272" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">4</text><text class="lbl" x="702" y="272" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Mécanisme à déclenchement : ouvre</text><text class="lbl" x="702" y="290" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">les contacts</text><circle cx="682" cy="313" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="318" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">5</text><text class="lbl" x="702" y="318" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Manette de manœuvre</text><circle cx="682" cy="343" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="348" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">6</text><text class="lbl" x="702" y="348" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Contacts fixe et mobile (ouverts</text><text class="lbl" x="702" y="366" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">en pointillé, arc en rouge)</text><circle cx="682" cy="389" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="394" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">7</text><text class="lbl" x="702" y="394" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Chambre de coupure : divise l&#x27;arc</text><circle cx="682" cy="419" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="424" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">8</text><text class="lbl" x="702" y="424" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Borne aval (départ)</text><circle cx="682" cy="449" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="454" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">9</text><text class="lbl" x="702" y="454" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Clip de fixation sur le rail</text><text class="lbl" x="24" y="564" font-size="12" font-weight="400" text-anchor="start" fill="#53657a">Ordre des éléments d&#x27;après S10 ; organes d&#x27;après S2. Disposition simplifiée : elle varie selon les fabricants.</text></svg>