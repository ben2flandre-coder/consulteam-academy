t="700">Tracer et</text><text x="1030.0" y="393.16" font-size="24" fill="#102c53" text-anchor="middle" font-weight="700">mettre à jour</text><rect x="60" y="520" width="1080" height="100" rx="14" fill="#fff7e0" stroke="#f6b63d" stroke-width="2.5"/><text x="80" y="562.0" font-size="23" fill="#102c53" text-anchor="start" font-weight="700">Le document unique est vivant :</text><text x="80" y="590.75" font-size="23" fill="#102c53" text-anchor="start" font-weight="700">mise à jour après chaque changement important ou accident.</text><text x="40" y="653" font-size="18" fill="#5a6b80" text-anchor="start" font-weight="400">Code du travail L. 4121-3, R. 4121-1 à R. 4121-4.</text></svg>