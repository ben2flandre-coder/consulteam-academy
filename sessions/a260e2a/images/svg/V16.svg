<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Repérage incertain : arrêter et résoudre</title><desc id="desc">Exemple d’incohérence, volontairement sans manipulation.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S01, S04.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V16 · Repérage incertain : arrêter et résoudre</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Exemple d’incohérence, volontairement sans manipulation.</text><rect x="70" y="250" width="440" height="340" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="94" y="292" font-size="27" fill="#173b50">Plan</text><text x="94" y="333" font-size="22" fill="#173b50">Départ : convoyeur A</text><text x="94" y="365" font-size="22" fill="#173b50">Version à confirmer</text><rect x="580" y="250" width="440" height="340" rx="16" fill="#ffe8de" stroke="#497281" stroke-width="2"/><text x="604" y="292" font-size="27" fill="#173b50">Terrain</text><text x="604" y="333" font-size="22" fill="#173b50">Étiquette illisible</text><text x="604" y="365" font-size="22" fill="#173b50">Correspondance non prouvée</text><rect x="1090" y="250" width="440" height="340" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="1114" y="292" font-size="27" fill="#173b50">Décision</text><text x="1114" y="333" font-size="22" fill="#173b50">Suspendre l’opération</text><text x="1114" y="365" font-size="22" fill="#173b50">Faire lever le doute</text><text x="1114" y="397" font-size="22" fill="#173b50">Mettre à jour le dossier</text><path d="M510,420 L580,420" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><path d="M1020,420 L1090,420" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><text x="100" y="750" font-size="25" fill="#173b50">Ne pas identifier par la seule proximité, la couleur d’un câble ou l’arrêt apparent d’une machine.</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S01, S04</text></g></svg>