<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img"><title>Accident ou anomalie grave — quatre étapes</title><rect width="1600" height="600" rx="28" fill="#edf4fa"/><text x="55" y="80" font-family="Arial,sans-serif" font-size="23" letter-spacing="4" fill="#095ea4">CONSUL TEAM · F22</text><text x="55" y="142" font-family="Arial,sans-serif" font-size="40" font-weight="bold" fill="#0b2545">Accident ou anomalie grave</text><rect x="55" y="198" width="348" height="312" rx="20" fill="white" stroke="#c6d8e9" stroke-width="2"/><circle cx="107" cy="254" r="28" fill="#0b2545"/><text x="107" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#f7bc46" font-weight="bold">1</text><text x="82" y="321" font-family="Arial,sans-serif" font-size="29" fill="#172941">Ne pas s’exposer ni</text><text x="82" y="360" font-family="Arial,sans-serif" font-size="29" fill="#172941">toucher avant</text><text x="82" y="399" font-family="Arial,sans-serif" font-size="29" fill="#172941">sécurité</text><path d="M408 352h20m-9-10 10 10-10 10" stroke="#095ea4" stroke-width="4" fill="none"/><rect x="435" y="198" width="348" height="312" rx="20" fill="white" stroke="#c6d8e9" stroke-width="2"/><circle cx="487" cy="254" r="28" fill="#0b2545"/><text x="487" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#f7bc46" font-weight="bold">2</text><text x="462" y="321" font-family="Arial,sans-serif" font-size="29" fill="#172941">Empêcher l’approche</text><text x="462" y="360" font-family="Arial,sans-serif" font-size="29" fill="#172941">des tiers</text><path d="M788 352h20m-9-10 10 10-10 10" stroke="#095ea4" stroke-width="4" fill="none"/><rect x="815" y="198" width="348" height="312" rx="20" fill="white" stroke="#c6d8e9" stroke-width="2"/><circle cx="867" cy="254" r="28" fill="#0b2545"/><text x="867" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#f7bc46" font-weight="bold">3</text><text x="842" y="321" font-family="Arial,sans-serif" font-size="29" fill="#172941">Alerter avec lieu,</text><text x="842" y="360" font-family="Arial,sans-serif" font-size="29" fill="#172941">danger et victimes</text><path d="M1168 352h20m-9-10 10 10-10 10" stroke="#095ea4" stroke-width="4" fill="none"/><rect x="1195" y="198" width="348" height="312" rx="20" fill="white" stroke="#c6d8e9" stroke-width="2"/><circle cx="1247" cy="254" r="28" fill="#0b2545"/><text x="1247" y="264" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" fill="#f7bc46" font-weight="bold">4</text><text x="1222" y="321" font-family="Arial,sans-serif" font-size="29" fill="#172941">Suivre les consignes</text><text x="1222" y="360" font-family="Arial,sans-serif" font-size="29" fill="#172941">et le relais des</text><text x="1222" y="399" font-family="Arial,sans-serif" font-size="29" fill="#172941">secours</text><text x="55" y="558" font-family="Arial,sans-serif" font-size="22" fill="#53677d">Observer · Décider · Agir · Conserver la preuve — lire les limites de la fiche.</text></svg>