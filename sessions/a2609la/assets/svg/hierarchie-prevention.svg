<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 364" role="img" aria-labelledby="t"><title id="t">Hiérarchie de prévention en quatre niveaux</title><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#112f43}.b{font-weight:700}.w{fill:#fff}.s{font-size:13px}.m{font-size:15px}.l{font-size:18px}.n{fill:#082b45}.r{fill:#ec168c}.bl{fill:#075b9b}.g{fill:#cddae3}</style><rect width="100%" height="100%" rx="14" fill="#fff"/><rect x="24" y="24" width="592" height="64" rx="12" fill="#082b45"/><circle cx="60" cy="56" r="19" fill="#fff"/><text x="60" y="63" text-anchor="middle" class="l b n">1</text><text x="96" y="52" class="m b w">Éviter le travail en hauteur</text><text x="96" y="72" class="s w">travailler depuis le sol, consigner, déplacer la tâche</text><rect x="24" y="104" width="592" height="64" rx="12" fill="#075b9b"/><circle cx="60" cy="136" r="19" fill="#fff"/><text x="60" y="143" text-anchor="middle" class="l b n">2</text><text x="96" y="132" class="m b w">Plan de travail sûr + protection collective</text><text x="96" y="152" class="s w">garde-corps, plateforme, échafaudage, filet</text><rect x="24" y="184" width="592" height="64" rx="12" fill="#4b7fa8"/><circle cx="60" cy="216" r="19" fill="#fff"/><text x="60" y="223" text-anchor="middle" class="l b n">3</text><text x="96" y="212" class="m b w">Accès sécurisé au poste</text><text x="96" y="232" class="s w">échafaudage, PEMP, accès conçus pour le poste</text><rect x="24" y="264" width="592" height="64" rx="12" fill="#ec168c"/><circle cx="60" cy="296" r="19" fill="#fff"/><text x="60" y="303" text-anchor="middle" class="l b n">4</text><text x="96" y="292" class="m b w">Protection individuelle antichute</text><text x="96" y="312" class="s w">uniquement si la protection collective est impossible</text><text x="320" y="352" text-anchor="middle" class="s">Ordre de priorité — la protection collective passe avant la protection individuelle (L. 4121-2)</text></svg>