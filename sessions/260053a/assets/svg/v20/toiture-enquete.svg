<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Lire le poste avant de choisir un EPI</title><desc id="desc">Cas d’exercice : ce plan ne constitue pas une installation validée.</desc><rect width="1100" height="620" fill="#fff"/><style>text{font-family:Segoe UI,Arial,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect x="0" y="0" width="14" height="620" rx="0" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="40" y="56" font-size="34" fill="#102c53" font-weight="800">Lire le poste avant de choisir un EPI</text><text x="40" y="94" font-size="23" fill="#52677d" font-weight="500">Cas d’exercice : ce plan ne constitue pas une installation validée.</text><rect x="110" y="147" width="830" height="345" rx="4" fill="#e6edf3" stroke="#102c53" stroke-width="3"/><path d="M110 147 L940 147" fill="none" stroke="#16744d" stroke-width="11"/><path d="M110 147 L110 492" fill="none" stroke="#16744d" stroke-width="11"/><rect x="400" y="220" width="210" height="103" rx="3" fill="#fff5d9" stroke="#f6b63d" stroke-width="3"/><text x="422" y="263" font-size="23" fill="#102c53" font-weight="700">LANTERNEAU</text><text x="428" y="296" font-size="20" fill="#52677d" font-weight="500">surface fragile</text><rect x="760" y="360" width="120" height="86" rx="2" fill="#fff" stroke="#b8322a" stroke-width="3"/><text x="772" y="411" font-size="24" fill="#b8322a" font-weight="800">TRÉMIE</text><rect x="165" y="355" width="115" height="92" rx="3" fill="#dcecf7" stroke="#0b68ae" stroke-width="3"/><text x="180" y="410" font-size="24" fill="#0b68ae" font-weight="700">ACCÈS</text><text x="154" y="185" font-size="23" fill="#16744d" font-weight="700">Protection périphérique partielle</text><circle cx="965" cy="244" r="24" fill="#f6b63d" stroke="none" stroke-width="4"/><text x="958" y="253" font-size="27" fill="#102c53" font-weight="800">1</text><circle cx="623" cy="245" r="24" fill="#f6b63d" stroke="none" stroke-width="4"/><text x="616" y="254" font-size="27" fill="#102c53" font-weight="800">2</text><circle cx="890" cy="406" r="24" fill="#f6b63d" stroke="none" stroke-width="4"/><text x="883" y="415" font-size="27" fill="#102c53" font-weight="800">3</text><circle cx="280" cy="390" r="24" fill="#f6b63d" stroke="none" stroke-width="4"/><text x="273" y="399" font-size="27" fill="#102c53" font-weight="800">4</text><text x="120" y="535" font-size="25" fill="#102c53" font-weight="700">Où est l’exposition ? Quelles informations manquent ?</text><path d="M40 570 L1060 570" fill="none" stroke="#d6e0ea" stroke-width="2"/><text x="40" y="603" font-size="19" fill="#52677d" font-weight="500">Schéma de principe • à confronter à la notice et au site réel</text></svg>