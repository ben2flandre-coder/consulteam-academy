<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Machine : croiser les périmètres d’énergie</title><desc id="desc">Illustration technique de principe d’une bande avec organe fluidique éventuel.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S04.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V23 · Machine : croiser les périmètres d’énergie</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Illustration technique de principe d’une bande avec organe fluidique éventuel.</text><rect x="60" y="240" width="390" height="200" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="84" y="282" font-size="27" fill="#173b50">Source électrique</text><text x="84" y="323" font-size="22" fill="#173b50">Réseau / auxiliaires</text><rect x="60" y="570" width="390" height="200" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="84" y="612" font-size="27" fill="#173b50">Source fluidique</text><text x="84" y="653" font-size="22" fill="#173b50">Pression à rechercher</text><rect x="800" y="350" width="650" height="300" rx="20" fill="#e6f4f1" stroke="#173b50" stroke-width="4"/><rect x="850" y="430" width="550" height="80" rx="40" fill="#c0d6dd" stroke="#173b50" stroke-width="3"/><circle cx="900" cy="470" r="28" fill="#fff" stroke="#173b50" stroke-width="3"/><circle cx="1350" cy="470" r="28" fill="#fff" stroke="#173b50" stroke-width="3"/><path d="M450,340 L620,340" fill="none" stroke="#173b50" stroke-width="4" /><path d="M620,340 L620,390" fill="none" stroke="#173b50" stroke-width="4" /><path d="M620,390 L800,390" fill="none" stroke="#173b50" stroke-width="4" /><path d="M450,670 L620,670" fill="none" stroke="#9c5e00" stroke-width="4" /><path d="M620,670 L620,600" fill="none" stroke="#9c5e00" stroke-width="4" /><path d="M620,600 L800,600" fill="none" stroke="#9c5e00" stroke-width="4" /><text x="900" y="585" font-size="28" fill="#173b50">Convoyeur fictif</text><text x="80" y="825" font-size="24" fill="#173b50">Liaisons fonctionnelles agrégées ; pas de circuits de puissance, de commande ou de purge détaillés.</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S04</text></g></svg>