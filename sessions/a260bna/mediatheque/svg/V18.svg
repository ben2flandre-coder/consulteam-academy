<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Cadrer l’opération avant de commencer</title><desc id="desc">Quatre questions, puis décision du responsable compétent.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S01, S02, S04.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V18 · Cadrer l’opération avant de commencer</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Quatre questions, puis décision du responsable compétent.</text><rect x="70" y="220" width="680" height="240" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="94" y="262" font-size="27" fill="#173b50">1 · Quoi et où ?</text><text x="94" y="303" font-size="22" fill="#173b50">Équipement / partie / limites</text><text x="94" y="335" font-size="22" fill="#173b50">Plans et repérage cohérents</text><rect x="850" y="220" width="680" height="240" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="874" y="262" font-size="27" fill="#173b50">2 · Quelles énergies ?</text><text x="874" y="303" font-size="22" fill="#173b50">Sources, stockages, retours</text><text x="874" y="335" font-size="22" fill="#173b50">Voisinage et coactivité</text><rect x="70" y="550" width="680" height="240" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="94" y="592" font-size="27" fill="#173b50">3 · Qui et avec quoi ?</text><text x="94" y="633" font-size="22" fill="#173b50">Compétences et titres adaptés</text><text x="94" y="665" font-size="22" fill="#173b50">Moyens et notices disponibles</text><rect x="850" y="550" width="680" height="240" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="874" y="592" font-size="27" fill="#173b50">4 · Quelles preuves ?</text><text x="874" y="633" font-size="22" fill="#173b50">Consignation / contrôles prévus</text><text x="874" y="665" font-size="22" fill="#173b50">Échanges et reprise définis</text><rect x="35" y="875" width="1530" height="100" rx="10" fill="#fff0cc"/><text x="55" y="911" font-size="23" fill="#173b50">SUPPORT PÉDAGOGIQUE — PAS UNE PROCÉDURE VALIDÉE POUR LE SITE</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S01, S02, S04</text></g></svg>