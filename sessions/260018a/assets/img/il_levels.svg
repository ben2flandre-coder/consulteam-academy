<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Trois profils emboîtés : opérateur, encadrant, concepteur"><title>Trois profils emboîtés : opérateur, encadrant, concepteur</title><defs></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}</style><rect width="1200" height="380" rx="22" fill="#f4f8fc"/><rect x="70" y="220" width="320" height="110" rx="14" fill="#095ea4"/><text x="230" y="264" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">Opérateur</text><text x="230" y="294" text-anchor="middle" font-size="15" fill="#fff" opacity=".9">conduit les engins · 30 questions</text><rect x="430" y="150" width="320" height="180" rx="14" fill="#0b2545"/><text x="590" y="194" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">Encadrant</text><text x="590" y="224" text-anchor="middle" font-size="15" fill="#fff" opacity=".9">dirige le chantier · 40 questions</text><rect x="790" y="80" width="320" height="250" rx="14" fill="#0f8b8d"/><text x="950" y="124" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">Concepteur</text><text x="950" y="154" text-anchor="middle" font-size="15" fill="#fff" opacity=".9">conçoit le projet · 40 questions</text><text x="600" y="36" text-anchor="middle" font-size="20" font-weight="800" fill="#0b2545">Trois profils, une base commune : le concepteur vaut encadrant, qui vaut opérateur</text></svg>