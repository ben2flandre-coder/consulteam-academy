<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">L’échelle : accès et exception de poste</title><desc id="desc">R.4323-63 : les deux branches de l’exception ne se confondent pas.</desc><rect width="1100" height="620" fill="#fff"/><style>text{font-family:Segoe UI,Arial,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect x="0" y="0" width="14" height="620" rx="0" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="40" y="56" font-size="34" fill="#102c53" font-weight="800">L’échelle : accès et exception de poste</text><text x="40" y="94" font-size="23" fill="#52677d" font-weight="500">R.4323-63 : les deux branches de l’exception ne se confondent pas.</text><rect x="65" y="147" width="972" height="77" rx="14" fill="#102c53" stroke="none" stroke-width="3"/><text x="99" y="195" font-size="30" fill="#fff" font-weight="700">Le poste doit permettre un travail protégé et adapté.</text><rect x="65" y="280" width="442" height="222" rx="14" fill="#eef3f8" stroke="none" stroke-width="3"/><text x="90" y="329" font-size="25" fill="#102c53" font-weight="800">IMPOSSIBILITÉ TECHNIQUE</text><text x="90" y="380" font-size="24" fill="#102c53" font-weight="500">de recourir à un équipement</text><text x="90" y="420" font-size="24" fill="#102c53" font-weight="500">assurant la protection collective</text><text x="90" y="460" font-size="24" fill="#102c53" font-weight="500">à établir dans la situation</text><text x="535" y="393" font-size="27" fill="#0b68ae" font-weight="800">OU</text><rect x="602" y="280" width="435" height="222" rx="14" fill="#fff5d9" stroke="none" stroke-width="3"/><text x="625" y="329" font-size="25" fill="#102c53" font-weight="800">ÉVALUATION DU RISQUE</text><text x="625" y="380" font-size="24" fill="#102c53" font-weight="500">Risque faible</text><text x="625" y="420" font-size="24" fill="#102c53" font-weight="500">ET travaux de courte durée</text><text x="625" y="460" font-size="24" fill="#102c53" font-weight="500">ET sans caractère répétitif</text><path d="M40 570 L1060 570" fill="none" stroke="#d6e0ea" stroke-width="2"/><text x="40" y="603" font-size="19" fill="#52677d" font-weight="500">Accès : stabilité, prévention du glissement, prise sûre et transfert protégés selon la situation</text></svg>