<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Défaut d’isolement : danger de contact indirect</title><desc id="desc">Schéma de défaut, sans personne exposée et sans simulation de geste.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S01, S09.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V21 · Défaut d’isolement : danger de contact indirect</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Schéma de défaut, sans personne exposée et sans simulation de geste.</text><rect x="740" y="230" width="700" height="440" rx="18" fill="#e6f4f1" stroke="#173b50" stroke-width="5"/><text x="780" y="290" font-size="28" fill="#173b50">Enveloppe conductrice / masse</text><path d="M100,390 L1100,390" fill="none" stroke="#173b50" stroke-width="4" /><text x="100" y="340" font-size="25" fill="#173b50">Conducteur actif — état dangereux à analyser</text><path d="M1100 390 l-35 55 l55 0 l-35 60 l55 0 l-40 70" fill="none" stroke="#b32d34" stroke-width="6"/><circle cx="1100" cy="580" r="7" fill="#173b50"/><text x="780" y="620" font-size="24" fill="#173b50">Défaut d’isolement vers la masse</text><path d="M1100,580 L1100,670" fill="none" stroke="#b32d34" stroke-width="4" /><path d="M1100,670 L1100,740" fill="none" stroke="#087554" stroke-width="4" /><path d="M1100,740 L140,740" fill="none" stroke="#087554" stroke-width="4" /><text x="80" y="790" font-size="26" fill="#173b50">PE / protection à étudier selon le schéma de liaison à la terre</text><text x="80" y="840" font-size="23" fill="#173b50">Aucune boucle de défaut complète dessinée : aucune valeur de courant ni temps de coupure calculable.</text><rect x="35" y="875" width="1530" height="100" rx="10" fill="#fff0cc"/><text x="55" y="911" font-size="23" fill="#173b50">SUPPORT PÉDAGOGIQUE — PAS UNE PROCÉDURE VALIDÉE POUR LE SITE</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S01, S09</text></g></svg>