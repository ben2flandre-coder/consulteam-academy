<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Cartographier toutes les alimentations</title><desc id="desc">Les flèches représentent des dépendances, pas des conducteurs.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S01, S04.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V02 · Cartographier toutes les alimentations</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Les flèches représentent des dépendances, pas des conducteurs.</text><rect x="80" y="220" width="360" height="150" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="104" y="262" font-size="27" fill="#173b50">Réseau principal</text><text x="104" y="303" font-size="22" fill="#173b50">Source à identifier</text><rect x="80" y="440" width="360" height="150" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="104" y="482" font-size="27" fill="#173b50">Alimentation auxiliaire</text><text x="104" y="523" font-size="22" fill="#173b50">Commande / autre départ</text><rect x="80" y="660" width="360" height="140" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="104" y="702" font-size="27" fill="#173b50">Secours éventuel</text><text x="104" y="743" font-size="22" fill="#173b50">ASI / batterie à rechercher</text><rect x="650" y="380" width="420" height="240" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="674" y="422" font-size="27" fill="#173b50">Équipement concerné</text><text x="674" y="463" font-size="22" fill="#173b50">Limites physiques à confirmer</text><text x="674" y="495" font-size="22" fill="#173b50">Plans + repérage terrain</text><path d="M440,295 L650,425" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><path d="M440,515 L650,490" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><path d="M440,730 L650,555" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><rect x="1170" y="380" width="360" height="240" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="1194" y="422" font-size="27" fill="#173b50">Énergie stockée</text><text x="1194" y="463" font-size="22" fill="#173b50">Variateur / condensateurs</text><text x="1194" y="495" font-size="22" fill="#173b50">Retour possible à analyser</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S01, S04</text></g></svg>