<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 118 1040 438" role="img" aria-labelledby="title desc"><title id="title">Une responsabilité, une action, une preuve</title><desc id="desc">La consigne relie l’organisation et le geste de l’utilisateur.</desc><rect width="1100" height="620" fill="#fff"/><style>text{font-family:Segoe UI,Arial,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect x="0" y="0" width="14" height="620" rx="0" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="40" y="56" font-size="34" fill="#102c53" font-weight="800">Une responsabilité, une action, une preuve</text><text x="40" y="94" font-size="23" fill="#52677d" font-weight="500">La consigne relie l’organisation et le geste de l’utilisateur.</text><rect x="42" y="140" width="490" height="370" rx="14" fill="#102c53" stroke="none" stroke-width="3"/><text x="72" y="194" font-size="30" fill="#fff" font-weight="800">ORGANISER</text><text x="72" y="250" font-size="26" fill="#fff" font-weight="500">Évaluer la tâche et le poste</text><text x="72" y="314" font-size="26" fill="#fff" font-weight="500">Choisir les moyens adaptés</text><text x="72" y="378" font-size="26" fill="#fff" font-weight="500">Former et préparer le secours</text><rect x="566" y="140" width="490" height="370" rx="14" fill="#eef3f8" stroke="none" stroke-width="3"/><text x="598" y="194" font-size="28" fill="#102c53" font-weight="800">APPLIQUER ET SIGNALER</text><text x="598" y="250" font-size="26" fill="#102c53" font-weight="500">Contrôler avant chaque emploi</text><text x="598" y="314" font-size="26" fill="#102c53" font-weight="500">Respecter la configuration</text><text x="598" y="378" font-size="26" fill="#102c53" font-weight="500">Suspendre en cas de doute</text><text x="72" y="477" font-size="22" fill="#f6b63d" font-weight="500">Consigne • notices • organisation</text><text x="598" y="477" font-size="23" fill="#0b68ae" font-weight="500">Contrôle • alerte • trace</text><path d="M40 570 L1060 570" fill="none" stroke="#d6e0ea" stroke-width="2"/><text x="40" y="603" font-size="19" fill="#52677d" font-weight="500">Schéma de principe • à confronter à la notice et au site réel</text></svg>