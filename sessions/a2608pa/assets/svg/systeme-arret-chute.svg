<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" role="img" aria-labelledby="t"><title id="t">Composition d’un système d’arrêt de chute</title><style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#112f43}.b{font-weight:700}.w{fill:#fff}.s{font-size:13px}.xs{font-size:12px}.m{font-size:15px}.l{font-size:18px}.n{fill:#082b45}.red{fill:#b3261e}.grn{fill:#147a51}</style><rect width="100%" height="100%" rx="14" fill="#fff"/><text x="320" y="30" text-anchor="middle" class="l b n">Un système d’arrêt de chute : 3 éléments compatibles</text><rect x="24" y="56" width="176" height="150" rx="14" fill="#082b45"/><circle cx="112" cy="92" r="20" fill="#fff"/><text x="112" y="99" text-anchor="middle" class="l b n">1</text><text x="112" y="142" text-anchor="middle" class="l b w">Ancrage</text><text x="112" y="166" text-anchor="middle" class="s w">point et support</text><text x="112" y="184" text-anchor="middle" class="s w">validés</text><path d="M204 131 h24" stroke="#082b45" stroke-width="4"/><path d="M222 123 l10 8 l-10 8" fill="none" stroke="#082b45" stroke-width="4"/><rect x="232" y="56" width="176" height="150" rx="14" fill="#075b9b"/><circle cx="320" cy="92" r="20" fill="#fff"/><text x="320" y="99" text-anchor="middle" class="l b n">2</text><text x="320" y="142" text-anchor="middle" class="l b w">Liaison</text><text x="320" y="166" text-anchor="middle" class="s w">longe et absorbeur</text><text x="320" y="184" text-anchor="middle" class="s w">d’énergie</text><path d="M412 131 h24" stroke="#082b45" stroke-width="4"/><path d="M430 123 l10 8 l-10 8" fill="none" stroke="#082b45" stroke-width="4"/><rect x="440" y="56" width="176" height="150" rx="14" fill="#ec168c"/><circle cx="528" cy="92" r="20" fill="#fff"/><text x="528" y="99" text-anchor="middle" class="l b n">3</text><text x="528" y="142" text-anchor="middle" class="l b w">Harnais</text><text x="528" y="166" text-anchor="middle" class="s w">ajusté, point</text><text x="528" y="184" text-anchor="middle" class="s w">d’attache prévu</text><rect x="24" y="226" width="592" height="110" rx="12" fill="#f4f8fb" stroke="#cddae3"/><text x="44" y="254" class="m b n">Conditions (R. 4323-61)</text><text x="44" y="278" class="s">• pas de chute libre de plus d’un mètre</text><text x="44" y="300" class="s">• le travailleur n’est jamais seul</text><text x="330" y="278" class="s">• notice de l’employeur (ancrages, usage)</text><text x="330" y="300" class="s">• composants compatibles (notices)</text><text x="44" y="322" class="s">• contrôle avant chaque emploi</text></svg>