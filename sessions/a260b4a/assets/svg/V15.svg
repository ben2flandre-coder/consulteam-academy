<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Avant remise en service : une décision organisée</title><desc id="desc">L’ordre détaillé de déconsignation est celui de la procédure validée.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S04.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V15 · Avant remise en service : une décision organisée</text><text x="55" y="108" font-size="23" fill="#b2e8e4">L’ordre détaillé de déconsignation est celui de la procédure validée.</text><rect x="80" y="240" width="640" height="430" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="104" y="282" font-size="27" fill="#173b50">Restitution des travaux</text><text x="104" y="323" font-size="22" fill="#173b50">État final connu et documenté</text><text x="104" y="355" font-size="22" fill="#173b50">Personnes et outillage dégagés</text><text x="104" y="387" font-size="22" fill="#173b50">Protections remises en place</text><text x="104" y="419" font-size="22" fill="#173b50">Écarts signalés</text><path d="M720,450 L880,450" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><rect x="900" y="240" width="620" height="430" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="924" y="282" font-size="27" fill="#173b50">Reprise autorisée</text><text x="924" y="323" font-size="22" fill="#173b50">Intervenants coordonnés</text><text x="924" y="355" font-size="22" fill="#173b50">Déconsignation par le rôle prévu</text><text x="924" y="387" font-size="22" fill="#173b50">Production informée</text><text x="924" y="419" font-size="22" fill="#173b50">Essais et reprise maîtrisés</text><text x="100" y="770" font-size="26" fill="#173b50">Une fin de dépannage ne constitue pas à elle seule une autorisation de redémarrer.</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S04</text></g></svg>