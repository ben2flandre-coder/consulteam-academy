<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Consignation : repères et points d’arrêt</title><desc id="desc">Vue de formation ; répartition des actes à fixer selon l’organisation retenue.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S01.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V03 · Consignation : repères et points d’arrêt</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Vue de formation ; répartition des actes à fixer selon l’organisation retenue.</text><rect x="65" y="230" width="450" height="150" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="89" y="272" font-size="27" fill="#173b50">1 · Séparation</text><text x="89" y="313" font-size="22" fill="#173b50">Sources concernées identifiées</text><rect x="575" y="230" width="450" height="150" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="599" y="272" font-size="27" fill="#173b50">2 · Condamnation</text><text x="599" y="313" font-size="22" fill="#173b50">Organes en position ouverte</text><rect x="1085" y="230" width="450" height="150" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="1109" y="272" font-size="27" fill="#173b50">3 · Identification</text><text x="1109" y="313" font-size="22" fill="#173b50">Partie sur le lieu de travail</text><path d="M515,305 L575,305" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><path d="M1025,305 L1085,305" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><rect x="575" y="495" width="450" height="150" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="599" y="537" font-size="27" fill="#173b50">4 · VAT</text><text x="599" y="578" font-size="22" fill="#173b50">Sur la partie concernée</text><path d="M1310,380 L1310,440" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><path d="M1310,440 L800,440" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><path d="M800,440 L800,495" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><rect x="65" y="690" width="1470" height="120" rx="16" fill="#fff0cc" stroke="#497281" stroke-width="2"/><text x="89" y="732" font-size="27" fill="#173b50">Mise à la terre et en court-circuit</text><text x="89" y="773" font-size="22" fill="#173b50">Applicabilité à déterminer ; absence de MALT/CC en BT non systématique.</text><rect x="35" y="875" width="1530" height="100" rx="10" fill="#fff0cc"/><text x="55" y="911" font-size="23" fill="#173b50">SUPPORT PÉDAGOGIQUE — PAS UNE PROCÉDURE VALIDÉE POUR LE SITE</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S01</text></g></svg>