<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc"><title id="title">Trois missions, trois périmètres</title><desc id="desc">Lire le titre et les instructions : un symbole ne constitue pas une autorisation générale.. B0 / H0 / H0V NON ÉLECTRIQUE Zone et mission autorisées. Aucun remplacement ou dépannage électrique. BS ÉLÉMENTAIRE Remplacement à l’identique ou raccordement prévu. Hors tension, sans voisinage. BE MANŒUVRE COMMANDE Manœuvre définie. Pas de modification, ni de recherche de panne.. Si la demande dépasse le périmètre : suspendre, sécuriser selon les consignes et signaler.</desc><rect width="1300" height="760" fill="white"/><rect width="1300" height="16" fill="#0b2545"/><g font-family="Arial, sans-serif" fill="#172941"><text x="60" y="65" font-size="17" letter-spacing="3" fill="#53677d">CONSULTEAM ACADEMY · RECYCLAGE</text><text x="60" y="115" font-size="39" font-weight="800">Trois missions, trois périmètres</text><text x="60" y="156" font-size="21" fill="#53677d">Lire le titre et les instructions : un symbole ne constitue pas une autorisation générale.</text><rect x="60" y="190" width="365" height="385" rx="20" fill="#f1f6fb" stroke="#ceddea"/><circle cx="102" cy="232" r="20" fill="#0b2545"/><text x="102" y="239" text-anchor="middle" fill="white" font-size="18" font-weight="700">1</text><text x="90" y="300" font-size="22" font-weight="700">B0 / H0 / H0V</text><text x="90" y="354" font-size="32" font-weight="800" fill="#095ea4">NON ÉLECTRIQUE</text><text x="90" y="405" font-size="19">Zone et mission autorisées.</text><text x="90" y="441" font-size="19">Aucun remplacement</text><text x="90" y="477" font-size="19">ou dépannage électrique.</text><rect x="455" y="190" width="365" height="385" rx="20" fill="#f1f6fb" stroke="#ceddea"/><circle cx="497" cy="232" r="20" fill="#0b2545"/><text x="497" y="239" text-anchor="middle" fill="white" font-size="18" font-weight="700">2</text><text x="485" y="300" font-size="22" font-weight="700">BS</text><text x="485" y="354" font-size="32" font-weight="800" fill="#095ea4">ÉLÉMENTAIRE</text><text x="485" y="405" font-size="19">Remplacement à l’identique</text><text x="485" y="441" font-size="19">ou raccordement prévu.</text><text x="485" y="477" font-size="19">Hors tension, sans voisinage.</text><rect x="850" y="190" width="365" height="385" rx="20" fill="#f1f6fb" stroke="#ceddea"/><circle cx="892" cy="232" r="20" fill="#0b2545"/><text x="892" y="239" text-anchor="middle" fill="white" font-size="18" font-weight="700">3</text><text x="880" y="300" font-size="22" font-weight="700">BE MANŒUVRE</text><text x="880" y="354" font-size="32" font-weight="800" fill="#095ea4">COMMANDE</text><text x="880" y="405" font-size="19">Manœuvre définie.</text><text x="880" y="441" font-size="19">Pas de modification,</text><text x="880" y="477" font-size="19">ni de recherche de panne.</text><rect x="60" y="607" width="1155" height="70" rx="12" fill="#fff2d4"/><text x="85" y="650" font-size="20" font-weight="700">Si la demande dépasse le périmètre : suspendre, sécuriser selon les consignes et signaler.</text><text x="60" y="721" font-size="15" fill="#53677d">RMBD · Benoît Deflandre · 10/10/2026 · Source : FAQ INRS / NF C 18-510 applicable</text></g></svg>