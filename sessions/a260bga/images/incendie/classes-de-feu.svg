<svg viewBox="0 0 640 292" width="1280" height="584" role="img" aria-labelledby="clat clad" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="640" height="292" fill="#FFFFFF"/><title id="clat">Les cinq classes de feu</title><desc id="clad">A : solides, B : liquides, C : gaz, D : métaux, F : huiles et graisses de cuisson. Il n’existe pas de classe électrique.</desc><rect x="12" y="10" width="115" height="232" rx="12" fill="#FFFFFF" stroke="#C9CDD2" stroke-width="1.5"/><circle cx="69.5" cy="44" r="22" fill="#C8281E"/><text x="69.5" y="54" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="26" font-weight="700" fill="#fff">A</text><g transform="translate(69.5,128)"><rect x="-36" y="16" width="34" height="16" rx="8" fill="#8D6E63"/><rect x="2" y="16" width="34" height="16" rx="8" fill="#8D6E63"/><rect x="-17" y="0" width="34" height="16" rx="8" fill="#A1887F"/><g transform="translate(0,-20) scale(0.85)"><path d="M0,-30 C9,-16 22,-8 22,8 C22,22 12,30 0,30 C-12,30 -22,22 -22,8 C-22,-2 -15,-8 -10,-18 C-6,-12 -3,-8 0,-30 Z" fill="#F28C28"/><path d="M0,-8 C6,0 13,5 13,14 C13,23 7,28 0,28 C-7,28 -13,23 -13,14 C-13,7 -7,2 0,-8 Z" fill="#FFC843"/></g></g><text x="69.5" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="17" font-weight="700" fill="#2C3E50">Solides</text><text x="69.5" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="400" fill="#4B4B4B">bois, papier</text><rect x="137" y="10" width="115" height="232" rx="12" fill="#FFFFFF" stroke="#C9CDD2" stroke-width="1.5"/><circle cx="194.5" cy="44" r="22" fill="#C8281E"/><text x="194.5" y="54" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="26" font-weight="700" fill="#fff">B</text><g transform="translate(194.5,128)"><rect x="-22" y="0" width="44" height="40" rx="6" fill="#5C7C99"/><rect x="-22" y="12" width="44" height="4" fill="#3E566E"/><rect x="-22" y="26" width="44" height="4" fill="#3E566E"/><g transform="translate(0,-22) scale(0.75)"><path d="M0,-30 C9,-16 22,-8 22,8 C22,22 12,30 0,30 C-12,30 -22,22 -22,8 C-22,-2 -15,-8 -10,-18 C-6,-12 -3,-8 0,-30 Z" fill="#F28C28"/><path d="M0,-8 C6,0 13,5 13,14 C13,23 7,28 0,28 C-7,28 -13,23 -13,14 C-13,7 -7,2 0,-8 Z" fill="#FFC843"/></g></g><text x="194.5" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="17" font-weight="700" fill="#2C3E50">Liquides</text><text x="194.5" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="400" fill="#4B4B4B">essence, alcool</text><rect x="262" y="10" width="115" height="232" rx="12" fill="#FFFFFF" stroke="#C9CDD2" stroke-width="1.5"/><circle cx="319.5" cy="44" r="22" fill="#C8281E"/><text x="319.5" y="54" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="26" font-weight="700" fill="#fff">C</text><g transform="translate(319.5,128)"><rect x="-14" y="-4" width="28" height="46" rx="12" fill="#6A9AA8"/><rect x="-5" y="-14" width="10" height="10" rx="2" fill="#4B4B4B"/><g transform="translate(0,-30) scale(0.6)"><path d="M0,-30 C9,-16 22,-8 22,8 C22,22 12,30 0,30 C-12,30 -22,22 -22,8 C-22,-2 -15,-8 -10,-18 C-6,-12 -3,-8 0,-30 Z" fill="#F28C28"/><path d="M0,-8 C6,0 13,5 13,14 C13,23 7,28 0,28 C-7,28 -13,23 -13,14 C-13,7 -7,2 0,-8 Z" fill="#FFC843"/></g></g><text x="319.5" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="17" font-weight="700" fill="#2C3E50">Gaz</text><text x="319.5" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="400" fill="#4B4B4B">propane, butane</text><rect x="387" y="10" width="115" height="232" rx="12" fill="#FFFFFF" stroke="#C9CDD2" stroke-width="1.5"/><circle cx="444.5" cy="44" r="22" fill="#C8281E"/><text x="444.5" y="54" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="26" font-weight="700" fill="#fff">D</text><g transform="translate(444.5,128)"><polygon points="-34,34 -22,8 22,8 34,34" fill="#9AA5B1"/><polygon points="-22,8 22,8 18,16 -18,16" fill="#C9D1D9"/><g stroke="#FFC843" stroke-width="3" stroke-linecap="round"><line x1="0" y1="-8" x2="0" y2="-26"/><line x1="-14" y1="-4" x2="-24" y2="-18"/><line x1="14" y1="-4" x2="24" y2="-18"/><line x1="-24" y1="2" x2="-36" y2="-6"/><line x1="24" y1="2" x2="36" y2="-6"/></g></g><text x="444.5" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="17" font-weight="700" fill="#2C3E50">Métaux</text><text x="444.5" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="400" fill="#4B4B4B">magnésium</text><rect x="512" y="10" width="115" height="232" rx="12" fill="#FFFFFF" stroke="#C9CDD2" stroke-width="1.5"/><circle cx="569.5" cy="44" r="22" fill="#C8281E"/><text x="569.5" y="54" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="26" font-weight="700" fill="#fff">F</text><g transform="translate(569.5,128)"><rect x="-30" y="14" width="60" height="18" rx="7" fill="#455A64"/><rect x="28" y="19" width="26" height="7" rx="3" fill="#455A64"/><g transform="translate(0,-8) scale(0.8)"><path d="M0,-30 C9,-16 22,-8 22,8 C22,22 12,30 0,30 C-12,30 -22,22 -22,8 C-22,-2 -15,-8 -10,-18 C-6,-12 -3,-8 0,-30 Z" fill="#F28C28"/><path d="M0,-8 C6,0 13,5 13,14 C13,23 7,28 0,28 C-7,28 -13,23 -13,14 C-13,7 -7,2 0,-8 Z" fill="#FFC843"/></g></g><text x="569.5" y="196" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="17" font-weight="700" fill="#2C3E50">Huiles</text><text x="569.5" y="218" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="400" fill="#4B4B4B">friteuse, poêle</text><text x="320" y="276" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="400" fill="#4B4B4B">Pas de classe « électrique » : sous tension, le feu relève de A ou B.</text></svg>
