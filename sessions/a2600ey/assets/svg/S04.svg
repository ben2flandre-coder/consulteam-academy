<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Les 5M : chercher la cause</title><desc id="d">Diagramme en arête de poisson : matière, matériel, méthode, milieu, main-d’œuvre.</desc><rect width="1200" height="675" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Les 5M : chercher la cause</text><rect x="880" y="285" width="260" height="110" rx="14" fill="#102c53" stroke="#102c53" stroke-width="2.5"/><text x="1010.0" y="318.16" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">Contamination</text><text x="1010.0" y="348.16" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">ou non-conformité</text><text x="1010.0" y="378.16" font-size="24" fill="#ffffff" text-anchor="middle" font-weight="700">sanitaire</text><line x1="60" y1="340" x2="880" y2="340" stroke="#102c53" stroke-width="6"/><rect x="70" y="100" width="240" height="96" rx="12" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="190" y="140" font-size="26" fill="#102c53" text-anchor="middle" font-weight="700">Matière</text><text x="190" y="172" font-size="19" fill="#5a6b80" text-anchor="middle" font-weight="400">denrées, emballages</text><line x1="190" y1="196" x2="270" y2="340" stroke="#0b68ae" stroke-width="4"/><rect x="340" y="100" width="240" height="96" rx="12" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="460" y="140" font-size="26" fill="#102c53" text-anchor="middle" font-weight="700">Matériel</text><text x="460" y="172" font-size="19" fill="#5a6b80" text-anchor="middle" font-weight="400">frigo, sonde, couteaux</text><line x1="460" y1="196" x2="540" y2="340" stroke="#0b68ae" stroke-width="4"/><rect x="610" y="100" width="240" height="96" rx="12" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="730" y="140" font-size="26" fill="#102c53" text-anchor="middle" font-weight="700">Méthode</text><text x="730" y="172" font-size="19" fill="#5a6b80" text-anchor="middle" font-weight="400">procédures, traces</text><line x1="730" y1="196" x2="810" y2="340" stroke="#0b68ae" stroke-width="4"/><rect x="205" y="520" width="240" height="96" rx="12" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="325" y="560" font-size="26" fill="#102c53" text-anchor="middle" font-weight="700">Milieu</text><text x="325" y="592" font-size="19" fill="#5a6b80" text-anchor="middle" font-weight="400">locaux, nuisibles, déchets</text><line x1="325" y1="520" x2="405" y2="340" stroke="#0b68ae" stroke-width="4"/><rect x="475" y="520" width="240" height="96" rx="12" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="595" y="560" font-size="26" fill="#102c53" text-anchor="middle" font-weight="700">Main-d’œuvre</text><text x="595" y="592" font-size="19" fill="#5a6b80" text-anchor="middle" font-weight="400">mains, tenue, formation</text><line x1="595" y1="520" x2="675" y2="340" stroke="#0b68ae" stroke-width="4"/><text x="40" y="653" font-size="18" fill="#5a6b80" text-anchor="start" font-weight="400">Outil de recherche des causes d’une non-conformité.</text></svg>