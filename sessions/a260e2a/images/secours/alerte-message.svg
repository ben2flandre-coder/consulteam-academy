<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Le message d’alerte</title><desc id="d">Six éléments : qui appelle, où, quoi, combien, comment, déjà fait ; numéros 15, 18, 112 et 114.</desc><rect width="1200" height="580" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Le message d’alerte</text><rect x="60" y="130" width="340" height="140" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><circle cx="96" cy="170" r="24" fill="#f6b63d" stroke="#102c53" stroke-width="3"/><text x="96" y="179" font-size="26" font-weight="700" fill="#102c53" text-anchor="middle">1</text><text x="132" y="178" font-size="28" fill="#102c53" text-anchor="start" font-weight="700">Qui appelle</text><text x="84" y="228" font-size="21" fill="#16273d" text-anchor="start" font-weight="400">identité et numéro de rappel</text><rect x="430" y="130" width="340" height="140" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><circle cx="466" cy="170" r="24" fill="#f6b63d" stroke="#102c53" stroke-width="3"/><text x="466" y="179" font-size="26" font-weight="700" fill="#102c53" text-anchor="middle">2</text><text x="502" y="178" font-size="28" fill="#102c53" text-anchor="start" font-weight="700">Où</text><text x="454" y="228" font-size="21" fill="#16273d" text-anchor="start" font-weight="400">lieu précis de l’événement</text><rect x="800" y="130" width="340" height="140" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><circle cx="836" cy="170" r="24" fill="#f6b63d" stroke="#102c53" stroke-width="3"/><text x="836" y="179" font-size="26" font-weight="700" fill="#102c53" text-anchor="middle">3</text><text x="872" y="178" font-size="28" fill="#102c53" text-anchor="start" font-weight="700">Quoi</text><text x="824" y="228" font-size="21" fill="#16273d" text-anchor="start" font-weight="400">nature de l’événement</text><rect x="60" y="300" width="340" height="140" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><circle cx="96" cy="340" r="24" fill="#f6b63d" stroke="#102c53" stroke-width="3"/><text x="96" y="349" font-size="26" font-weight="700" fill="#102c53" text-anchor="middle">4</text><text x="132" y="348" font-size="28" fill="#102c53" text-anchor="start" font-weight="700">Combien</text><text x="84" y="398" font-size="21" fill="#16273d" text-anchor="start" font-weight="400">nombre de victimes</text><rect x="430" y="300" width="340" height="140" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><circle cx="466" cy="340" r="24" fill="#f6b63d" stroke="#102c53" stroke-width="3"/><text x="466" y="349" font-size="26" font-weight="700" fill="#102c53" text-anchor="middle">5</text><text x="502" y="348" font-size="28" fill="#102c53" text-anchor="start" font-weight="700">Comment</text><text x="454" y="398" font-size="21" fill="#16273d" text-anchor="start" font-weight="400">état des victimes</text><rect x="800" y="300" width="340" height="140" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><circle cx="836" cy="340" r="24" fill="#f6b63d" stroke="#102c53" stroke-width="3"/><text x="836" y="349" font-size="26" font-weight="700" fill="#102c53" text-anchor="middle">6</text><text x="872" y="348" font-size="28" fill="#102c53" text-anchor="start" font-weight="700">Déjà fait</text><text x="824" y="398" font-size="21" fill="#16273d" text-anchor="start" font-weight="400">actions déjà engagées</text><rect x="60" y="480" width="1080" height="60" rx="12" fill="#fff6dc" stroke="#f6b63d" stroke-width="2"/><text x="600" y="519" font-size="21" fill="#102c53" text-anchor="middle" font-weight="700">15 SAMU · 18 pompiers · 112 européen · 114 par SMS, visio ou tchat · on ne raccroche pas le premier</text><text x="1160" y="564" font-size="14" text-anchor="end" fill="#53657a">Consulteam · SST</text></svg>