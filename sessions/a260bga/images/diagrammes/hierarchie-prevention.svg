<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t d" font-family="Segoe UI,system-ui,Arial,sans-serif"><title id="t">Hiérarchie des mesures</title><desc id="d">Pyramide à quatre niveaux : supprimer, réduire, protéger collectivement, puis EPI en dernier recours.</desc><rect x="1" y="1" width="718" height="403" rx="16" fill="#fff" stroke="#e4dde9" stroke-width="2"/><text x="360" y="34" font-size="21" fill="#1b2a41" text-anchor="middle" font-weight="700" >Hiérarchie des mesures de prévention</text><polygon points="172,64 220,64 252,134 140,134" fill="#e5007d"/><text x="196" y="108.0" font-size="26" fill="#fff" text-anchor="middle" font-weight="800" >1</text><text x="400" y="94" font-size="18" fill="#e5007d" text-anchor="start" font-weight="700" >Supprimer</text><text x="400" y="118" font-size="13.5" fill="#5b5166" text-anchor="start" font-weight="400" >supprimer l’opération dangereuse</text><polygon points="132,142 260,142 292,212 100,212" fill="#db0d5d"/><text x="196" y="186.0" font-size="26" fill="#fff" text-anchor="middle" font-weight="800" >2</text><text x="400" y="172" font-size="18" fill="#db0d5d" text-anchor="start" font-weight="700" >Réduire</text><text x="400" y="196" font-size="13.5" fill="#5b5166" text-anchor="start" font-weight="400" >alléger, fractionner, mécaniser</text><polygon points="92,220 300,220 332,290 60,290" fill="#d21b3e"/><text x="196" y="264.0" font-size="26" fill="#fff" text-anchor="middle" font-weight="800" >3</text><text x="400" y="250" font-size="18" fill="#d21b3e" text-anchor="start" font-weight="700" >Protéger collectivement</text><text x="400" y="274" font-size="13.5" fill="#5b5166" text-anchor="start" font-weight="400" >garde-corps, aspiration, balisage</text><polygon points="52,298 340,298 372,368 20,368" fill="#c8281e"/><text x="196" y="342.0" font-size="26" fill="#fff" text-anchor="middle" font-weight="800" >4</text><text x="400" y="328" font-size="18" fill="#c8281e" text-anchor="start" font-weight="700" >EPI, en dernier recours</text><text x="400" y="352" font-size="13.5" fill="#5b5166" text-anchor="start" font-weight="400" >en complément, adaptés, en bon état</text><line x1="692" y1="92" x2="692.0" y2="335.5" stroke="#5b5166" stroke-width="3" stroke-linecap="round"/><polygon points="692,340 688.0853101929989,331.8959760788259 695.9146898070011,331.8959760788259" fill="#5b5166"/><text x="712" y="64" font-size="11.5" fill="#5b5166" text-anchor="end" font-weight="400" >+ efficace</text><text x="712" y="364" font-size="11.5" fill="#5b5166" text-anchor="end" font-weight="400" >complément</text></svg>