<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="t d" font-family="Segoe UI,Arial,sans-serif"><title id="t">Du titre à la tâche</title><desc id="d">La formation donne un avis ; l’employeur délivre le titre.</desc><rect width="1000" height="320" fill="#fff"/><text x="20" y="44" font-size="30" font-weight="700" fill="#102c53">Du titre à la tâche</text><rect x="20" y="54" width="90" height="5" fill="#f6b63d"/><rect x="20" y="80" width="219" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="20" y="80" width="219" height="8" rx="4" fill="#0b68ae"/><circle cx="50" cy="124" r="22" fill="#102c53"/><text x="50" y="132" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">1</text><text x="82" y="120" font-size="23" font-weight="700" fill="#102c53">Formation</text><text x="38" y="160" font-size="17.5" fill="#16273d">Théorique et</text><text x="38" y="182" font-size="17.5" fill="#16273d">pratique, évaluée.</text><path d="M243 165 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="#102c53" stroke-width="3"/><rect x="267" y="80" width="219" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="267" y="80" width="219" height="8" rx="4" fill="#0b68ae"/><circle cx="297" cy="124" r="22" fill="#102c53"/><text x="297" y="132" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">2</text><text x="329" y="120" font-size="23" font-weight="700" fill="#102c53">Avis</text><text x="285" y="160" font-size="17.5" fill="#16273d">Établi à l’issue de</text><text x="285" y="182" font-size="17.5" fill="#16273d">la formation, remis</text><text x="285" y="204" font-size="17.5" fill="#16273d">à l’employeur.</text><path d="M490 165 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="#102c53" stroke-width="3"/><rect x="514" y="80" width="219" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="514" y="80" width="219" height="8" rx="4" fill="#f6b63d"/><circle cx="544" cy="124" r="22" fill="#102c53"/><text x="544" y="132" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">3</text><text x="576" y="120" font-size="23" font-weight="700" fill="#102c53">Employeur</text><text x="532" y="160" font-size="17.5" fill="#16273d">Seul, il délivre le</text><text x="532" y="182" font-size="17.5" fill="#16273d">titre pour des</text><text x="532" y="204" font-size="17.5" fill="#16273d">opérations précises.</text><path d="M737 165 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="#102c53" stroke-width="3"/><rect x="761" y="80" width="219" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="761" y="80" width="219" height="8" rx="4" fill="#0b68ae"/><circle cx="791" cy="124" r="22" fill="#102c53"/><text x="791" y="132" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">4</text><text x="823" y="120" font-size="23" font-weight="700" fill="#102c53">Titre</text><text x="779" y="160" font-size="17.5" fill="#16273d">Identité, symboles,</text><text x="779" y="182" font-size="17.5" fill="#16273d">domaine de tension.</text><text x="779" y="204" font-size="17.5" fill="#16273d">Hors titre :</text><text x="779" y="226" font-size="17.5" fill="#16273d">interdit.</text><text x="20" y="304" font-size="16" fill="#53657a">Attestation de formation ≠ titre d’habilitation.</text></svg>