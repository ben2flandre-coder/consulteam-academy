<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 118 1040 438" role="img" aria-labelledby="title desc"><title id="title">Avant l’ouverture de la zone</title><desc id="desc">Une inconnue critique non résolue maintient la zone fermée.</desc><rect width="1100" height="620" fill="#fff"/><style>text{font-family:Segoe UI,Arial,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect x="0" y="0" width="14" height="620" rx="0" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="40" y="56" font-size="34" fill="#102c53" font-weight="800">Avant l’ouverture de la zone</text><text x="40" y="94" font-size="23" fill="#52677d" font-weight="500">Une inconnue critique non résolue maintient la zone fermée.</text><rect x="52" y="151" width="410" height="350" rx="14" fill="#102c53" stroke="none" stroke-width="3"/><text x="82" y="210" font-size="34" fill="#fff" font-weight="800">POINT D’ARRÊT</text><text x="82" y="282" font-size="25" fill="#fff" font-weight="500">Poste et accès protégés ?</text><text x="82" y="347" font-size="25" fill="#fff" font-weight="500">Système documenté ?</text><text x="82" y="412" font-size="25" fill="#fff" font-weight="500">Secours opérationnel ?</text><rect x="515" y="151" width="525" height="350" rx="14" fill="#eef3f8" stroke="none" stroke-width="3"/><text x="544" y="209" font-size="25" fill="#102c53" font-weight="800">LE BRIEFING DOIT NOMMER</text><text x="544" y="269" font-size="25" fill="#102c53" font-weight="500">La tâche et les limites</text><text x="544" y="328" font-size="25" fill="#102c53" font-weight="500">La configuration autorisée</text><text x="544" y="387" font-size="25" fill="#102c53" font-weight="500">Le signal d’arrêt</text><text x="544" y="446" font-size="25" fill="#102c53" font-weight="500">Les rôles et la conduite d’alerte</text><path d="M40 570 L1060 570" fill="none" stroke="#d6e0ea" stroke-width="2"/><text x="40" y="603" font-size="19" fill="#52677d" font-weight="500">Schéma de principe • à confronter à la notice et 