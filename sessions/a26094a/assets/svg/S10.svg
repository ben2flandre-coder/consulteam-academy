<circle cx="1130" cy="60" r="150" fill="#f6b63d" opacity=".10"/><circle cx="60" cy="640" r="170" fill="#0b68ae" opacity=".06"/>
<text x="40" y="66" font-size="36" font-weight="700" fill="#102c53">Déclaration, agrément ou dérogation ?</text><text x="40" y="96" font-size="19" fill="#53657a">Un repère pour situer votre établissement, la DDPP tranche votre cas</text>
<rect x="330" y="120" width="540" height="92" rx="18" fill="url(#gN)" filter="url(#sh)"/><circle cx="380" cy="166" r="30" fill="url(#gA)" filter="url(#sh2)"/><circle cx="380" cy="166" r="26" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/><g transform="translate(362.75 148.75) scale(1.4375)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V9l8-5 8 5v12z"/><path d="M9 21v-6h6v6M8 11h.1M16 11h.1"/></g><text x="430" y="157.0" font-size="23" font-weight="700" fill="#fff" text-anchor="start" >Votre établissement manipule-t-il</text><text x="430" y="186.4" font-size="23" font-weight="700" fill="#fff" text-anchor="start" >des denrées d’origine animale ?</text><path d="M520 212 C520 250 300 240 240 300" fill="none" stroke="#102c53" stroke-width="3.5" marker-end="url(#arN)"/><path d="M680 212 C680 250 840 240 860 280" fill="none" stroke="#102c53" stroke-width="3.5" marker-end="url(#arN)"/><rect x="300" y="236" width="70" height="34" rx="17.0" fill="url(#gR)"/><text x="335.0" y="258.9" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" >NON</text><rect x="790" y="236" width="70" height="34" rx="17.0" fill="url(#gG)"/><text x="825.0" y="258.9" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" >OUI</text><rect x="40" y="300" width="400" height="210" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/><circle cx="92" cy="352" r="28" fill="url(#gB)" filter="url(#sh2)"/><circle cx="92" cy="352" r="24" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/><g transform="translate(75.9 335.9) scale(1.3416666666666666)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></g><text x="136" y="346.0" font-size="24" font-weight="700" fill="#102c53" text-anchor="start" >Hors du champ</text><text x="136" y="376.7" font-size="24" font-weight="700" fill="#102c53" text-anchor="start" >de l’agrément</text><text x="66" y="420.0" font-size="18" font-weight="400" fill="#374151" text-anchor="start" >Pas de démarche propre aux denrées</text><text x="66" y="443.0" font-size="18" font-weight="400" fill="#374151" text-anchor="start" >animales. Le plan de maîtrise sanitaire</text><text x="66" y="466.1" font-size="18" font-weight="400" fill="#374151" text-anchor="start" >et les bonnes pratiques d’hygiène</text><text x="66" y="489.1" font-size="18" font-weight="400" fill="#374151" text-anchor="start" >s’appliquent quand même.</text><rect x="560" y="280" width="600" height="92" rx="18" fill="url(#gB)" filter="url(#sh)"/><circle cx="610" cy="326" r="30" fill="url(#gA)" filter="url(#sh2)"/><circle cx="610" cy="326" r="26" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/><g transform="translate(592.75 308.75) scale(1.4375)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.500 2.500-6 6-6s6 2.500 6 6"/><circle cx="17" cy="9" r="2.300"/><path d="M16 14c3 0 5 2 5 5"/></g><text x="660" y="317.0" font-size="23" font-weight="700" fill="#fff" text-anchor="start" >Tout est-il vendu directement</text><text x="660" y="346.4" font-size="23" font-weight="700" fill="#fff" text-anchor="start" >au consommateur final ?</text><path d="M700 372 C700 400 640 410 640 440" fill="none" stroke="#102c53" stroke-width="3.5" marker-end="url(#arN)"/><path d="M1020 372 C1020 400 1030 410 1030 440" fill="none" stroke="#102c53" stroke-width="3.5" marker-end="url(#arN)"/><rect x="560" y="392" width="70" height="32" rx="16.0" fill="url(#gG)"/><text x="595.0" y="413.9" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" >OUI</text><rect x="1050" y="392" width="70" height="32" rx="16.0" fill="url(#gR)"/><text x="1085.0" y="413.9" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" >NON</text><rect x="470" y="440" width="340" height="170" rx="18" fill="#fff" stroke="#46b985" stroke-width="1.5" filter="url(#sh)"/><circle cx="522" cy="490" r="28" fill="url(#gG)" filter="url(#sh2)"/><circle cx="522" cy="490" r="24" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/><g transform="translate(505.9 473.9) scale(1.3416666666666666)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></g><text x="566" y="484.0" font-size="24" font-weight="700" fill="#102c53" text-anchor="start" >Déclaration</text><text x="566" y="514.7" font-size="24" font-weight="700" fill="#102c53" text-anchor="start" >d’activité</text><text x="496" y="556.0" font-size="17" font-weight="400" fill="#374151" text-anchor="start" >Cerfa 13984 · adressée à la DDPP</text><text x="496" y="577.8" font-size="17" font-weight="400" fill="#374151" text-anchor="start" >du département (activités non</text><text x="496" y="599.5" font-size="17" font-weight="400" fill="#374151" text-anchor="start" >soumises à agrément).</text><rect x="830" y="440" width="330" height="190" rx="18" fill="#fff" stroke="#f0a91f" stroke-width="1.5" filter="url(#sh)"/><circle cx="880" cy="490" r="28" fill="url(#gA)" filter="url(#sh2)"/><circle cx="880" cy="490" r="24" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/><g transform="translate(863.9 473.9) scale(1.3416666666666666)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14h6l1 4H8z"/><path d="M12 14V9a3 3 0 1 0-3-3"/><path d="M5 21h14"/></g><text x="924" y="484.0" font-size="24" font-weight="700" fill="#102c53" text-anchor="start" >Agrément</text><text x="924" y="514.7" font-size="24" font-weight="700" fill="#102c53" text-anchor="start" >sanitaire</text><text x="856" y="552.0" font-size="17" font-weight="400" fill="#374151" text-anchor="start" >Cerfa 13983. Dérogation possible</text><text x="856" y="573.8" font-size="17" font-weight="400" fill="#374151" text-anchor="start" >(Cerfa 13982) si les conditions</text><text x="856" y="595.5" font-size="17" font-weight="400" fill="#374151" text-anchor="start" >sont réunies : produits, quantités,</text><text x="856" y="617.3" font-size="17" font-weight="400" fill="#374151" text-anchor="start" >distance, établissements de détail.</text>
<text x="40" y="654" font-size="14" fill="#53657a">Sources : arrêté du 8 juin 2006 ; notices DDPP des Cerfa 13982, 13983 et 13984. Vérifiez votre situation auprès de la DDPP.</text><text x="1160" y="654" font-size="14" font-weight="700" fill="#102c53" text-anchor="end">Consulteam · A26094A</text></svg>