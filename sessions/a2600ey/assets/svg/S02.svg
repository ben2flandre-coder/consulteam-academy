<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Températures à connaître</title><desc id="d">Thermomètre : maintien chaud, zone de danger, froid positif, congélation, refroidissement rapide.</desc><rect width="1200" height="675" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Températures à connaître</text><rect x="140" y="100" width="70" height="480" rx="35" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><circle cx="175" cy="575" r="60" fill="#0b68ae" stroke="none" stroke-width="3"/><rect x="150" y="120" width="50" height="100" rx="20" fill="#e6f3ec" stroke="none" stroke-width="0"/><rect x="150" y="230" width="50" height="160" rx="20" fill="#f6d0cc" stroke="none" stroke-width="0"/><rect x="150" y="400" width="50" height="140" rx="20" fill="#dbeaf7" stroke="none" stroke-width="0"/><line x1="215" y1="130" x2="260" y2="130" stroke="#1e7a46" stroke-width="4"/><text x="275" y="128" font-size="30" fill="#1e7a46" text-anchor="start" font-weight="700">+63 °C et plus</text><text x="275" y="160" font-size="21" fill="#102c53" text-anchor="start" font-weight="400">Maintien au chaud : ≥ +63 °C</text><line x1="215" y1="265" x2="260" y2="265" stroke="#b3261e" stroke-width="4"/><text x="275" y="263" font-size="30" fill="#b3261e" text-anchor="start" font-weight="700">+10 °C à +63 °C</text><text x="275" y="295" font-size="21" fill="#102c53" text-anchor="start" font-weight="400">Zone de multiplication des microbes :</text><text x="275" y="321" font-size="21" fill="#102c53" text-anchor="start" font-weight="400">la traverser vite</text><line x1="215" y1="405" x2="260" y2="405" stroke="#0b68ae" stroke-width="4"/><text x="275" y="403" font-size="30" fill="#0b68ae" text-anchor="start" font-weight="700">0 à +4 °C</text><text x="275" y="435" font-size="21" fill="#102c53" text-anchor="start" font-weight="400">Froid positif : denrées très périssables</text><text x="275" y="461" font-size="21" fill="#102c53" text-anchor="start" font-weight="400">(voir l’étiquette du produit)</text><line x1="215" y1="525" x2="260" y2="525" stroke="#0b68ae" stroke-width="4"/><text x="275" y="523" font-size="30" fill="#0b68ae" text-anchor="start" font-weight="700">−18 °C et moins</text><text x="275" y="555" font-size="21" fill="#102c53" text-anchor="start" font-weight="400">Congélation et surgelés</text><rect x="790" y="330" width="350" height="230" rx="14" fill="#fff7e0" stroke="#f6b63d" stroke-width="2.5"/><text x="810" y="375.0" font-size="25" fill="#102c53" text-anchor="start" font-weight="700">Refroidissement rapide</text><text x="810" y="406.25" font-size="25" fill="#102c53" text-anchor="start" font-weight="700">de +63 °C à +10 °C</text><text x="810" y="437.5" font-size="25" fill="#102c53" text-anchor="start" font-weight="700">en moins de 2 heures</text><text x="810" y="468.75" font-size="25" fill="#102c53" text-anchor="start" font-weight="700">(plats cuits à l’avance)</text><rect x="790" y="110" width="350" height="190" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="810" y="155.0" font-size="25" fill="#102c53" text-anchor="start" font-weight="700">Contrôler ne suffit pas :</text><text x="810" y="186.25" font-size="25" fill="#102c53" text-anchor="start" font-weight="700">mesurer, enregistrer,</text><text x="810" y="217.5" font-size="25" fill="#102c53" text-anchor="start" font-weight="700">corriger si la valeur</text><text x="810" y="248.75" font-size="25" fill="#102c53" text-anchor="start" font-weight="700">est hors limite.</text><text x="40" y="653" font-size="18" fill="#5a6b80" text-anchor="start" font-weight="400">Repères pédagogiques (arrêté du 21 décembre 2009, fiches produit) : vérifier les limites propres à chaque denrée.</text></svg>