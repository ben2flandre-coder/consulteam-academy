<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Médiathèque · Consul Team</title><meta name="theme-color" content="#102c53"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23102c53'/%3E%3Cpath d='M18 3L8 18h7l-1 11 11-17h-8z' fill='%23f6b63d'/%3E%3C/svg%3E"><link rel="stylesheet" href="assets/style.css"></head><body>
<main id="main"><h1>Médiathèque</h1><h2>Schémas et coupes légendés</h2><p class="small">Dessins Consul Team (SVG), schémas de principe non à l'échelle. Chaque schéma indique ses sources en pied.</p><div class="grid" id="sc"></div><h2>Visuels générés par IA</h2><p class="small">Les images générées par IA sont signalées. Un emplacement grisé attend son image.</p><div class="grid" id="g"></div></main><script src="data/content.js"></script><script src="assets/app.js"></script><script>
document.getElementById('sc').innerHTML=A.schemas.map(function(s){return '<figure class="card fig"><img src="'+E(s.fichier)+'" alt="'+E(s.titre)+'" loading="lazy"><figcaption class="small"><strong>'+E(s.titre)+'</strong><br>Module '+s.module+' · <a href="'+E(s.fichier)+'">ouvrir en grand</a></figcaption></figure>'}).join('');
var g=document.getElementById('g');
g.innerHTML=A.visuels.map(function(v){return '<figure class="card fig"><div class="ph" data-f="'+E(v.fichier)+'">'+E(v.id)+' · image à venir</div><figcaption class="small"><strong>'+E(v.titre)+'</strong><br>'+E(v.legende)+'<br>Image générée par IA · contrôle '+E(v.controle)+(v.relecteur?' · '+E(v.relecteur)+' · '+E(v.statut):' · image à venir')+(v.detail?'<details><summary>Contrôle de l’image</summary>'+E(v.detail)+'</details>':'')+'</figcaption></figure>'}).join('');
function chargeIA(d){var im=new Image();im.alt=d.textContent.split(' · ')[0]+' : '+d.parentNode.querySelector('strong').textContent;im.onload=function(){d.replaceWith(im)};im.src=d.dataset.f}
var phs=document.querySelectorAll('.ph');if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){io.unobserve(e.target);chargeIA(e.target)}})},{rootMargin:'400px'});phs.forEach(function(d){io.observe(d)})}else{phs.forEach(chargeIA)}</script></body></html>
