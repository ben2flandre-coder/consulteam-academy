<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Contact direct et contact indirect</title><desc id="desc">Deux mécanismes de choc électrique — aucune mise en scène à reproduire.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S01, S09.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V22 · Contact direct et contact indirect</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Deux mécanismes de choc électrique — aucune mise en scène à reproduire.</text><rect x="70" y="250" width="620" height="400" rx="16" fill="#ffe8de" stroke="#497281" stroke-width="2"/><text x="94" y="292" font-size="27" fill="#173b50">Contact direct</text><text x="94" y="333" font-size="22" fill="#173b50">Pièce active normalement sous tension</text><text x="94" y="365" font-size="22" fill="#173b50">Borne ou conducteur dénudé</text><text x="94" y="397" font-size="22" fill="#173b50">Prévenir l’accès aux parties actives</text><rect x="880" y="250" width="650" height="400" rx="16" fill="#fff0cc" stroke="#497281" stroke-width="2"/><text x="904" y="292" font-size="27" fill="#173b50">Contact indirect</text><text x="904" y="333" font-size="22" fill="#173b50">Masse accidentellement sous tension</text><text x="904" y="365" font-size="22" fill="#173b50">Défaut d’isolement possible</text><text x="904" y="397" font-size="22" fill="#173b50">Protection en cas de défaut requise</text><path d="M160,720 L610,720" fill="none" stroke="#173b50" stroke-width="4" /><circle cx="610" cy="720" r="7" fill="#173b50"/><text x="160" y="785" font-size="23" fill="#173b50">Partie active accessible : danger</text><rect x="970" y="700" width="460" height="100" fill="none" stroke="#173b50" stroke-width="4"/><path d="M970,750 L1050,750" fill="none" stroke="#b32d34" stroke-width="4" /><text x="1080" y="760" font-size="23" fill="#173b50">Masse en défaut</text><rect x="35" y="875" width="1530" height="100" rx="10" fill="#fff0cc"/><text x="55" y="911" font-size="23" fill="#173b50">SUPPORT PÉDAGOGIQUE — PAS UNE PROCÉDURE VALIDÉE POUR LE SITE</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S01, S09</text></g></svg>