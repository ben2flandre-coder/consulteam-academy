<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Un cadenas ne prouve pas toute la consignation</title><desc id="desc">Le verrouillage est une composante de la mise en sécurité.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S01, S04.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V04 · Un cadenas ne prouve pas toute la consignation</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Le verrouillage est une composante de la mise en sécurité.</text><rect x="80" y="250" width="600" height="480" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="104" y="292" font-size="27" fill="#173b50">Condamnation visible</text><text x="104" y="333" font-size="22" fill="#173b50">Organe de séparation identifié</text><text x="104" y="365" font-size="22" fill="#173b50">Position ouverte à confirmer</text><text x="104" y="397" font-size="22" fill="#173b50">Dispositif adapté à l’organe</text><text x="104" y="429" font-size="22" fill="#173b50">Signalisation et gestion prévues</text><path d="M690,490 L860,490" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><rect x="890" y="250" width="600" height="480" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="914" y="292" font-size="27" fill="#173b50">Preuves encore nécessaires</text><text x="914" y="333" font-size="22" fill="#173b50">Autres sources recherchées</text><text x="914" y="365" font-size="22" fill="#173b50">Identification de la partie</text><text x="914" y="397" font-size="22" fill="#173b50">VAT réalisée correctement</text><text x="914" y="429" font-size="22" fill="#173b50">Énergies résiduelles traitées</text><rect x="35" y="875" width="1530" height="100" rx="10" fill="#fff0cc"/><text x="55" y="911" font-size="23" fill="#173b50">SUPPORT PÉDAGOGIQUE — PAS UNE PROCÉDURE VALIDÉE POUR LE SITE</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S01, S04</text></g></svg>