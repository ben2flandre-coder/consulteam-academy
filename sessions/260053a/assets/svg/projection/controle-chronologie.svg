<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 118 1040 438" role="img" aria-labelledby="title desc"><title id="title">Trois moments, trois vérifications</title><desc id="desc">Une vérification périodique à jour ne remplace pas l’examen d’usage.</desc><rect width="1100" height="620" fill="#fff"/><style>text{font-family:Segoe UI,Arial,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect x="0" y="0" width="14" height="620" rx="0" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="40" y="56" font-size="34" fill="#102c53" font-weight="800">Trois moments, trois vérifications</text><text x="40" y="94" font-size="23" fill="#52677d" font-weight="500">Une vérification périodique à jour ne remplace pas l’examen d’usage.</text><path d="M100 230 L990 230" fill="none" stroke="#0b68ae" stroke-width="8"/><circle cx="140" cy="230" r="23" fill="#0b68ae" stroke="none" stroke-width="4"/><circle cx="550" cy="230" r="23" fill="#102c53" stroke="none" stroke-width="4"/><circle cx="960" cy="230" r="23" fill="#b8322a" stroke="none" stroke-width="4"/><text x="70" y="180" font-size="25" fill="#0b68ae" font-weight="800">AVANT L’EMPLOI</text><text x="407" y="180" font-size="25" fill="#102c53" font-weight="800">PÉRIODIQUEMENT</text><text x="790" y="180" font-size="24" fill="#b8322a" font-weight="800">APRÈS ÉVÉNEMENT</text><text x="65" y="307" font-size="24" fill="#102c53" font-weight="500">Utilisateur</text><text x="65" y="353" font-size="24" fill="#102c53" font-weight="500">État et fonctionnement</text><text x="65" y="399" font-size="24" fill="#102c53" font-weight="500">Compatibilité et suivi</text><text x="410" y="307" font-size="24" fill="#102c53" font-weight="500">Personne compétente</text><text x="410" y="353" font-size="24" fill="#102c53" font-weight="500">Vérification tracée</text><text x="410" y="399" font-size="24" fill="#102c53" font-weight="500">Moins de douze mois*</text><text x="785" y="307" font-size="24" fill="#102c53" font-weight="500">Chute, choc, doute…</text><text x="785" y="353" font-size="24" fill="#102c53" font-weight="500">Mise à l’écart</text><text x="785" y="399" font-size="24" fill="#102c53" font-weight="500">Décision selon la notice</text><rect x="65" y="470" width="965" height="61" rx="14" fill="#fff5d9" stroke="none" stroke-width="3"/><text x="86" y="509" font-size="22" fill="#102c53" font-weight="500">* Systèmes concernés par l’arrêté du 19 mars 1993 ; délai réduit si nécessaire.</text><path d="M40 570 L1060 570" fill="none" stroke="#d6e0ea" stroke-width="2"/><text x="40" y="603" font-size="19" fill="#52677d" font-weight="500">La notice, les conditions d’usage et l’historique complètent les exigences réglementaires</text></svg>