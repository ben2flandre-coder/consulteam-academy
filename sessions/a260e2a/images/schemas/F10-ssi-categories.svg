<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">Catégories de SSI de A à E</title><desc id="d">Cinq catégories par ordre de sévérité décroissante, de la plus complète A à la plus simple E.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#102c53}.b{font-weight:700}.s{font-size:12.5px}.m{font-size:15px}.w{fill:#fff}</style><rect width="760" height="340" rx="16" fill="#f4f7fb"/><text x="30" y="34" class="b m">Cinq catégories, de la plus complète à la plus simple</text><rect x="30" y="56" width="700" height="44" rx="10" fill="#102c53"/><circle cx="56" cy="78" r="16" fill="#fff"/><text x="56" y="84" text-anchor="middle" class="b m">A</text><text x="86" y="83" class="b m w">Détection automatique + CMSI</text><rect x="52" y="110" width="656" height="44" rx="10" fill="#2a6fb0"/><circle cx="78" cy="132" r="16" fill="#fff"/><text x="78" y="138" text-anchor="middle" class="b m">B</text><text x="108" y="137" class="b m w">CMSI, sans détection automatique</text><rect x="74" y="164" width="612" height="44" rx="10" fill="#4f8fcf"/><circle cx="100" cy="186" r="16" fill="#fff"/><text x="100" y="192" text-anchor="middle" class="b m">C</text><text x="130" y="191" class="b m w">Commande regroupée + signalisation des positions</text><rect x="96" y="218" width="568" height="44" rx="10" fill="#f6b63d"/><circle cx="122" cy="240" r="16" fill="#fff"/><text x="122" y="246" text-anchor="middle" class="b m">D</text><text x="152" y="245" class="b m">Commandes regroupées</text><rect x="118" y="272" width="524" height="44" rx="10" fill="#f8d58f"/><circle cx="144" cy="294" r="16" fill="#fff"/><text x="144" y="300" text-anchor="middle" class="b m">E</text><text x="174" y="299" class="b m">Commande locale de chaque DAS</text><text x="30" y="332" class="s">Sévérité décroissante de A à E · schéma de principe</text></svg>