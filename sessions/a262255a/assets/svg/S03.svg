<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Les 7 principes de la méthode HACCP</title><desc id="d">Sept principes numérotés, de l’analyse des dangers à la documentation.</desc><rect width="1200" height="675" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Les 7 principes de la méthode HACCP</text><circle cx="100" cy="160" r="32" fill="#102c53" stroke="none" stroke-width="3"/><text x="100" y="171" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><rect x="150" y="110" width="440" height="100" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="370.0" y="152.875" font-size="25" fill="#102c53" text-anchor="middle" font-weight="700">Analyser</text><text x="370.0" y="184.125" font-size="25" fill="#102c53" text-anchor="middle" font-weight="700">les dangers</text><circle cx="660" cy="160" r="32" fill="#102c53" stroke="none" stroke-width="3"/><text x="660" y="171" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><rect x="710" y="110" width="440" height="100" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="930.0" y="152.875" font-size="25" fill="#102c53" text-anchor="middle" font-weight="700">Déterminer les points</text><text x="930.0" y="184.125" font-size="25" fill="#102c53" text-anchor="middle" font-weight="700">critiques (CCP)</text><circle cx="100" cy="295" r="32" fill="#102c53" stroke="none" stroke-width="3"/><text x="100" y="306" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><rect x="150" y="245" width="440" height="100" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="370.0" y="287.875" font-size="25" fill="#102c53" text-anchor="middle" font-weight="700">Fixer les</text><text x="370.0" y="319.125" font-size="25" fill="#102c53" text-anchor="middle" font-weight="700">limites critiques</text><circle cx="660" cy="295" r="32" fill="#102c53" stroke="none" stroke-width="3"/><text x="660" y="306" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><rect x="710" y="245" width="440" height="100" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="930.0" y="287.875" font-size="25" fill="#102c53" text-anchor="middle" font-weight="700">Surveiller</text><text x="930.0" y="319.125" font-size="25" fill="#102c53" text-anchor="middle" font-weight="700">chaque CCP</text><circle cx="100" cy="430" r="32" fill="#102c53" stroke="none" stroke-width="3"/><text x="100" y="441" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><rect x="150" y="380" width="440" height="100" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="370.0" y="422.875" font-size="25" fill="#102c53" text-anchor="middle" font-weight="700">Prévoir les</text><text x="370.0" y="454.125" font-size="25" fill="#102c53" text-anchor="middle" font-weight="700">actions correctives</text><circle cx="660" cy="430" r="32" fill="#102c53" stroke="none" stroke-width="3"/><text x="660" y="441" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="700">6</text><rect x="710" y="380" width="440" height="100" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="930.0" y="422.875" font-size="25" fill="#102c53" text-anchor="middle" font-weight="700">Vérifier que le</text><text x="930.0" y="454.125" font-size="25" fill="#102c53" text-anchor="middle" font-weight="700">système fonctionne</text><circle cx="380" cy="565" r="32" fill="#102c53" stroke="none" stroke-width="3"/><text x="380" y="576" font-size="32" fill="#ffffff" text-anchor="middle" font-weight="700">7</text><rect x="430" y="515" width="440" height="100" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="650.0" y="557.875" font-size="25" fill="#102c53" text-anchor="middle" font-weight="700">Documenter</text><text x="650.0" y="589.125" font-size="25" fill="#102c53" text-anchor="middle" font-weight="700">et enregistrer</text><text x="40" y="653" font-size="18" fill="#5a6b80" text-anchor="start" font-weight="400">Principes du Codex Alimentarius repris par le paquet hygiène.</text></svg>