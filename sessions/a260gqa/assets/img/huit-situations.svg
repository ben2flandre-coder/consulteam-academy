<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Les huit situations à secourir</title><desc id="d">Saignement abondant, étouffement, malaise, brûlure, douleur, plaie, ne répond pas mais respire, ne répond pas et ne respire pas.</desc><rect width="1200" height="560" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Les huit situations à secourir</text><rect x="60" y="130" width="250" height="170" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><circle cx="185" cy="170" r="28" fill="#102c53"/><text x="185" y="180" font-size="30" font-weight="700" fill="#f6b63d" text-anchor="middle">1</text><text x="185" y="238" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">Saigne abondamment</text><rect x="340" y="130" width="250" height="170" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><circle cx="465" cy="170" r="28" fill="#102c53"/><text x="465" y="180" font-size="30" font-weight="700" fill="#f6b63d" text-anchor="middle">2</text><text x="465" y="238" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">S’étouffe</text><rect x="620" y="130" width="250" height="170" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><circle cx="745" cy="170" r="28" fill="#102c53"/><text x="745" y="180" font-size="30" font-weight="700" fill="#f6b63d" text-anchor="middle">3</text><text x="745" y="238" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">Malaise</text><rect x="900" y="130" width="250" height="170" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><circle cx="1025" cy="170" r="28" fill="#102c53"/><text x="1025" y="180" font-size="30" font-weight="700" fill="#f6b63d" text-anchor="middle">4</text><text x="1025" y="238" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">Brûlure</text><rect x="60" y="330" width="250" height="170" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><circle cx="185" cy="370" r="28" fill="#102c53"/><text x="185" y="380" font-size="30" font-weight="700" fill="#f6b63d" text-anchor="middle">5</text><text x="185" y="438" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">Douleur, mouvement</text><text x="185" y="462" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">gêné</text><rect x="340" y="330" width="250" height="170" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><circle cx="465" cy="370" r="28" fill="#102c53"/><text x="465" y="380" font-size="30" font-weight="700" fill="#f6b63d" text-anchor="middle">6</text><text x="465" y="438" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">Plaie qui ne saigne</text><text x="465" y="462" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">pas abondamment</text><rect x="620" y="330" width="250" height="170" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><circle cx="745" cy="370" r="28" fill="#102c53"/><text x="745" y="380" font-size="30" font-weight="700" fill="#f6b63d" text-anchor="middle">7</text><text x="745" y="438" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">Ne répond pas,</text><text x="745" y="462" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">respire</text><rect x="900" y="330" width="250" height="170" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><circle cx="1025" cy="370" r="28" fill="#102c53"/><text x="1025" y="380" font-size="30" font-weight="700" fill="#f6b63d" text-anchor="middle">8</text><text x="1025" y="438" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">Ne répond pas, ne</text><text x="1025" y="462" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">respire pas</text><text x="600" y="535" font-size="21" fill="#53657a" text-anchor="middle">Après protéger, examiner et alerter : chaque situation a sa fiche.</text><text x="1160" y="544" font-size="14" text-anchor="end" fill="#53657a">Consulteam · SST</text></svg>