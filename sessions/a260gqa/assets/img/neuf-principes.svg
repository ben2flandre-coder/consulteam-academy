<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Les neuf principes généraux de prévention</title><desc id="d">Neuf principes de l’article L4121-2 du Code du travail.</desc><rect width="1200" height="560" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Les neuf principes généraux de prévention</text><rect x="40" y="110" width="350" height="120" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="40" y="110" width="62" height="120" rx="14" fill="#102c53"/><rect x="80" y="110" width="22" height="120" fill="#102c53"/><text x="71" y="184" font-size="36" font-weight="700" fill="#f6b63d" text-anchor="middle">1</text><text x="120" y="190" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">Éviter les risques</text><rect x="415" y="110" width="350" height="120" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="415" y="110" width="62" height="120" rx="14" fill="#102c53"/><rect x="455" y="110" width="22" height="120" fill="#102c53"/><text x="446" y="184" font-size="36" font-weight="700" fill="#f6b63d" text-anchor="middle">2</text><text x="495" y="154" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">Évaluer les risques</text><text x="495" y="179" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">qui ne peuvent être</text><text x="495" y="204" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">évités</text><rect x="790" y="110" width="350" height="120" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="790" y="110" width="62" height="120" rx="14" fill="#102c53"/><rect x="830" y="110" width="22" height="120" fill="#102c53"/><text x="821" y="184" font-size="36" font-weight="700" fill="#f6b63d" text-anchor="middle">3</text><text x="870" y="181" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">Combattre les risques</text><text x="870" y="206" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">à la source</text><rect x="40" y="250" width="350" height="120" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="40" y="250" width="62" height="120" rx="14" fill="#102c53"/><rect x="80" y="250" width="22" height="120" fill="#102c53"/><text x="71" y="324" font-size="36" font-weight="700" fill="#f6b63d" text-anchor="middle">4</text><text x="120" y="321" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">Adapter le travail à</text><text x="120" y="346" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">l’être humain</text><rect x="415" y="250" width="350" height="120" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="415" y="250" width="62" height="120" rx="14" fill="#102c53"/><rect x="455" y="250" width="22" height="120" fill="#102c53"/><text x="446" y="324" font-size="36" font-weight="700" fill="#f6b63d" text-anchor="middle">5</text><text x="495" y="294" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">Tenir compte de</text><text x="495" y="319" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">l’évolution de la</text><text x="495" y="344" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">technique</text><rect x="790" y="250" width="350" height="120" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="790" y="250" width="62" height="120" rx="14" fill="#102c53"/><rect x="830" y="250" width="22" height="120" fill="#102c53"/><text x="821" y="324" font-size="36" font-weight="700" fill="#f6b63d" text-anchor="middle">6</text><text x="870" y="294" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">Remplacer ce qui est</text><text x="870" y="319" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">dangereux par ce qui</text><text x="870" y="344" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">l’est moins</text><rect x="40" y="390" width="350" height="120" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="40" y="390" width="62" height="120" rx="14" fill="#102c53"/><rect x="80" y="390" width="22" height="120" fill="#102c53"/><text x="71" y="464" font-size="36" font-weight="700" fill="#f6b63d" text-anchor="middle">7</text><text x="120" y="461" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">Planifier la</text><text x="120" y="486" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">prévention</text><rect x="415" y="390" width="350" height="120" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="415" y="390" width="62" height="120" rx="14" fill="#102c53"/><rect x="455" y="390" width="22" height="120" fill="#102c53"/><text x="446" y="464" font-size="36" font-weight="700" fill="#f6b63d" text-anchor="middle">8</text><text x="495" y="434" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">Protection collective</text><text x="495" y="459" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">avant protection</text><text x="495" y="484" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">individuelle</text><rect x="790" y="390" width="350" height="120" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="790" y="390" width="62" height="120" rx="14" fill="#102c53"/><rect x="830" y="390" width="22" height="120" fill="#102c53"/><text x="821" y="464" font-size="36" font-weight="700" fill="#f6b63d" text-anchor="middle">9</text><text x="870" y="434" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">Donner les</text><text x="870" y="459" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">instructions</text><text x="870" y="484" font-size="20" fill="#16273d" text-anchor="start" font-weight="400">appropriées</text><text x="1160" y="544" font-size="14" text-anchor="end" fill="#53657a">Consulteam · SST</text></svg>