<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d"><title id="t">Coupe d&#x27;un contacteur électromagnétique</title><desc id="d">Schéma de principe en coupe, au repos : bobine sur le circuit magnétique fixe, armature mobile, entrefer, ressort de rappel, spire de déphasage, pont de contacts mobile, contacts fixes avec bornes de puissance et bloc de contacts auxiliaires.</desc><style>.lbl,.num{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}</style><rect width="960" height="640" fill="#ffffff"/><text class="lbl" x="24" y="34" font-size="20" font-weight="700" text-anchor="start" fill="#102c53">Coupe d&#x27;un contacteur électromagnétique (au repos)</text><text class="lbl" x="24" y="56" font-size="13" font-weight="400" text-anchor="start" fill="#53657a">Schéma de principe, non à l&#x27;échelle</text><rect x="40" y="90" width="600" height="480" rx="16" fill="#f4f7fb" stroke="#102c53" stroke-width="3" /><rect x="100" y="120" width="60" height="26" rx="3" fill="#cbd5e1" stroke="#102c53" stroke-width="2" /><rect x="300" y="120" width="60" height="26" rx="3" fill="#cbd5e1" stroke="#102c53" stroke-width="2" /><rect x="480" y="120" width="60" height="26" rx="3" fill="#cbd5e1" stroke="#102c53" stroke-width="2" /><rect x="112" y="150" width="36" height="12" rx="2" fill="#f6b63d" stroke="#102c53" stroke-width="2" /><rect x="312" y="150" width="36" height="12" rx="2" fill="#f6b63d" stroke="#102c53" stroke-width="2" /><rect x="492" y="150" width="36" height="12" rx="2" fill="#f6b63d" stroke="#102c53" stroke-width="2" /><line x1="100" y1="110" x2="100" y2="120" stroke="#102c53" stroke-width="3" /><line x1="160" y1="110" x2="160" y2="120" stroke="#102c53" stroke-width="3" /><line x1="130" y1="162" x2="130" y2="200" stroke="#53657a" stroke-width="2" /><line x1="330" y1="162" x2="330" y2="200" stroke="#53657a" stroke-width="2" /><line x1="510" y1="162" x2="510" y2="200" stroke="#53657a" stroke-width="