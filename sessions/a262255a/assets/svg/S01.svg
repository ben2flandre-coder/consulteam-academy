<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Marche en avant en cuisine</title><desc id="d">Schéma d’une cuisine : réception, stockage, préparation, cuisson et service dans un sens unique ; circuit sale séparé.</desc><rect width="1200" height="675" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Marche en avant en cuisine</text><rect x="60" y="150" width="190" height="110" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="155.0" y="213.84" font-size="26" fill="#102c53" text-anchor="middle" font-weight="700">Réception</text><rect x="280" y="150" width="190" height="110" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="375.0" y="213.84" font-size="26" fill="#102c53" text-anchor="middle" font-weight="700">Stockage</text><rect x="500" y="150" width="190" height="110" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="595.0" y="213.84" font-size="26" fill="#102c53" text-anchor="middle" font-weight="700">Préparation</text><rect x="720" y="150" width="190" height="110" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="815.0" y="213.84" font-size="26" fill="#102c53" text-anchor="middle" font-weight="700">Cuisson</text><rect x="940" y="150" width="190" height="110" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="1035.0" y="213.84" font-size="26" fill="#102c53" text-anchor="middle" font-weight="700">Service</text><line x1="250" y1="205" x2="274.0" y2="205.0" stroke="#0b68ae" stroke-width="5"/><polygon points="280,205 265.6,212.0 265.6,198.0" fill="#0b68ae"/><line x1="470" y1="205" x2="494.0" y2="205.0" stroke="#0b68ae" stroke-width="5"/><polygon points="500,205 485.6,212.0 485.6,198.0" fill="#0b68ae"/><line x1="690" y1="205" x2="714.0" y2="205.0" stroke="#0b68ae" stroke-width="5"/><polygon points="720,205 705.6,212.0 705.6,198.0" fill="#0b68ae"/><line x1="910" y1="205" x2="934.0" y2="205.0" stroke="#0b68ae" stroke-width="5"/><polygon points="940,205 925.6,212.0 925.6,198.0" fill="#0b68ae"/><text x="600" y="125" font-size="24" fill="#0b68ae" text-anchor="middle" font-weight="700">Les produits avancent toujours dans le même sens</text><rect x="60" y="340" width="190" height="90" rx="14" fill="#fdeede" stroke="#c25b00" stroke-width="2.5"/><text x="155.0" y="378.73" font-size="22" fill="#c25b00" text-anchor="middle" font-weight="700">Déchets</text><text x="155.0" y="406.23" font-size="22" fill="#c25b00" text-anchor="middle" font-weight="700">emballages</text><rect x="500" y="340" width="190" height="90" rx="14" fill="#fdeede" stroke="#c25b00" stroke-width="2.5"/><text x="595.0" y="378.73" font-size="22" fill="#c25b00" text-anchor="middle" font-weight="700">Plonge</text><text x="595.0" y="406.23" font-size="22" fill="#c25b00" text-anchor="middle" font-weight="700">vaisselle sale</text><line x1="250" y1="385" x2="494.0" y2="385.0" stroke="#c25b00" stroke-width="4" stroke-dasharray="10 8"/><polygon points="500,385 485.6,392.0 485.6,378.0" fill="#c25b00"/><text x="375" y="372" font-size="20" fill="#c25b00" text-anchor="middle" font-weight="700">circuit sale</text><line x1="595" y1="260" x2="595.0" y2="334.0" stroke="#c25b00" stroke-width="4" stroke-dasharray="10 8"/><polygon points="595,340 588.0,325.6 602.0,325.6" fill="#c25b00"/><rect x="720" y="340" width="190" height="90" rx="14" fill="#e6f3ec" stroke="#1e7a46" stroke-width="2.5"/><text x="815.0" y="378.73" font-size="22" fill="#1e7a46" text-anchor="middle" font-weight="700">Vaisselle</text><text x="815.0" y="406.23" font-size="22" fill="#1e7a46" text-anchor="middle" font-weight="700">propre</text><line x1="690" y1="385" x2="714.0" y2="385.0" stroke="#1e7a46" stroke-width="4"/><polygon points="720,385 705.6,392.0 705.6,378.0" fill="#1e7a46"/><line x1="815" y1="340" x2="815.0" y2="266.0" stroke="#1e7a46" stroke-width="4"/><polygon points="815,260 822.0,274.4 808.0,274.4" fill="#1e7a46"/><rect x="60" y="480" width="1080" height="150" rx="14" fill="#fff7e0" stroke="#f6b63d" stroke-width="2.5"/><text x="80" y="520.0" font-size="24" fill="#102c53" text-anchor="start" font-weight="700">À retenir</text><text x="80" y="550.0" font-size="24" fill="#102c53" text-anchor="start" font-weight="700">• Jamais de croisement entre le cru et le cuit, ni entre le propre et le sale.</text><text x="80" y="580.0" font-size="24" fill="#102c53" text-anchor="start" font-weight="700">• Si l’espace manque : séparer dans le temps (nettoyer et désinfecter entre deux tâches).</text><text x="40" y="653" font-size="18" fill="#5a6b80" text-anchor="start" font-weight="400">Schéma générique : à adapter à l’agencement réel de l’établissement.</text></svg>