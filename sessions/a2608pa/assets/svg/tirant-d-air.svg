45" stroke-width="2"/><path d="M136 276 l-7 11" stroke="#082b45" stroke-width="2"/><path d="M148 276 l-7 11" stroke="#082b45" stroke-width="2"/><path d="M160 276 l-7 11" stroke="#082b45" stroke-width="2"/><path d="M172 276 l-7 11" stroke="#082b45" stroke-width="2"/><path d="M184 276 l-7 11" stroke="#082b45" stroke-width="2"/><path d="M196 276 l-7 11" stroke="#082b45" stroke-width="2"/><path d="M208 276 l-7 11" stroke="#082b45" stroke-width="2"/><path d="M220 276 l-7 11" stroke="#082b45" stroke-width="2"/><path d="M232 276 l-7 11" stroke="#082b45" stroke-width="2"/><path d="M244 276 l-7 11" stroke="#082b45" stroke-width="2"/><text x="60" y="308" class="xs">sol ou obstacle le plus haut</text><text x="60" y="324" class="xs">sous l’utilisateur</text><path d="M78 56 v220" stroke="#112f43" stroke-width="2"/><path d="M72 64 l6 -9 l6 9 M72 268 l6 9 l6 -9" fill="none" stroke="#112f43" stroke-width="2"/><text x="60" y="166" transform="rotate(-90 60 166)" text-anchor="middle" class="s b">tirant d’air nécessaire</text><rect x="392" y="56" width="228" height="236" rx="12" fill="#f4f8fb" stroke="#cddae3"/><text x="410" y="84" class="m b n">À retenir</text><text x="410" y="110" class="s">• valeurs lues dans la notice</text><text x="410" y="130" class="s">  du système exact</text><text x="410" y="158" class="s">• aucun chiffre générique</text><text x="410" y="186" class="s">• hauteur libre disponible</text><text x="410" y="206" class="s">  ≥ tirant d’air nécessaire</text><text x="410" y="234" class="s">• vérifier chaque obstacle</text><text x="410" y="254" class="s">  sur la trajectoire</text></svg>