<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Commande et puissance : deux périmètres à vérifier</title><desc id="desc">Architecture fictive de principe ; pas de schéma de câblage.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S01, S04.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V14 · Commande et puissance : deux périmètres à vérifier</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Architecture fictive de principe ; pas de schéma de câblage.</text><rect x="70" y="230" width="450" height="180" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="94" y="272" font-size="27" fill="#173b50">Départ puissance</text><text x="94" y="313" font-size="22" fill="#173b50">Protection / séparation à étudier</text><rect x="70" y="570" width="450" height="180" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="94" y="612" font-size="27" fill="#173b50">Départ commande</text><text x="94" y="653" font-size="22" fill="#173b50">Peut être indépendant</text><rect x="750" y="230" width="700" height="180" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="774" y="272" font-size="27" fill="#173b50">Entraînement</text><text x="774" y="313" font-size="22" fill="#173b50">Contacteur ou variateur → moteur</text><rect x="750" y="570" width="700" height="180" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="774" y="612" font-size="27" fill="#173b50">Commande et automatismes</text><text x="774" y="653" font-size="22" fill="#173b50">Capteurs / automate / actionneurs</text><path d="M520,320 L750,320" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><path d="M520,660 L750,660" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><path d="M1100,570 L1100,410" fill="none" stroke="#0b6672" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/><text x="100" y="815" font-size="25" fill="#173b50">Couper la puissance ne permet pas de conclure que tous les circuits sont hors tension.</text><rect x="35" y="875" width="1530" height="100" rx="10" fill="#fff0cc"/><text x="55" y="911" font-size="23" fill="#173b50">SUPPORT PÉDAGOGIQUE — PAS UNE PROCÉDURE VALIDÉE POUR LE SITE</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S01, S04</text></g></svg>