<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t d" font-family="Segoe UI,system-ui,Arial,sans-serif"><title id="t">Du danger au dommage</title><desc id="d">Quatre étapes : danger, situation dangereuse, événement déclencheur, dommage ; deux leviers d’action sur le risque.</desc><rect x="1" y="1" width="718" height="403" rx="16" fill="#fff" stroke="#e4dde9" stroke-width="2"/><text x="360" y="40" font-size="22" fill="#1b2a41" text-anchor="middle" font-weight="700" >Du danger au dommage</text><rect x="24" y="95" width="150" height="110" rx="12" fill="#e5007d" stroke="none" stroke-width="2"/><text x="99.0" y="138" font-size="16" fill="#fff" text-anchor="middle" font-weight="700" >Danger</text><text x="99.0" y="165" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="400" >charge, geste, cadence</text><line x1="178" y1="150" x2="197.5" y2="150.0" stroke="#5b5166" stroke-width="3" stroke-linecap="round"/><polygon points="202,150 193.8959760788259,153.91468980700108 193.8959760788259,146.08531019299892" fill="#5b5166"/><rect x="206" y="95" width="150" height="110" rx="12" fill="#db0d5d" stroke="none" stroke-width="2"/><text x="281.0" y="138" font-size="16" fill="#fff" text-anchor="middle" font-weight="700" >Situation dangereuse</text><text x="281.0" y="165" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="400" >exposition répétée</text><line x1="360" y1="150" x2="379.5" y2="150.0" stroke="#5b5166" stroke-width="3" stroke-linecap="round"/><polygon points="384,150 375.8959760788259,153.91468980700108 375.8959760788259,146.08531019299892" fill="#5b5166"/><rect x="388" y="95" width="150" height="110" rx="12" fill="#d21b3e" stroke="none" stroke-width="2"/><text x="463.0" y="138" font-size="16" fill="#fff" text-anchor="middle" font-weight="700" >Événement déclencheur</text><text x="463.0" y="165" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="400" >effort, geste brusque</text><line x1="542" y1="150" x2="561.5" y2="150.0" stroke="#5b5166" stroke-width="3" stroke-linecap="round"/><polygon points="566,150 557.8959760788259,153.91468980700108 557.8959760788259,146.08531019299892" fill="#5b5166"/><rect x="570" y="95" width="150" height="110" rx="12" fill="#c8281e" stroke="none" stroke-width="2"/><text x="645.0" y="138" font-size="16" fill="#fff" text-anchor="middle" font-weight="700" >Dommage</text><text x="645.0" y="165" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="400" >TMS : douleur, gêne, arrêt</text><rect x="120" y="240" width="480" height="56" rx="12" fill="#faf6fb" stroke="#e4dde9" stroke-width="2"/><text x="360" y="276" font-size="21" fill="#1b2a41" text-anchor="middle" font-weight="700" >Risque = probabilité × gravité</text><rect x="60" y="318" width="280" height="52" rx="12" fill="#fff" stroke="#E5007D" stroke-width="2.5"/><text x="200" y="340" font-size="12" fill="#E5007D" text-anchor="middle" font-weight="700" >Levier 1</text><text x="200" y="359" font-size="13.5" fill="#1b2a41" text-anchor="middle" font-weight="400" >réduire la fréquence d’exposition</text><rect x="380" y="318" width="280" height="52" rx="12" fill="#fff" stroke="#C8281E" stroke-width="2.5"/><text x="520" y="340" font-size="12" fill="#C8281E" text-anchor="middle" font-weight="700" >Levier 2</text><text x="520" y="359" font-size="13.5" fill="#1b2a41" text-anchor="middle" font-weight="400" >réduire la gravité à chaque exposition</text></svg>