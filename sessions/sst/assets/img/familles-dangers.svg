<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Les quatre familles de dangers persistants</title><desc id="d">Mécanique, électrique, thermique, atmosphère toxique ou irrespirable.</desc><rect width="1200" height="560" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Les quatre familles de dangers persistants</text><rect x="52.0" y="150" width="250" height="240" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="52.0" y="150" width="250" height="58" rx="14" fill="#102c53"/><rect x="52.0" y="190" width="250" height="18" fill="#102c53"/><text x="177.0" y="189" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Mécanique</text><text x="177.0" y="248" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">Chute, coupure,</text><text x="177.0" y="275" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">écrasement,</text><text x="177.0" y="303" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">objet qui tombe</text><rect x="334.0" y="150" width="250" height="240" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="334.0" y="150" width="250" height="58" rx="14" fill="#102c53"/><rect x="334.0" y="190" width="250" height="18" fill="#102c53"/><text x="459.0" y="189" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Électrique</text><text x="459.0" y="248" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">Contact avec</text><text x="459.0" y="275" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">une pièce sous</text><text x="459.0" y="303" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">tension</text><rect x="616.0" y="150" width="250" height="240" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="616.0" y="150" width="250" height="58" rx="14" fill="#102c53"/><rect x="616.0" y="190" width="250" height="18" fill="#102c53"/><text x="741.0" y="189" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Thermique</text><text x="741.0" y="248" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">Flamme, surface</text><text x="741.0" y="275" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">chaude, incendie,</text><text x="741.0" y="303" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">explosion</text><rect x="898.0" y="150" width="250" height="240" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="898.0" y="150" width="250" height="58" rx="14" fill="#102c53"/><rect x="898.0" y="190" width="250" height="18" fill="#102c53"/><text x="1023.0" y="189" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Atmosphère</text><text x="1023.0" y="248" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">Toxique ou</text><text x="1023.0" y="275" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">irrespirable :</text><text x="1023.0" y="303" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">gaz, fumées</text><rect x="52.0" y="430" width="1096" height="70" rx="12" fill="#fff6dc" stroke="#f6b63d" stroke-width="2"/><text x="600" y="473" font-size="23" fill="#102c53" text-anchor="middle" font-weight="700">Un danger persistant menace la victime comme le sauveteur.</text><text x="1160" y="544" font-size="14" text-anchor="end" fill="#53657a">Consulteam · SST</text></svg>