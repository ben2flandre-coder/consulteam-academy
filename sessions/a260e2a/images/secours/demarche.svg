<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">La démarche du SST</title><desc id="d">Quatre étapes dans cet ordre : protéger, examiner, faire alerter ou alerter, secourir.</desc><rect width="1200" height="560" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">La démarche du SST</text><rect x="52.0" y="150" width="250" height="250" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="52.0" y="150" width="250" height="58" rx="14" fill="#102c53"/><rect x="52.0" y="190" width="250" height="18" fill="#102c53"/><text x="177.0" y="189" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Protéger</text><circle cx="82.0" cy="144" r="22" fill="#f6b63d" stroke="#102c53" stroke-width="3"/><text x="82.0" y="152" font-size="24" font-weight="700" fill="#102c53" text-anchor="middle">1</text><text x="177.0" y="248" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">Se protéger,</text><text x="177.0" y="275" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">protéger les autres,</text><text x="177.0" y="303" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">supprimer ou isoler</text><text x="177.0" y="330" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">le danger</text><path d="M305.0 275H317.0" stroke="#102c53" stroke-width="5" fill="none"/><path d="M331.0 275l-18 -11v22z" fill="#102c53"/><rect x="334.0" y="150" width="250" height="250" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="334.0" y="150" width="250" height="58" rx="14" fill="#102c53"/><rect x="334.0" y="190" width="250" height="18" fill="#102c53"/><text x="459.0" y="189" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Examiner</text><circle cx="364.0" cy="144" r="22" fill="#f6b63d" stroke="#102c53" stroke-width="3"/><text x="364.0" y="152" font-size="24" font-weight="700" fill="#102c53" text-anchor="middle">2</text><text x="459.0" y="248" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">Saigne-t-elle</text><text x="459.0" y="275" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">abondamment ?</text><text x="459.0" y="303" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">S’étouffe-t-elle ?</text><text x="459.0" y="330" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">Répond-elle ?</text><text x="459.0" y="357" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">Respire-t-elle ?</text><path d="M587.0 275H599.0" stroke="#102c53" stroke-width="5" fill="none"/><path d="M613.0 275l-18 -11v22z" fill="#102c53"/><rect x="616.0" y="150" width="250" height="250" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="616.0" y="150" width="250" height="58" rx="14" fill="#102c53"/><rect x="616.0" y="190" width="250" height="18" fill="#102c53"/><text x="741.0" y="189" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Alerter</text><circle cx="646.0" cy="144" r="22" fill="#f6b63d" stroke="#102c53" stroke-width="3"/><text x="646.0" y="152" font-size="24" font-weight="700" fill="#102c53" text-anchor="middle">3</text><text x="741.0" y="248" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">Faire alerter</text><text x="741.0" y="275" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">ou alerter soi-même</text><text x="741.0" y="303" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">15 · 18 · 112 · 114</text><path d="M869.0 275H881.0" stroke="#102c53" stroke-width="5" fill="none"/><path d="M895.0 275l-18 -11v22z" fill="#102c53"/><rect x="898.0" y="150" width="250" height="250" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="898.0" y="150" width="250" height="58" rx="14" fill="#102c53"/><rect x="898.0" y="190" width="250" height="18" fill="#102c53"/><text x="1023.0" y="189" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Secourir</text><circle cx="928.0" cy="144" r="22" fill="#f6b63d" stroke="#102c53" stroke-width="3"/><text x="928.0" y="152" font-size="24" font-weight="700" fill="#102c53" text-anchor="middle">4</text><text x="1023.0" y="248" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">Le geste adapté</text><text x="1023.0" y="275" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">à la situation,</text><text x="1023.0" y="303" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">puis surveiller jusqu’à</text><text x="1023.0" y="330" font-size="21" fill="#16273d" text-anchor="middle" font-weight="400">la prise en charge</text><rect x="52.0" y="445" width="1096" height="64" rx="12" fill="#fff6dc" stroke="#f6b63d" stroke-width="2"/><text x="600" y="485" font-size="22" fill="#102c53" text-anchor="middle" font-weight="700">Toujours dans cet ordre : on ne secourt qu’après avoir protégé et examiné.</text><text x="1160" y="544" font-size="14" text-anchor="end" fill="#53657a">Consulteam · SST</text></svg>