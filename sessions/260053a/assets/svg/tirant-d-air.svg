<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">Tirant d’air : comparer depuis le même repère</title><desc id="desc">Exemple fictif : une notice exige 4,20 mètres sous les pieds ; le site offre 3,90 mètres depuis ces mêmes pieds. Il manque 30 centimètres. La configuration est écartée.</desc>
<style>text{font-family:Arial,sans-serif;fill:#112f43;font-size:19px}.title{font-size:25px;font-weight:700}.b{font-weight:700}.small{font-size:17px}.red{fill:#b3261e}</style>
<rect width="900" height="460" rx="14" fill="white"/><text x="30" y="36" class="title">Deux distances, un seul repère de mesure</text><text x="30" y="68">Exemple fictif : la notice donne une distance sous les pieds.</text>
<path d="M65 130H445" stroke="#082b45" stroke-width="3"/><text x="68" y="116" class="b">Repère : pieds de l’utilisateur</text>
<path d="M118 140V360m-6 -10 6 10 6 -10M112 150l6 -10 6 10" fill="none" stroke="#075b9b" stroke-width="3"/>
<text x="140" y="221" class="b">4,20 m requis</text><text x="140" y="248" class="small">pour cette configuration</text><text x="140" y="274" class="small">selon la notice</text>
<path d="M370 140V335m-6 -10 6 10 6 -10M364 150l6 -10 6 10" fill="none" stroke="#b3261e" stroke-width="3"/>
<path d="M300 342H455" stroke="#b3261e" stroke-width="6"/><text x="305" y="383" class="red b">3,90 m disponibles</text><text x="305" y="410" class="small">Sol ou obstacle le plus proche</text>
<rect x="495" y="104" width="375" height="316" rx="12" fill="#f4f8fb" stroke="#cddae3"/>
<text x="515" y="143" class="b red">ESPACE INSUFFISANT</text><text x="515" y="180">Déficit : 0,30 m.</text><text x="515" y="220" class="small">La configuration est écartée.</text><text x="515" y="263" class="small">Une mesure depuis l’ancrage</text><text x="515" y="290" class="small">ne se compare pas à une exigence</text><text x="515" y="317" class="small">mesurée depuis les pieds.</text><text x="515" y="370" class="small b">Aucune valeur universelle.</text>
<text x="30" y="445" class="small">Vérifier aussi masse équipée, accessoires, déflexion d’ancrage, pendule, arêtes et secours.</text></svg>
