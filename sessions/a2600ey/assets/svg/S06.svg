<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Le parcours d’un produit, de la réception au service</title><desc id="d">Six étapes avec les points de contrôle.</desc><rect width="1200" height="675" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Le parcours d’un produit, de la réception au service</text><rect x="40" y="200" width="165" height="140" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="122.5" y="277.14" font-size="21" fill="#102c53" text-anchor="middle" font-weight="700">Réception</text><text x="122" y="380.0" font-size="18" fill="#5a6b80" text-anchor="middle" font-weight="400">CCP possible :</text><text x="122" y="402.5" font-size="18" fill="#5a6b80" text-anchor="middle" font-weight="400">température</text><line x1="205" y1="270" x2="224.0" y2="270.0" stroke="#0b68ae" stroke-width="5"/><polygon points="230,270 215.6,277.0 215.6,263.0" fill="#0b68ae"/><rect x="230" y="200" width="165" height="140" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="312.5" y="277.14" font-size="21" fill="#102c53" text-anchor="middle" font-weight="700">Stockage</text><text x="312" y="380.0" font-size="18" fill="#5a6b80" text-anchor="middle" font-weight="400">température,</text><text x="312" y="402.5" font-size="18" fill="#5a6b80" text-anchor="middle" font-weight="400">DLC</text><line x1="395" y1="270" x2="414.0" y2="270.0" stroke="#0b68ae" stroke-width="5"/><polygon points="420,270 405.6,277.0 405.6,263.0" fill="#0b68ae"/><rect x="420" y="200" width="165" height="140" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="502.5" y="277.14" font-size="21" fill="#102c53" text-anchor="middle" font-weight="700">Préparation</text><text x="502" y="380.0" font-size="18" fill="#5a6b80" text-anchor="middle" font-weight="400">mains,</text><text x="502" y="402.5" font-size="18" fill="#5a6b80" text-anchor="middle" font-weight="400">ustensiles</text><line x1="585" y1="270" x2="604.0" y2="270.0" stroke="#0b68ae" stroke-width="5"/><polygon points="610,270 595.6,277.0 595.6,263.0" fill="#0b68ae"/><rect x="610" y="200" width="165" height="140" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="692.5" y="277.14" font-size="21" fill="#102c53" text-anchor="middle" font-weight="700">Cuisson</text><text x="692" y="380.0" font-size="18" fill="#5a6b80" text-anchor="middle" font-weight="400">CCP : température</text><text x="692" y="402.5" font-size="18" fill="#5a6b80" text-anchor="middle" font-weight="400">à cœur</text><line x1="775" y1="270" x2="794.0" y2="270.0" stroke="#0b68ae" stroke-width="5"/><polygon points="800,270 785.6,277.0 785.6,263.0" fill="#0b68ae"/><rect x="800" y="200" width="165" height="140" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="882.5" y="265.155" font-size="17" fill="#102c53" text-anchor="middle" font-weight="700">Refroidissement</text><text x="882.5" y="286.405" font-size="17" fill="#102c53" text-anchor="middle" font-weight="700">ou maintien</text><text x="882" y="380.0" font-size="18" fill="#5a6b80" text-anchor="middle" font-weight="400">CCP : temps</text><text x="882" y="402.5" font-size="18" fill="#5a6b80" text-anchor="middle" font-weight="400">et température</text><line x1="965" y1="270" x2="984.0" y2="270.0" stroke="#0b68ae" stroke-width="5"/><polygon points="990,270 975.6,277.0 975.6,263.0" fill="#0b68ae"/><rect x="990" y="200" width="165" height="140" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="1072.5" y="277.14" font-size="21" fill="#102c53" text-anchor="middle" font-weight="700">Service</text><text x="1072" y="380.0" font-size="18" fill="#5a6b80" text-anchor="middle" font-weight="400">mise en valeur,</text><text x="1072" y="402.5" font-size="18" fill="#5a6b80" text-anchor="middle" font-weight="400">vitrine</text><rect x="60" y="480" width="1080" height="140" rx="14" fill="#fff7e0" stroke="#f6b63d" stroke-width="2.5"/><text x="80" y="525.0" font-size="24" fill="#102c53" text-anchor="start" font-weight="700">À chaque étape : un danger, une mesure, un enregistrement.</text><text x="80" y="555.0" font-size="24" fill="#102c53" text-anchor="start" font-weight="700">Les « CCP » indiqués sont des exemples : chaque établissement détermine les siens.</text><text x="40" y="653" font-size="18" fill="#5a6b80" text-anchor="start" font-weight="400">Les points critiques dépendent de l’analyse des dangers de l’établissement.</text></svg>