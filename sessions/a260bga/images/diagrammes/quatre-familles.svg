<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t d" font-family="Segoe UI,system-ui,Arial,sans-serif"><title id="t">Quatre familles de facteurs</title><desc id="d">Biomécanique, organisationnel, psychosocial, environnemental, qui se cumulent autour des TMS.</desc><rect x="1" y="1" width="718" height="403" rx="16" fill="#fff" stroke="#e4dde9" stroke-width="2"/><text x="360" y="36" font-size="21" fill="#1b2a41" text-anchor="middle" font-weight="700" >Quatre familles de facteurs de risque</text><line x1="360" y1="215" x2="170" y2="115" stroke="#0B68AE" stroke-width="3" stroke-dasharray="6 5"/><line x1="360" y1="215" x2="550" y2="115" stroke="#49537e" stroke-width="3" stroke-dasharray="6 5"/><line x1="360" y1="215" x2="170" y2="300" stroke="#883e4f" stroke-width="3" stroke-dasharray="6 5"/><line x1="360" y1="215" x2="550" y2="300" stroke="#C8281E" stroke-width="3" stroke-dasharray="6 5"/><rect x="30" y="70" width="280" height="90" rx="12" fill="#0B68AE" stroke="none" stroke-width="2"/><text x="170" y="102" font-size="18" fill="#fff" text-anchor="middle" font-weight="700" >Biomécanique</text><text x="170" y="126" font-size="13" fill="#fff" text-anchor="middle" font-weight="400" >répétitivité, efforts,</text><text x="170" y="143" font-size="13" fill="#fff" text-anchor="middle" font-weight="400" >postures, charges</text><rect x="410" y="70" width="280" height="90" rx="12" fill="#49537e" stroke="none" stroke-width="2"/><text x="550" y="102" font-size="18" fill="#fff" text-anchor="middle" font-weight="700" >Organisationnel</text><text x="550" y="126" font-size="13" fill="#fff" text-anchor="middle" font-weight="400" >cadence, pression horaire,</text><text x="550" y="143" font-size="13" fill="#fff" text-anchor="middle" font-weight="400" >pauses, rotation</text><rect x="30" y="255" width="280" height="90" rx="12" fill="#883e4f" stroke="none" stroke-width="2"/><text x="170" y="287" font-size="18" fill="#fff" text-anchor="middle" font-weight="700" >Psychosocial</text><text x="170" y="311" font-size="13" fill="#fff" text-anchor="middle" font-weight="400" >rythme, autonomie,</text><text x="170" y="328" font-size="13" fill="#fff" text-anchor="middle" font-weight="400" >soutien collectif</text><rect x="410" y="255" width="280" height="90" rx="12" fill="#C8281E" stroke="none" stroke-width="2"/><text x="550" y="287" font-size="18" fill="#fff" text-anchor="middle" font-weight="700" >Environnemental</text><text x="550" y="311" font-size="13" fill="#fff" text-anchor="middle" font-weight="400" >froid, sols glissants,</text><text x="550" y="328" font-size="13" fill="#fff" text-anchor="middle" font-weight="400" >éclairage, bruit, encombrement</text><circle cx="360" cy="215" r="44" fill="#fff" stroke="#1b2a41" stroke-width="3"/><text x="360" y="213" font-size="21" fill="#1b2a41" text-anchor="middle" font-weight="800" >TMS</text><text x="360" y="233" font-size="12" fill="#5b5166" text-anchor="middle" font-weight="400" >cumul</text><text x="360" y="392" font-size="13.5" fill="#5b5166" text-anchor="middle" font-weight="400" >Elles se cumulent : agir sur le seul geste ne suffit pas.</text></svg>