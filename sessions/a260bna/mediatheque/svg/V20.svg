<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Deux alimentations dans une armoire</title><desc id="desc">Exemple fictif à circuits agrégés ; aucune valeur ni implantation réelle.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S01, S04.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V20 · Deux alimentations dans une armoire</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Exemple fictif à circuits agrégés ; aucune valeur ni implantation réelle.</text><rect x="60" y="220" width="360" height="150" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="84" y="262" font-size="27" fill="#173b50">Source puissance</text><text x="84" y="303" font-size="22" fill="#173b50">Rechercher le départ réel</text><rect x="60" y="560" width="360" height="150" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="84" y="602" font-size="27" fill="#173b50">Source auxiliaire</text><text x="84" y="643" font-size="22" fill="#173b50">Indépendante dans cet exemple</text><path d="M420,295 L500,295" fill="none" stroke="#173b50" stroke-width="4" /><path d="M500,295 L630,295" fill="none" stroke="#173b50" stroke-width="4" /><path d="M720,295 L850,295" fill="none" stroke="#173b50" stroke-width="4" /><path d="M630,295 L708,242" fill="none" stroke="#173b50" stroke-width="4" /><circle cx="630" cy="295" r="7" fill="#173b50"/><circle cx="720" cy="295" r="7" fill="#f7fafb" stroke="#173b50" stroke-width="3"/><path d="M850,295 L1110,295" fill="none" stroke="#173b50" stroke-width="4" /><path d="M420,635 L500,635" fill="none" stroke="#173b50" stroke-width="4" /><path d="M500,635 L630,635" fill="none" stroke="#173b50" stroke-width="4" /><path d="M720,635 L850,635" fill="none" stroke="#173b50" stroke-width="4" /><path d="M630,635 L708,582" fill="none" stroke="#173b50" stroke-width="4" /><circle cx="630" cy="635" r="7" fill="#173b50"/><circle cx="720" cy="635" r="7" fill="#f7fafb" stroke="#173b50" stroke-width="3"/><path d="M850,635 L1110,635" fill="none" stroke="#173b50" stroke-width="4" /><rect x="1110" y="210" width="410" height="510" fill="none" stroke="#497281" stroke-width="3" stroke-dasharray="12 8"/><text x="1135" y="260" font-size="28" fill="#173b50">Même enveloppe</text><rect x="1150" y="305" width="330" height="130" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="1174" y="347" font-size="27" fill="#173b50">Puissance</text><rect x="1150" y="535" width="330" height="130" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="1174" y="577" font-size="27" fill="#173b50">Commande</text><path d="M1110,295 L1110,365" fill="none" stroke="#173b50" stroke-width="4" /><path d="M1110,365 L1150,365" fill="none" stroke="#173b50" stroke-width="4" /><path d="M1110,635 L1150,635" fill="none" stroke="#173b50" stroke-width="4" /><text x="80" y="800" font-size="23" fill="#173b50">Traits = circuits agrégés, sans polarités ni nombre de conducteurs ; ce n’est pas un unifilaire complet.</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S01, S04</text></g></svg>