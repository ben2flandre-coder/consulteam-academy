<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Qui doit quoi : le cadre du SST</title><desc id="d">Trois rôles : le citoyen porte assistance, l’employeur organise les secours, le SST agit dans le cadre de sa formation.</desc><rect width="1200" height="540" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Qui doit quoi : le cadre du SST</text><rect x="60.0" y="140" width="330" height="300" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="60.0" y="140" width="330" height="58" rx="14" fill="#102c53"/><rect x="60.0" y="180" width="330" height="18" fill="#102c53"/><text x="225.0" y="179" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Tout citoyen</text><text x="225.0" y="238" font-size="22" fill="#16273d" text-anchor="middle" font-weight="400">Porter assistance</text><text x="225.0" y="267" font-size="22" fill="#16273d" text-anchor="middle" font-weight="400">à une personne en péril,</text><text x="225.0" y="295" font-size="22" fill="#16273d" text-anchor="middle" font-weight="400">sans risque pour lui</text><text x="225.0" y="324" font-size="22" fill="#16273d" text-anchor="middle" font-weight="400">ni pour les tiers</text><text x="225.0" y="352" font-size="22" fill="#16273d" text-anchor="middle" font-weight="400">(Code pénal, art. 223-6)</text><rect x="435.0" y="140" width="330" height="300" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="435.0" y="140" width="330" height="58" rx="14" fill="#102c53"/><rect x="435.0" y="180" width="330" height="18" fill="#102c53"/><text x="600.0" y="179" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">L’employeur</text><text x="600.0" y="238" font-size="22" fill="#16273d" text-anchor="middle" font-weight="400">Organise les secours</text><text x="600.0" y="267" font-size="22" fill="#16273d" text-anchor="middle" font-weight="400">et la formation</text><text x="600.0" y="295" font-size="22" fill="#16273d" text-anchor="middle" font-weight="400">(Code du travail,</text><text x="600.0" y="324" font-size="22" fill="#16273d" text-anchor="middle" font-weight="400">art. R4224-15 et suivants)</text><rect x="810.0" y="140" width="330" height="300" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="810.0" y="140" width="330" height="58" rx="14" fill="#102c53"/><rect x="810.0" y="180" width="330" height="18" fill="#102c53"/><text x="975.0" y="179" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Le SST</text><text x="975.0" y="238" font-size="22" fill="#16273d" text-anchor="middle" font-weight="400">Agit dans le cadre</text><text x="975.0" y="267" font-size="22" fill="#16273d" text-anchor="middle" font-weight="400">de sa formation</text><text x="975.0" y="295" font-size="22" fill="#16273d" text-anchor="middle" font-weight="400">jusqu’à la prise</text><text x="975.0" y="324" font-size="22" fill="#16273d" text-anchor="middle" font-weight="400">en charge par les secours</text><text x="600" y="495" font-size="23" fill="#102c53" text-anchor="middle" font-weight="700">Le SST ne remplace ni les secours ni le médecin.</text><text x="1160" y="524" font-size="14" text-anchor="end" fill="#53657a">Consulteam · SST</text></svg>