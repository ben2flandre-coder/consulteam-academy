<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Trois appareils de détection des réseaux enterrés"><title>Trois appareils de détection des réseaux enterrés</title><defs></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}</style><rect width="1200" height="340" rx="22" fill="#f4f8fc"/><text x="600" y="40" text-anchor="middle" font-size="20" font-weight="800" fill="#0b2545">Détecter : trois outils, aucune garantie</text><rect x="50" y="68" width="340" height="236" rx="18" fill="#fff" stroke="#f7bc46" stroke-width="3"/><rect x="70" y="88" width="300" height="100" rx="12" fill="#f7bc46" opacity=".14"/><path d="M110 170 q40 -80 80 0 t80 0 t60 -30" fill="none" stroke="#f7bc46" stroke-width="6" stroke-linecap="round"/><circle cx="300" cy="132" r="26" fill="#f7bc46"/><circle cx="300" cy="132" r="10" fill="#fff"/><text x="220" y="226" text-anchor="middle" font-size="19" font-weight="800" fill="#0b2545">Détecteur de métaux</text><text x="220" y="256" text-anchor="middle" font-size="15" fill="#53677d">retrouve tampons et regards</text><rect x="430" y="68" width="340" height="236" rx="18" fill="#fff" stroke="#095ea4" stroke-width="3"/><rect x="450" y="88" width="300" height="100" rx="12" fill="#095ea4" opacity=".14"/><path d="M490 170 q40 -80 80 0 t80 0 t60 -30" fill="none" stroke="#095ea4" stroke-width="6" stroke-linecap="round"/><circle cx="680" cy="132" r="26" fill="#095ea4"/><circle cx="680" cy="132" r="10" fill="#fff"/><text x="600" y="226" text-anchor="middle" font-size="19" font-weight="800" fill="#0b2545">Localisateur électromagnétique</text><text x="600" y="256" text-anchor="middle" font-size="15" fill="#53677d">trace le parcours des conducteurs</text><rect x="810" y="68" width="340" height="236" rx="18" fill="#fff" stroke="#0f8b8d" stroke-width="3"/><rect x="830" y="88" width="300" height="100" rx="12" fill="#0f8b8d" opacity=".14"/><path d="M870 170 q40 -80 80 0 t80 0 t60 -30" fill="none" stroke="#0f8b8d" stroke-width="6" stroke-linecap="round"/><circle cx="1060" cy="132" r="26" fill="#0f8b8d"/><circle cx="1060" cy="132" r="10" fill="#fff"/><text x="980" y="226" text-anchor="middle" font-size="19" font-weight="800" fill="#0b2545">Radar à pénétration de sol</text><text x="980" y="256" text-anchor="middle" font-size="15" fill="#53677d">échos à interpréter</text></svg>