<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI','Inter',Arial,sans-serif"><title id="t">Déclaration, agrément ou dérogation ?</title><desc id="d">Arbre de décision selon les denrées d’origine animale et la remise directe.</desc><defs>
