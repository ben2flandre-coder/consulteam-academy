<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 466" width="1280" height="932" role="img" aria-labelledby="dect decd" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="640" height="466" fill="#FFFFFF"/><title id="dect">Que faire face à un début d’incendie</title><desc id="decd">Alerter d’abord. Si le feu est limité, la sortie dégagée derrière soi et l’extincteur adapté, attaquer ; sinon évacuer. Si le feu persiste, renoncer et évacuer.</desc><rect x="170" y="14" width="300" height="44" rx="10" fill="#C8281E"/><text x="320" y="42" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="17" font-weight="700" fill="#fff">Début d’incendie détecté</text><line x1="320" y1="58" x2="320.0" y2="78.0" stroke="#2C3E50" stroke-width="2.5" stroke-linecap="round"/><polygon points="320,88 314.5,78.0 325.5,78.0" fill="#2C3E50"/><rect x="130" y="88" width="380" height="44" rx="10" fill="#FBE4DF" stroke="#C8281E" stroke-width="2"/><text x="320" y="116" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="16" font-weight="700" fill="#2C3E50">1 · Alerter : alarme et secours (18 ou 112)</text><line x1="320" y1="132" x2="320.0" y2="150.0" stroke="#2C3E50" stroke-width="2.5" stroke-linecap="round"/><polygon points="320,160 314.5,150.0 325.5,150.0" fill="#2C3E50"/><rect x="110" y="160" width="420" height="92" rx="12" fill="#FFFFFF" stroke="#2C3E50" stroke-width="2"/><text x="320" y="188" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="16" font-weight="600" fill="#2C3E50">Le feu est-il limité à son point de départ ?</text><text x="320" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="16" font-weight="600" fill="#2C3E50">La sortie est-elle dégagée derrière moi ?</text><text x="320" y="236" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="16" font-weight="600" fill="#2C3E50">Mon extincteur est-il adapté et chargé ?</text><line x1="150" y1="252" x2="150.0" y2="279.0" stroke="#4CAF50" stroke-width="3" stroke-linecap="round"/><polygon points="150,290 143.9,279.0 156.1,279.0" fill="#4CAF50"/><text x="138" y="276" text-anchor="end" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="15" font-weight="700" fill="#2C3E50">OUI</text><line x1="490" y1="252" x2="490.0" y2="279.0" stroke="#F44336" stroke-width="3" stroke-linecap="round"/><polygon points="490,290 483.9,279.0 496.1,279.0" fill="#F44336"/><text x="502" y="276" text-anchor="start" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="15" font-weight="700" fill="#2C3E50">NON</text><rect x="20" y="290" width="260" height="80" rx="12" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2.5"/><text x="150" y="320" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="18" font-weight="700" fill="#2C3E50">2 · ATTAQUER</text><text x="150" y="344" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="400" fill="#4B4B4B">base des flammes, rester bas</text><rect x="360" y="290" width="260" height="80" rx="12" fill="#FDECEA" stroke="#F44336" stroke-width="2.5"/><text x="490" y="320" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="18" font-weight="700" fill="#2C3E50">2 · ÉVACUER</text><text x="490" y="344" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="400" fill="#4B4B4B">vers le point de rassemblement</text><line x1="280" y1="330" x2="347.0" y2="330.0" stroke="#F44336" stroke-width="3" stroke-linecap="round"/><polygon points="358,330 347.0,336.1 347.0,323.9" fill="#F44336"/><text x="319" y="314" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="13" font-weight="700" fill="#2C3E50">si ça</text><text x="319" y="352" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="13" font-weight="700" fill="#2C3E50">persiste</text><rect x="20" y="392" width="600" height="58" rx="10" fill="#ECEEF1"/><text x="320" y="418" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="16" font-weight="700" fill="#2C3E50">On ne se met jamais en danger.</text><text x="320" y="440" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="15" font-weight="400" fill="#4B4B4B">Un doute, une fumée dense, un extincteur vide : on évacue.</text></svg>
