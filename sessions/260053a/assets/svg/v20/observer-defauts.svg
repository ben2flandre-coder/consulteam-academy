<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Observer, décrire, mettre à l’écart</title><desc id="desc">Illustrations de signes : aucun seuil de rebut ne se déduit du dessin.</desc><rect width="1100" height="620" fill="#fff"/><style>text{font-family:Segoe UI,Arial,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect x="0" y="0" width="14" height="620" rx="0" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="40" y="56" font-size="34" fill="#102c53" font-weight="800">Observer, décrire, mettre à l’écart</text><text x="40" y="94" font-size="23" fill="#52677d" font-weight="500">Illustrations de signes : aucun seuil de rebut ne se déduit du dessin.</text><rect x="48" y="154" width="310" height="260" rx="14" fill="#eef3f8" stroke="none" stroke-width="3"/><rect x="395" y="154" width="310" height="260" rx="14" fill="#eef3f8" stroke="none" stroke-width="3"/><rect x="742" y="154" width="310" height="260" rx="14" fill="#eef3f8" stroke="none" stroke-width="3"/><path d="M85 244 L320 244" fill="none" stroke="#0b68ae" stroke-width="35"/><path d="M194 220 L175 263" fill="none" stroke="#fff" stroke-width="15"/><path d="M195 223 L211 265" fill="none" stroke="#b8322a" stroke-width="4"/><text x="79" y="350" font-size="24" fill="#102c53" font-weight="700">Atteinte de la gaine</text><path d="M435 250 L663 250" fill="none" stroke="#0b68ae" stroke-width="36"/><ellipse cx="548" cy="250" rx="48" ry="38" fill="#0b68ae"/><text x="429" y="350" font-size="24" fill="#102c53" font-weight="700">Déformation localisée</text><path d="M782 248 L1015 248" fill="none" stroke="#0b68ae" stroke-width="35"/><rect x="845" y="214" width="70" height="68" rx="14" fill="#7f8c99" stroke="none" stroke-width="3"/><text x="775" y="350" font-size="23" fill="#102c53" font-weight="700">Trace ou contamination</text><text x="81" y="469" font-size="24" fill="#102c53" font-weight="500">Ce que je vois ≠ une cause certaine. Rechercher aussi l’historique.</text><text x="81" y="511" font-size="24" fill="#102c53" font-weight="500">Doute : suspendre l’usage, isoler, signaler et faire décider selon la notice.</text><path d="M40 570 L1060 570" fill="none" stroke="#d6e0ea" stroke-width="2"/><text x="40" y="603" font-size="19" fill="#52677d" font-weight="500">Photographies réelles et procédure détaillée : document original de vérification Petzl, pages 3–4</text></svg>