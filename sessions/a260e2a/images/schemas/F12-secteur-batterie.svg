<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">Secteur coupé, batterie encore source</title><desc id="d">Le secteur est coupé mais la batterie d'alimentation de sécurité continue d'alimenter l'ECS.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#102c53}.b{font-weight:700}.s{font-size:12.5px}.m{font-size:15px}.w{fill:#fff}</style><rect width="760" height="340" rx="16" fill="#f4f7fb"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#102c53"/></marker></defs><text x="30" y="34" class="b m">Couper le secteur ne met pas l'ECS hors tension</text><rect x="30" y="90" width="170" height="80" rx="12" fill="#ddd"/><text x="115.0" y="124.0" text-anchor="middle" class="b m">Secteur</text><text x="115.0" y="144.0" text-anchor="middle" class="s">COUPÉ</text><path d="M40 100 L190 160 M190 100 L40 160" stroke="#c0392b" stroke-width="6"/><rect x="30" y="210" width="170" height="80" rx="12" fill="#f6b63d"/><text x="115.0" y="244.0" text-anchor="middle" class="b m">Batterie</text><text x="115.0" y="264.0" text-anchor="middle" class="s">AES</text><path d="M200 250 L300 160" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="300" y="110" width="170" height="100" rx="12" fill="#102c53"/><text x="385.0" y="154.0" text-anchor="middle" class="b m w">ECS</text><text x="385.0" y="174.0" text-anchor="middle" class="s w">toujours alimentée</text><path d="M470 160 L540 160" stroke="#102c53" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="540" y="96" width="190" height="128" rx="14" fill="#fff1d4" stroke="#c0392b" stroke-width="3"/><text x="635" y="132" text-anchor="middle" class="b m">Avant d'ouvrir</text><text x="635" y="158" text-anchor="middle" class="s">1 · identifier chaque source</text><text x="635" y="178" text-anchor="middle" class="s">2 · traiter secteur et batterie</text><text x="635" y="198" text-anchor="middle" class="s">3 · vérifier l'absence de tension</text></svg>