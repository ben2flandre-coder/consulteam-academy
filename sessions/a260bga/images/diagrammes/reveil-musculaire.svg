<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t d" font-family="Segoe UI,system-ui,Arial,sans-serif"><title id="t">Réveil musculaire</title><desc id="d">Cinq étapes : mobilisation articulaire, activation cardio légère, dos et tronc, membres sollicités, recentrage.</desc><rect x="1" y="1" width="718" height="403" rx="16" fill="#fff" stroke="#e4dde9" stroke-width="2"/><text x="360" y="36" font-size="21" fill="#1b2a41" text-anchor="middle" font-weight="700" >Réveil musculaire : 5 à 8 minutes</text><line x1="72" y1="120" x2="648" y2="120" stroke="#e4dde9" stroke-width="4"/><circle cx="72" cy="120" r="26" fill="#0b68ae"/><text x="72" y="129" font-size="24" fill="#fff" text-anchor="middle" font-weight="800" >1</text><text x="72" y="176" font-size="14.5" fill="#1b2a41" text-anchor="middle" font-weight="700" >Mobilisation</text><text x="72" y="194" font-size="14.5" fill="#1b2a41" text-anchor="middle" font-weight="700" >articulaire</text><text x="72" y="226" font-size="11.5" fill="#5b5166" text-anchor="middle" font-weight="400" >chevilles, genoux,</text><text x="72" y="242" font-size="11.5" fill="#5b5166" text-anchor="middle" font-weight="400" >hanches, épaules</text><rect x="36" y="282" width="72" height="28" rx="14" fill="#fff" stroke="#0b68ae" stroke-width="2"/><text x="72" y="301" font-size="12.5" fill="#0b68ae" text-anchor="middle" font-weight="700" >1 min</text><circle cx="216" cy="120" r="26" fill="#3a588a"/><text x="216" y="129" font-size="24" fill="#fff" text-anchor="middle" font-weight="800" >2</text><text x="216" y="176" font-size="14.5" fill="#1b2a41" text-anchor="middle" font-weight="700" >Activation</text><text x="216" y="194" font-size="14.5" fill="#1b2a41" text-anchor="middle" font-weight="700" >cardio légère</text><text x="216" y="226" font-size="11.5" fill="#5b5166" text-anchor="middle" font-weight="400" >marche sur place,</text><text x="216" y="242" font-size="11.5" fill="#5b5166" text-anchor="middle" font-weight="400" >talons-fesses</text><rect x="180" y="282" width="72" height="28" rx="14" fill="#fff" stroke="#3a588a" stroke-width="2"/><text x="216" y="301" font-size="12.5" fill="#3a588a" text-anchor="middle" font-weight="700" >1 à 2 min</text><circle cx="360" cy="120" r="26" fill="#6a4866"/><text x="360" y="129" font-size="24" fill="#fff" text-anchor="middle" font-weight="800" >3</text><text x="360" y="176" font-size="14.5" fill="#1b2a41" text-anchor="middle" font-weight="700" >Dos et tronc</text><text x="360" y="226" font-size="11.5" fill="#5b5166" text-anchor="middle" font-weight="400" >enroulé-déroulé,</text><text x="360" y="242" font-size="11.5" fill="#5b5166" text-anchor="middle" font-weight="400" >rotations sans charge</text><rect x="324" y="282" width="72" height="28" rx="14" fill="#fff" stroke="#6a4866" stroke-width="2"/><text x="360" y="301" font-size="12.5" fill="#6a4866" text-anchor="middle" font-weight="700" >1 à 2 min</text><circle cx="504" cy="120" r="26" fill="#993842"/><text x="504" y="129" font-size="24" fill="#fff" text-anchor="middle" font-weight="800" >4</text><text x="504" y="176" font-size="14.5" fill="#1b2a41" text-anchor="middle" font-weight="700" >Membres</text><text x="504" y="194" font-size="14.5" fill="#1b2a41" text-anchor="middle" font-weight="700" >sollicités</text><text x="504" y="226" font-size="11.5" fill="#5b5166" text-anchor="middle" font-weight="400" >épaules, poignets,</text><text x="504" y="242" font-size="11.5" fill="#5b5166" text-anchor="middle" font-weight="400" >jambes</text><rect x="468" y="282" width="72" height="28" rx="14" fill="#fff" stroke="#993842" stroke-width="2"/><text x="504" y="301" font-size="12.5" fill="#993842" text-anchor="middle" font-weight="700" >1 à 2 min</text><circle cx="648" cy="120" r="26" fill="#c8281e"/><text x="648" y="129" font-size="24" fill="#fff" text-anchor="middle" font-weight="800" >5</text><text x="648" y="176" font-size="14.5" fill="#1b2a41" text-anchor="middle" font-weight="700" >Recentrage</text><text x="648" y="226" font-size="11.5" fill="#5b5166" text-anchor="middle" font-weight="400" >respirations,</text><text x="648" y="242" font-size="11.5" fill="#5b5166" text-anchor="middle" font-weight="400" >prise de poste</text><rect x="612" y="282" width="72" height="28" rx="14" fill="#fff" stroke="#c8281e" stroke-width="2"/><text x="648" y="301" font-size="12.5" fill="#c8281e" text-anchor="middle" font-weight="700" >30 s</text><text x="360" y="356" font-size="13" fill="#5b5166" text-anchor="middle" font-weight="400" >Sans douleur ni à-coup. Ne remplace pas l’aménagement du poste.</text></svg>