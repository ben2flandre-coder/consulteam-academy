<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc"><title id="title">VAT : vérifier, puis pouvoir conclure</title><desc id="desc">Utiliser un dispositif prévu pour la VAT, adapté à l’installation et conformément à sa notice.. AVANT CONTRÔLER Vérifier le fonctionnement du dispositif selon la notice. Si échec : ne pas commencer. SUR LE CIRCUIT VÉRIFIER Vérifier l’absence de tension aux points prescrits. Un voyant éteint ne suffit pas. APRÈS RECONTRÔLER Vérifier le fonctionnement du dispositif selon la notice. Si échec : résultat non concluant.. Tension détectée, point inaccessible ou contrôle en échec : arrêter et demander le relais.</desc><rect width="1300" height="760" fill="white"/><rect width="1300" height="16" fill="#0b2545"/><g font-family="Arial, sans-serif" fill="#172941"><text x="60" y="65" font-size="17" letter-spacing="3" fill="#53677d">CONSULTEAM ACADEMY · RECYCLAGE</text><text x="60" y="115" font-size="39" font-weight="800">VAT : vérifier, puis pouvoir conclure</text><text x="60" y="156" font-size="21" fill="#53677d">Utiliser un dispositif prévu pour la VAT, adapté à l’installation et conformément à sa notice.</text><rect x="60" y="190" width="365" height="385" rx="20" fill="#f1f6fb" stroke="#ceddea"/><circle cx="102" cy="232" r="20" fill="#0b2545"/><text x="102" y="239" text-anchor="middle" fill="white" font-size="18" font-weight="700">1</text><text x="90" y="300" font-size="22" font-weight="700">AVANT</text><text x="90" y="354" font-size="32" font-weight="800" fill="#095ea4">CONTRÔLER</text><text x="90" y="405" font-size="19">Vérifier le fonctionnement</text><text x="90" y="441" font-size="19">du dispositif selon la notice.</text><text x="90" y="477" font-size="19">Si échec : ne pas commencer.</text><rect x="455" y="190" width="365" height="385" rx="20" fill="#f1f6fb" stroke="#ceddea"/><circle cx="497" cy="232" r="20" fill="#0b2545"/><text x="497" y="239" text-anchor="middle" fill="white" font-size="18" font-weight="700">2</text><text x="485" y="300" font-size="22" font-weight="700">SUR LE CIRCUIT</text><text x="485" y="354" font-size="32" font-weight="800" fill="#095ea4">VÉRIFIER</text><text x="485" y="405" font-size="19">Vérifier l’absence de tension</text><text x="485" y="441" font-size="19">aux points prescrits.</text><text x="485" y="477" font-size="19">Un voyant éteint ne suffit pas.</text><rect x="850" y="190" width="365" height="385" rx="20" fill="#f1f6fb" stroke="#ceddea"/><circle cx="892" cy="232" r="20" fill="#0b2545"/><text x="892" y="239" text-anchor="middle" fill="white" font-size="18" font-weight="700">3</text><text x="880" y="300" font-size="22" font-weight="700">APRÈS</text><text x="880" y="354" font-size="32" font-weight="800" fill="#095ea4">RECONTRÔLER</text><text x="880" y="405" font-size="19">Vérifier le fonctionnement</text><text x="880" y="441" font-size="19">du dispositif selon la notice.</text><text x="880" y="477" font-size="19">Si échec : résultat non concluant.</text><rect x="60" y="607" width="1155" height="70" rx="12" fill="#fff2d4"/><text x="85" y="650" font-size="20" font-weight="700">Tension détectée, point inaccessible ou contrôle en échec : arrêter et demander le relais.</text><text x="60" y="721" font-size="15" fill="#53677d">RMBD · Benoît Deflandre · 10/10/2026 · Source : FAQ INRS / NF C 18-510 applicable</text></g></svg>