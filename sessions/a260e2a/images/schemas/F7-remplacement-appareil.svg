<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t d"><title id="t">Remplacer un appareil dans un tableau : les étapes</title><desc id="d">Huit étapes : identifier, vérifier l&#x27;habilitation, consigner, vérifier l&#x27;absence de tension, déposer, poser l&#x27;identique, raccorder et repérer, déconsigner et essayer.</desc><style>.lbl,.num{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}</style><rect width="960" height="660" fill="#ffffff"/><text class="lbl" x="24" y="34" font-size="20" font-weight="700" text-anchor="start" fill="#102c53">Remplacer un appareil dans un tableau : les étapes</text><text class="lbl" x="24" y="56" font-size="13" font-weight="400" text-anchor="start" fill="#53657a">Déroulé type, à adapter à l&#x27;installation et aux consignes du chargé de travaux</text><rect x="40" y="76" width="880" height="56" rx="8" fill="#f4f7fb" stroke="#102c53" stroke-width="1.5" /><circle cx="70" cy="104.0" r="14" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="109.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">1</text><text class="lbl" x="100" y="99" font-size="15" font-weight="700" text-anchor="start" fill="#102c53">Identifier le défaut et l&#x27;appareil</text><text class="lbl" x="100" y="119" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">Relever calibre, courbe, pouvoir de coupure, type de différentiel : l&#x27;appareil posé doit être équivalent (S7, S8)</text><line x1="70" y1="132" x2="70" y2="146" stroke="#53657a" stroke-width="2" /><rect x="40" y="146" width="880" height="56" rx="8" fill="#fff" stroke="#102c53" stroke-width="1.5" /><circle cx="70" cy="174.0" r="14" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="179.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">2</text><text class="lbl" x="100" y="169" font-size="15" font-weight="700" text-anchor="start" fill="#102c53">Vérifier le périmètre de l&#x27;habilitation</text><text class="lbl" x="100" y="189" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">L&#x27;opération et la situation correspondent-elles au titre détenu ? Sinon, s&#x27;arrêter et demander (S1)</text><line x1="70" y1="202" x2="70" y2="216" stroke="#53657a" stroke-width="2" /><rect x="40" y="216" width="880" height="56" rx="8" fill="#f4f7fb" stroke="#102c53" stroke-width="1.5" /><circle cx="70" cy="244.0" r="14" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="249.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">3</text><text class="lbl" x="100" y="239" font-size="15" font-weight="700" text-anchor="start" fill="#102c53">Consigner</text><text class="lbl" x="100" y="259" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">Séparer, condamner, identifier : l&#x27;ordre de la consignation enseignée par Consul Team (S22)</text><line x1="70" y1="272" x2="70" y2="286" stroke="#53657a" stroke-width="2" /><rect x="40" y="286" width="880" height="56" rx="8" fill="#fff" stroke="#102c53" stroke-width="1.5" /><circle cx="70" cy="314.0" r="14" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="319.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">4</text><text class="lbl" x="100" y="309" font-size="15" font-weight="700" text-anchor="start" fill="#102c53">Vérifier l&#x27;absence de tension</text><text class="lbl" x="100" y="329" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">Avec un VAT, neutre compris, contrôlé avant et après sur une source connue (S16)</text><line x1="70" y1="342" x2="70" y2="356" stroke="#53657a" stroke-width="2" /><rect x="40" y="356" width="880" height="56" rx="8" fill="#f4f7fb" stroke="#102c53" stroke-width="1.5" /><circle cx="70" cy="384.0" r="14" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="389.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">5</text><text class="lbl" x="100" y="379" font-size="15" font-weight="700" text-anchor="start" fill="#102c53">Déposer l&#x27;appareil</text><text class="lbl" x="100" y="399" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">Repérer les fils avant de les retirer, puis levier sur la griffe pour sortir l&#x27;appareil du rail (S8)</text><line x1="70" y1="412" x2="70" y2="426" stroke="#53657a" stroke-width="2" /><rect x="40" y="426" width="880" height="56" rx="8" fill="#fff" stroke="#102c53" stroke-width="1.5" /><circle cx="70" cy="454.0" r="14" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="459.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">6</text><text class="lbl" x="100" y="449" font-size="15" font-weight="700" text-anchor="start" fill="#102c53">Poser l&#x27;appareil équivalent</text><text class="lbl" x="100" y="469" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">Même calibre, même courbe, pouvoir de coupure au moins égal : clipser sur le rail, vérifier le peigne (S8)</text><line x1="70" y1="482" x2="70" y2="496" stroke="#53657a" stroke-width="2" /><rect x="40" y="496" width="880" height="56" rx="8" fill="#f4f7fb" stroke="#102c53" stroke-width="1.5" /><circle cx="70" cy="524.0" r="14" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="529.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">7</text><text class="lbl" x="100" y="519" font-size="15" font-weight="700" text-anchor="start" fill="#102c53">Raccorder et repérer</text><text class="lbl" x="100" y="539" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">Serrage soigné, conducteurs aux bonnes bornes, étiquette à jour (S15)</text><line x1="70" y1="552" x2="70" y2="566" stroke="#53657a" stroke-width="2" /><rect x="40" y="566" width="880" height="56" rx="8" fill="#fff" stroke="#102c53" stroke-width="1.5" /><circle cx="70" cy="594.0" r="14" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="599.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">8</text><text class="lbl" x="100" y="589" font-size="15" font-weight="700" text-anchor="start" fill="#102c53">Déconsigner et essayer</text><text class="lbl" x="100" y="609" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">Remettre sous tension dans l&#x27;ordre prévu, essai de l&#x27;appareil, bouton T pour un différentiel (S3, S16)</text><text class="lbl" x="24" y="644" font-size="12" font-weight="400" text-anchor="start" fill="#53657a">Sources : S1, S3, S7, S8, S15, S16, S22. Déroulé pédagogique : le formateur le valide pour le contexte ADI.</text></svg>