5" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">6</text><line x1="130" y1="203" x2="70" y2="203" stroke="#53657a" stroke-width="1.5" /><circle cx="130" cy="203" r="2.5" fill="#53657a" stroke="#53657a" stroke-width="1"/><circle cx="70" cy="203" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="208" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">7</text><line x1="100" y1="122" x2="70" y2="160" stroke="#53657a" stroke-width="1.5" /><circle cx="100" cy="122" r="2.5" fill="#53657a" stroke="#53657a" stroke-width="1"/><circle cx="70" cy="160" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="165" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">8</text><line x1="560" y1="360" x2="560" y2="400" stroke="#53657a" stroke-width="1.5" /><circle cx="560" cy="360" r="2.5" fill="#53657a" stroke="#53657a" stroke-width="1"/><circle cx="560" cy="400" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="560" y="405" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">9</text><text class="lbl" x="670" y="90" font-size="16" font-weight="700" text-anchor="start" fill="#102c53">Légende</text><circle cx="682" cy="109" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="114" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">1</text><text class="lbl" x="702" y="114" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Bobine (bornes A1 et A2) : crée</text><text class="lbl" x="702" y="132" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">le champ magnétique</text><circle cx="682" cy="155" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="160" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">2</text><text class="lbl" x="702" y="160" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Circuit magnétique fixe,</text><text class="lbl" x="702" y="178" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">feuilleté</text><circle cx="682" cy="201" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="206" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">3</text><text class="lbl" x="702" y="206" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Armature (partie mobile du</text><text class="lbl" x="702" y="224" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">circuit magnétique)</text><circle cx="682" cy="247" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="252" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">4</text><text class="lbl" x="702" y="252" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Entrefer : se ferme quand la</text><text class="lbl" x="702" y="270" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">bobine est alimentée</text><circle cx="682" cy="293" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="298" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">5</text><text class="lbl" x="702" y="298" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Ressort de rappel : rouvre les</text><text class="lbl" x="702" y="316" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">contacts à la désexcitation</text><circle cx="682" cy="339" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="344" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">6</text><text class="lbl" x="702" y="344" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Spire de déphasage : limite les</text><text class="lbl" x="702" y="362" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">vibrations en alternatif</text><circle cx="682" cy="385" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="390" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">7</text><text class="lbl" x="702" y="390" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Pont de contacts mobiles (circuit</text><text class="lbl" x="702" y="408" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">de puissance)</text><circle cx="682" cy="431" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="436" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">8</text><text class="lbl" x="702" y="436" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Contacts fixes et bornes de</text><text class="lbl" x="702" y="454" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">puissance</text><circle cx="682" cy="477" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="482" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">9</text><text class="lbl" x="702" y="482" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Bloc de contacts auxiliaires</text><text class="lbl" x="702" y="500" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">(commande, signalisation)</text><text class="lbl" x="40" y="592" font-size="12" font-weight="700" text-anchor="start" fill="#102c53">Bobine alimentée : l&#x27;armature est attirée, les contacts se ferment. Bobine coupée : le ressort rouvre.</text><text class="lbl" x="24" y="624" font-size="12" font-weight="400" text-anchor="start" fill="#53657a">Constitution et fonctionnement : S5. Contacts principaux et auxiliaires : S17. Spire de déphasage : S18 (source faible, à confirmer).</text></svg>