<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Traçabilité : un pas en arrière, un pas en avant</title><desc id="d">Quatre étapes de la chaîne.</desc><rect width="1200" height="675" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Traçabilité : un pas en arrière, un pas en avant</text><rect x="40" y="200" width="250" height="110" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="165.0" y="264.52" font-size="28" fill="#102c53" text-anchor="middle" font-weight="700">Fournisseur</text><text x="165" y="345" font-size="20" fill="#5a6b80" text-anchor="middle" font-weight="400">lot, DLC</text><line x1="290" y1="255" x2="324.0" y2="255.0" stroke="#0b68ae" stroke-width="5"/><polygon points="330,255 315.6,262.0 315.6,248.0" fill="#0b68ae"/><rect x="330" y="200" width="250" height="110" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="455.0" y="264.52" font-size="28" fill="#102c53" text-anchor="middle" font-weight="700">Réception</text><text x="455" y="345" font-size="20" fill="#5a6b80" text-anchor="middle" font-weight="400">enregistrer, conserver le bon</text><line x1="580" y1="255" x2="614.0" y2="255.0" stroke="#0b68ae" stroke-width="5"/><polygon points="620,255 605.6,262.0 605.6,248.0" fill="#0b68ae"/><rect x="620" y="200" width="250" height="110" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="745.0" y="264.52" font-size="28" fill="#102c53" text-anchor="middle" font-weight="700">Production</text><text x="745" y="345" font-size="20" fill="#5a6b80" text-anchor="middle" font-weight="400">noter le lot utilisé</text><line x1="870" y1="255" x2="904.0" y2="255.0" stroke="#0b68ae" stroke-width="5"/><polygon points="910,255 895.6,262.0 895.6,248.0" fill="#0b68ae"/><rect x="910" y="200" width="250" height="110" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="1035.0" y="264.52" font-size="28" fill="#102c53" text-anchor="middle" font-weight="700">Service</text><text x="1035" y="345" font-size="20" fill="#5a6b80" text-anchor="middle" font-weight="400">plat, date</text><text x="600" y="150" font-size="26" fill="#0b68ae" text-anchor="middle" font-weight="700">Un pas en arrière : de qui je reçois</text><rect x="60" y="420" width="1080" height="170" rx="14" fill="#fff7e0" stroke="#f6b63d" stroke-width="2.5"/><text x="80" y="465.0" font-size="24" fill="#102c53" text-anchor="start" font-weight="700">Un pas en avant : à qui je livre ou je sers.</text><text x="80" y="495.0" font-size="24" fill="#102c53" text-anchor="start" font-weight="700">Objectif : retirer vite et précisément un lot en cas d’alerte (rappel).</text><text x="80" y="525.0" font-size="24" fill="#102c53" text-anchor="start" font-weight="700">Conserver étiquettes, bons de livraison et fiches de fabrication.</text><text x="40" y="653" font-size="18" fill="#5a6b80" text-anchor="start" font-weight="400">Règlement (CE) n° 178/2002, article 18.</text></svg>