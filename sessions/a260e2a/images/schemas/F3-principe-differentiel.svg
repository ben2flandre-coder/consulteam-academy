00" text-anchor="middle" fill="#fff">2</text><line x1="318" y1="345" x2="270" y2="395" stroke="#53657a" stroke-width="1.5" /><circle cx="318" cy="345" r="2.5" fill="#53657a" stroke="#53657a" stroke-width="1"/><circle cx="270" cy="395" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="270" y="400" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">3</text><line x1="470" y1="176" x2="520" y2="150" stroke="#53657a" stroke-width="1.5" /><circle cx="470" cy="176" r="2.5" fill="#53657a" stroke="#53657a" stroke-width="1"/><circle cx="520" cy="150" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="520" y="155" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">4</text><line x1="296" y1="225" x2="296" y2="60" stroke="#53657a" stroke-width="1.5" /><circle cx="296" cy="225" r="2.5" fill="#53657a" stroke="#53657a" stroke-width="1"/><circle cx="296" cy="60" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="296" y="65" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">5</text><line x1="130" y1="300" x2="100" y2="345" stroke="#53657a" stroke-width="1.5" /><circle cx="130" cy="300" r="2.5" fill="#53657a" stroke="#53657a" stroke-width="1"/><circle cx="100" cy="345" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="100" y="350" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">6</text><line x1="255" y1="414" x2="255" y2="375" stroke="#53657a" stroke-width="1.5" /><circle cx="255" cy="414" r="2.5" fill="#53657a" stroke="#53657a" stroke-width="1"/><circle cx="255" cy="375" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="255" y="380" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">7</text><line x1="360" y1="444" x2="360" y2="490" stroke="#53657a" stroke-width="1.5" /><circle cx="360" cy="444" r="2.5" fill="#53657a" stroke="#53657a" stroke-width="1"/><circle cx="360" cy="490" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="360" y="495" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">8</text><line x1="560" y1="420" x2="610" y2="420" stroke="#53657a" stroke-width="1.5" /><circle cx="560" cy="420" r="2.5" fill="#53657a" stroke="#53657a" stroke-width="1"/><circle cx="610" cy="420" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="610" y="425" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">9</text><text class="lbl" x="670" y="90" font-size="16" font-weight="700" text-anchor="start" fill="#102c53">Légende</text><circle cx="682" cy="109" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="114" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">1</text><text class="lbl" x="702" y="114" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Conducteurs aller (phase) et</text><text class="lbl" x="702" y="132" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">retour (neutre) vers les circuits</text><circle cx="682" cy="155" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="160" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">2</text><text class="lbl" x="702" y="160" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Tore magnétique traversé par tous</text><text class="lbl" x="702" y="178" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">les conducteurs actifs</text><circle cx="682" cy="201" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="206" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">3</text><text class="lbl" x="702" y="206" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Enroulement détecteur autour du</text><text class="lbl" x="702" y="224" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">tore</text><circle cx="682" cy="247" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="252" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">4</text><text class="lbl" x="702" y="252" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Relais sensible : réagit à</text><text class="lbl" x="702" y="270" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">l&#x27;écart de courant</text><circle cx="682" cy="293" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="298" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">5</text><text class="lbl" x="702" y="298" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Mécanisme de déclenchement</text><circle cx="682" cy="323" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="328" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">6</text><text class="lbl" x="702" y="328" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Contacts de coupure (tous les</text><text class="lbl" x="702" y="346" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">pôles, liés mécaniquement)</text><circle cx="682" cy="369" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="374" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">7</text><text class="lbl" x="702" y="374" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Bouton test T</text><circle cx="682" cy="399" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="404" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">8</text><text class="lbl" x="702" y="404" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Résistance du circuit d&#x27;essai</text><circle cx="682" cy="429" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="434" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">9</text><text class="lbl" x="702" y="434" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Fuite vers la terre (défaut</text><text class="lbl" x="702" y="452" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">d&#x27;isolement)</text><text class="lbl" x="40" y="548" font-size="13" font-weight="700" text-anchor="start" fill="#16794a">Courant aller = courant retour : aucun signal dans l&#x27;enroulement.</text><text class="lbl" x="40" y="568" font-size="13" font-weight="700" text-anchor="start" fill="#b3261e">Fuite à la terre : écart ≥ sensibilité (30 mA en logement, S3) → déclenchement.</text><text class="lbl" x="24" y="584" font-size="12" font-weight="400" text-anchor="start" fill="#53657a">Comparaison des courants : S3. Tore et circuit d&#x27;essai hors du tore : S4 (extrait). Disposition simplifiée.</text></svg>