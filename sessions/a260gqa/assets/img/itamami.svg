<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">ITAMaMi : observer une situation de travail</title><desc id="d">Cinq axes : individu, tâche, activité, matériel, milieu.</desc><rect width="1200" height="560" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">ITAMaMi : observer une situation de travail</text><rect x="40.0" y="160" width="200" height="220" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="40.0" y="160" width="200" height="58" rx="14" fill="#102c53"/><rect x="40.0" y="200" width="200" height="18" fill="#102c53"/><text x="140.0" y="199" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Individu</text><text x="140.0" y="258" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">Qui ?</text><text x="140.0" y="284" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">compétences,</text><text x="140.0" y="310" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">état, âge</text><rect x="270.0" y="160" width="200" height="220" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="270.0" y="160" width="200" height="58" rx="14" fill="#102c53"/><rect x="270.0" y="200" width="200" height="18" fill="#102c53"/><text x="370.0" y="199" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Tâche</text><text x="370.0" y="258" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">Ce qui est</text><text x="370.0" y="284" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">demandé</text><rect x="500.0" y="160" width="200" height="220" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="500.0" y="160" width="200" height="58" rx="14" fill="#102c53"/><rect x="500.0" y="200" width="200" height="18" fill="#102c53"/><text x="600.0" y="199" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Activité</text><text x="600.0" y="258" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">Ce qui est</text><text x="600.0" y="284" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">réellement fait</text><rect x="730.0" y="160" width="200" height="220" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="730.0" y="160" width="200" height="58" rx="14" fill="#102c53"/><rect x="730.0" y="200" width="200" height="18" fill="#102c53"/><text x="830.0" y="199" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Matériel</text><text x="830.0" y="258" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">Outils, machines,</text><text x="830.0" y="284" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">équipements</text><rect x="960.0" y="160" width="200" height="220" rx="14" fill="#e8f1fb" stroke="#102c53" stroke-width="2"/><rect x="960.0" y="160" width="200" height="58" rx="14" fill="#102c53"/><rect x="960.0" y="200" width="200" height="18" fill="#102c53"/><text x="1060.0" y="199" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="700">Milieu</text><text x="1060.0" y="258" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">Lieu, ambiance,</text><text x="1060.0" y="284" font-size="20" fill="#16273d" text-anchor="middle" font-weight="400">organisation</text><rect x="40.0" y="425" width="1120" height="70" rx="12" fill="#fff6dc" stroke="#f6b63d" stroke-width="2"/><text x="600" y="468" font-size="24" fill="#102c53" text-anchor="middle" font-weight="700">ITAMaMi décrit la situation de travail sans rien oublier.</text><text x="1160" y="544" font-size="14" text-anchor="end" fill="#53657a">Consulteam · SST</text></svg>