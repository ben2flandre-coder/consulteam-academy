<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Variateur : anticiper l’énergie résiduelle</title><desc id="desc">Aucun temps de décharge universel n’est fourni.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S01, S04.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V07 · Variateur : anticiper l’énergie résiduelle</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Aucun temps de décharge universel n’est fourni.</text><rect x="60" y="330" width="350" height="230" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="84" y="372" font-size="27" fill="#173b50">Réseau</text><text x="84" y="413" font-size="22" fill="#173b50">Séparation à prévoir</text><rect x="560" y="240" width="500" height="420" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="584" y="282" font-size="27" fill="#173b50">Variateur</text><text x="584" y="323" font-size="22" fill="#173b50">Stockage capacitif possible</text><text x="584" y="355" font-size="22" fill="#173b50">Notice exacte indispensable</text><text x="584" y="387" font-size="22" fill="#173b50">Temps et points de contrôle</text><text x="584" y="419" font-size="22" fill="#173b50">à déterminer sur le matériel</text><rect x="1200" y="330" width="340" height="230" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="1224" y="372" font-size="27" fill="#173b50">Moteur</text><text x="1224" y="413" font-size="22" fill="#173b50">Retour mécanique</text><text x="1224" y="445" font-size="22" fill="#173b50">à analyser</text><path d="M410,445 L560,445" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><path d="M1060,445 L1200,445" fill="none" stroke="#0b6672" stroke-width="4" marker-end="url(#a)"/><text x="100" y="760" font-size="27" fill="#173b50">Voyant éteint et délai écoulé ne prouvent pas, à eux seuls, l’absence de tension.</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S01, S04</text></g></svg>