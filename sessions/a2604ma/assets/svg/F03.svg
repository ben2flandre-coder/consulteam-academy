<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 524" role="img" aria-labelledby="t d" font-family="Segoe UI,Arial,sans-serif"><title id="t">BS : les six temps d’une intervention</title><desc id="d">Six étapes de l’intervention BS.</desc><rect width="1000" height="524" fill="#fff"/><text x="20" y="44" font-size="30" font-weight="700" fill="#102c53">BS : les six temps d’une intervention</text><rect x="20" y="54" width="90" height="5" fill="#f6b63d"/><rect x="20" y="80" width="301" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="20" y="80" width="301" height="8" rx="4" fill="#0b68ae"/><circle cx="50" cy="124" r="22" fill="#102c53"/><text x="50" y="132" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">1</text><text x="82" y="120" font-size="23" font-weight="700" fill="#102c53">Analyser</text><text x="38" y="160" font-size="17.5" fill="#16273d">Mon titre couvre-t-il cette</text><text x="38" y="182" font-size="17.5" fill="#16273d">opération ?</text><path d="M325 165 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="#102c53" stroke-width="3"/><rect x="349" y="80" width="301" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="349" y="80" width="301" height="8" rx="4" fill="#0b68ae"/><circle cx="379" cy="124" r="22" fill="#102c53"/><text x="379" y="132" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">2</text><text x="411" y="120" font-size="23" font-weight="700" fill="#102c53">Séparer</text><text x="367" y="160" font-size="17.5" fill="#16273d">Séparer le circuit de ses</text><text x="367" y="182" font-size="17.5" fill="#16273d">sources.</text><path d="M655 165 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="#102c53" stroke-width="3"/><rect x="679" y="80" width="301" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="679" y="80" width="301" height="8" rx="4" fill="#0b68ae"/><circle cx="709" cy="124" r="22" fill="#102c53"/><text x="709" y="132" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">3</text><text x="741" y="120" font-size="23" font-weight="700" fill="#102c53">Condamner</text><text x="697" y="160" font-size="17.5" fill="#16273d">Empêcher toute remise sous</text><text x="697" y="182" font-size="17.5" fill="#16273d">tension.</text><rect x="20" y="284" width="301" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="20" y="284" width="301" height="8" rx="4" fill="#0b68ae"/><circle cx="50" cy="328" r="22" fill="#102c53"/><text x="50" y="336" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">4</text><text x="82" y="324" font-size="23" font-weight="700" fill="#102c53">Vérifier</text><text x="38" y="364" font-size="17.5" fill="#16273d">Vérifier l’absence de</text><text x="38" y="386" font-size="17.5" fill="#16273d">tension (VAT).</text><path d="M325 369 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="#102c53" stroke-width="3"/><rect x="349" y="284" width="301" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="349" y="284" width="301" height="8" rx="4" fill="#0b68ae"/><circle cx="379" cy="328" r="22" fill="#102c53"/><text x="379" y="336" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">5</text><text x="411" y="324" font-size="23" font-weight="700" fill="#102c53">Remplacer</text><text x="367" y="364" font-size="17.5" fill="#16273d">Remplacer ou raccorder à</text><text x="367" y="386" font-size="17.5" fill="#16273d">l’identique.</text><path d="M655 369 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="#102c53" stroke-width="3"/><rect x="679" y="284" width="301" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="679" y="284" width="301" height="8" rx="4" fill="#0b68ae"/><circle cx="709" cy="328" r="22" fill="#102c53"/><text x="709" y="336" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">6</text><text x="741" y="324" font-size="23" font-weight="700" fill="#102c53">Terminer</text><text x="697" y="364" font-size="17.5" fill="#16273d">Retirer ma condamnation,</text><text x="697" y="386" font-size="17.5" fill="#16273d">remettre sous tension selon</text><text x="697" y="408" font-size="17.5" fill="#16273d">la procédure.</text><text x="20" y="508" font-size="16" fill="#53657a">Hors liste ou en cas de doute : on s’arrête et on demande.</text></svg>