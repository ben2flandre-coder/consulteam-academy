<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t d" font-family="Segoe UI,system-ui,Arial,sans-serif"><title id="t">Feu d’origine électrique</title><desc id="d">Quatre étapes : alerter, couper, choisir l’appareil, renoncer ; ce qu’il ne faut pas faire ; cas des batteries lithium.</desc><rect x="1" y="1" width="718" height="403" rx="16" fill="#fff" stroke="#e4dde9" stroke-width="2"/><text x="360" y="34" font-size="21" fill="#1b2a41" text-anchor="middle" font-weight="700" >Départ de feu d’origine électrique</text><rect x="30" y="80" width="150" height="170" rx="12" fill="#0B68AE" stroke="none" stroke-width="2"/><text x="105" y="118" font-size="30" fill="#fff" text-anchor="middle" font-weight="800" >1</text><text x="105" y="150" font-size="18" fill="#fff" text-anchor="middle" font-weight="700" >Alerter</text><text x="105" y="176" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >alarme</text><text x="105" y="193" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >18 ou 112</text><line x1="182" y1="165" x2="196.0" y2="165.0" stroke="#5b5166" stroke-width="3" stroke-linecap="round"/><polygon points="200,165 192.7964231811786,168.47972427288985 192.7964231811786,161.52027572711015" fill="#5b5166"/><rect x="202" y="80" width="150" height="170" rx="12" fill="#e8912d" stroke="none" stroke-width="2"/><text x="277" y="118" font-size="30" fill="#fff" text-anchor="middle" font-weight="800" >2</text><text x="277" y="150" font-size="18" fill="#fff" text-anchor="middle" font-weight="700" >Couper</text><text x="277" y="176" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >l’alimentation</text><text x="277" y="193" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >si accessible sans risque</text><line x1="354" y1="165" x2="368.0" y2="165.0" stroke="#5b5166" stroke-width="3" stroke-linecap="round"/><polygon points="372,165 364.79642318117857,168.47972427288985 364.79642318117857,161.52027572711015" fill="#5b5166"/><rect x="374" y="80" width="150" height="170" rx="12" fill="#8f3b49" stroke="none" stroke-width="2"/><text x="449" y="118" font-size="30" fill="#fff" text-anchor="middle" font-weight="800" >3</text><text x="449" y="150" font-size="18" fill="#fff" text-anchor="middle" font-weight="700" >Choisir</text><text x="449" y="176" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >appareil adapté</text><text x="449" y="193" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >marqué &lt; 1 000 V</text><text x="449" y="210" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >1 m mini</text><line x1="526" y1="165" x2="540.0" y2="165.0" stroke="#5b5166" stroke-width="3" stroke-linecap="round"/><polygon points="544,165 536.7964231811786,168.47972427288985 536.7964231811786,161.52027572711015" fill="#5b5166"/><rect x="546" y="80" width="150" height="170" rx="12" fill="#C8281E" stroke="none" stroke-width="2"/><text x="621" y="118" font-size="30" fill="#fff" text-anchor="middle" font-weight="800" >4</text><text x="621" y="150" font-size="18" fill="#fff" text-anchor="middle" font-weight="700" >Renoncer</text><text x="621" y="176" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >si doute : évacuer et alerter</text><rect x="30" y="274" width="330" height="92" rx="12" fill="#fdf3f2" stroke="#d33a2c" stroke-width="2"/><text x="195" y="298" font-size="14" fill="#d33a2c" text-anchor="middle" font-weight="800" >À ne pas faire</text><text x="195" y="318" font-size="11.5" fill="#1b2a41" text-anchor="middle" font-weight="400" >jet d’eau plein sur une installation sous tension</text><text x="195" y="333" font-size="11.5" fill="#1b2a41" text-anchor="middle" font-weight="400" >toucher câbles ou victime avant la coupure</text><text x="195" y="348" font-size="11.5" fill="#1b2a41" text-anchor="middle" font-weight="400" >rétablir le courant sans contrôle</text><rect x="380" y="274" width="310" height="92" rx="12" fill="#faf6fb" stroke="#e4dde9" stroke-width="2"/><text x="535" y="298" font-size="14" fill="#1b2a41" text-anchor="middle" font-weight="800" >Batteries lithium volumineuses</text><text x="535" y="318" font-size="11.5" fill="#1b2a41" text-anchor="middle" font-weight="400" >extincteurs portatifs déconseillés (INRS) :</text><text x="535" y="334" font-size="11.5" fill="#1b2a41" text-anchor="middle" font-weight="400" >évacuer, alerter, ne pas tenter d’éteindre</text></svg>