<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Voisinage : supprimer l’exposition d’abord</title><desc id="desc">Représentation sans échelle — aucune distance déduite de l’image.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S01.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V09 · Voisinage : supprimer l’exposition d’abord</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Représentation sans échelle — aucune distance déduite de l’image.</text><rect x="80" y="240" width="440" height="430" rx="16" fill="#ffe8de" stroke="#497281" stroke-width="2"/><text x="104" y="282" font-size="27" fill="#173b50">Partie voisine</text><text x="104" y="323" font-size="22" fill="#173b50">Pièces nues sous tension</text><text x="104" y="355" font-size="22" fill="#173b50">Présence à rechercher</text><rect x="665" y="230" width="65" height="470" fill="#0b6672"/><text x="605" y="760" font-size="24" fill="#173b50">Protection à définir</text><rect x="890" y="240" width="630" height="430" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="914" y="282" font-size="27" fill="#173b50">Zone de travail</text><text x="914" y="323" font-size="22" fill="#173b50">Supprimer le voisinage si possible</text><text x="914" y="355" font-size="22" fill="#173b50">Sinon protections adaptées</text><text x="914" y="387" font-size="22" fill="#173b50">Accès et surveillance organisés</text><text x="914" y="419" font-size="22" fill="#173b50">Corps, outils, objets pris en compte</text><path d="M520,450 L645,450" fill="none" stroke="#0b6672" stroke-width="4" stroke-dasharray="10 8" /><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S01</text></g></svg>