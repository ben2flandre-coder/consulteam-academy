ion</text><text x="461" y="441.5" font-size="17" font-weight="400" fill="#374151" text-anchor="middle" >par courrier</text><rect x="356" y="520" width="210" height="32" rx="16" fill="#eef3f9"/><text x="461" y="542.0" font-size="15" font-weight="700" fill="#0b68ae" text-anchor="middle" >Niveau 2 sur 4</text><rect x="616" y="140" width="266" height="430" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/><rect x="616" y="140" width="266" height="170" rx="22" fill="url(#gO)"/><rect x="616" y="270" width="266" height="40" fill="url(#gO)"/><circle cx="749" cy="222" r="58" fill="#fff"/><circle cx="728.7" cy="210.4" r="5.22" fill="#d9731a"/><circle cx="769.3" cy="210.4" r="5.22" fill="#d9731a"/><path d="M725.8 244.04 L772.2 244.04" fill="none" stroke="#d9731a" stroke-width="5.800000000000001" stroke-linecap="round"/><text x="749" y="352.0" font-size="22" font-weight="700" fill="#102c53" text-anchor="middle" >À améliorer</text><text x="749" y="398.0" font-size="17" font-weight="400" fill="#374151" text-anchor="middle" >Des écarts significatifs :</text><text x="749" y="419.8" font-size="17" font-weight="400" fill="#374151" text-anchor="middle" >corrections suivies</text><text x="749" y="441.5" font-size="17" font-weight="400" fill="#374151" text-anchor="middle" >par l’administration</text><rect x="644" y="520" width="210" height="32" rx="16" fill="#eef3f9"/><text x="749" y="542.0" font-size="15" font-weight="700" fill="#d9731a" text-anchor="middle" >Niveau 3 sur 4</text><rect x="904" y="140" width="266" height="430" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/><rect x="904" y="140" width="266" height="170" rx="22" fill="url(#gR)"/><rect x="904" y="270" width="266" height="40" fill="url(#gR)"/><circle cx="1037" cy="222" r="58" fill="#fff"/><circle cx="1016.7" cy="210.4" r="5.22" fill="#b8322a"/><circle cx="1057.3" cy="210.4" r="5.22" fill="#b8322a"/><path d="M1010.9 251.0 Q1037 224.9 1063.1 251.0" fill="none" stroke="#b832