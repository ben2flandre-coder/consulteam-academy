<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
<title id="title">Facteur de chute : hauteur de chute libre divisée par longueur de liaison</title><desc id="desc">Modèle vertical simplifié. La même longueur L donne une chute libre proche de zéro, de L ou de deux L selon la position et le mou. Deux L désigne un déplacement avant freinage, pas un allongement de la longe.</desc>
<style>text{font-family:Arial,sans-serif;fill:#112f43;font-size:17px}.title{font-size:25px;font-weight:700}.b{font-weight:700}.small{font-size:15px}.blue{fill:#075b9b}.red{fill:#b3261e}</style>
<rect width="900" height="460" rx="14" fill="white"/><text x="30" y="36" class="title">Facteur géométrique = H ÷ L</text><text x="30" y="64">H : chute libre du point d’attache · L : longueur de liaison</text>
<g stroke="#cddae3" fill="#f4f8fb"><rect x="20" y="85" width="275" height="285" rx="12"/><rect x="312" y="85" width="275" height="285" rx="12"/><rect x="604" y="85" width="275" height="285" rx="12"/></g>
<text x="40" y="116" class="b">Ancrage haut, peu de mou</text>
<path d="M85 146V240" stroke="#075b9b" stroke-width="5"/><rect x="73" y="134" width="24" height="12" fill="#082b45"/><circle cx="85" cy="240" r="9" fill="#ec168c"/>
<text x="110" y="192" class="blue">L</text><text x="110" y="244">Point d’attache</text><text x="40" y="305" class="b">H ≈ 0 · facteur ≈ 0</text><text x="40" y="337" class="small">La liaison est presque tendue.</text>
<text x="332" y="116" class="b">Ancrage à hauteur d’attache</text>
<rect x="355" y="174" width="24" height="12" fill="#082b45"/><path d="M367 180C410 130 440 130 437 180" fill="none" stroke="#075b9b" stroke-width="4"/><circle cx="437" cy="180" r="9" fill="#ec168c"/><path d="M367 186V264" stroke="#075b9b" stroke-width="4" stroke-dasharray="6 5"/><circle cx="367" cy="270" r="9" fill="none" stroke="#b3261e" stroke-width="3"/>
<path d="M483 184V264m-5 -8 5 8 5 -8" fill="none" stroke="#b3261e" stroke-width="2"/><text x="498" y="226" class="red">H ≈ L</text><text x="332" y="305" class="b">Facteur ≈ 1</text><text x="332" y="337" class="small">Le mou autorise le déplacement.</text>
<text x="624" y="116" class="b">Ancrage bas</text><rect x="659" y="224" width="24" height="12" fill="#082b45"/><path d="M671 230V150" stroke="#075b9b" stroke-width="4"/><circle cx="671" cy="144" r="9" fill="#ec168c"/><path d="M671 236V310" stroke="#075b9b" stroke-width="4" stroke-dasharray="6 5"/><circle cx="671" cy="316" r="9" fill="none" stroke="#b3261e" stroke-width="3"/>
<path d="M727 148V312m-5 -8 5 8 5 -8" fill="none" stroke="#b3261e" stroke-width="2"/><text x="742" y="230" class="red">H ≈ 2 L</text><text x="624" y="351" class="b">Facteur ≈ 2 : à éviter</text>
<circle cx="38" cy="397" r="7" fill="#ec168c"/><text x="54" y="403" class="small">Départ du point d’attache</text><circle cx="340" cy="397" r="7" fill="none" stroke="#b3261e" stroke-width="2"/><text x="356" y="403" class="small">Fin de chute libre, avant freinage</text>
<text x="30" y="438" class="small b">Ce schéma ne calcule ni la force de choc, ni le tirant d’air. Lire la notice du système.</text></svg>
