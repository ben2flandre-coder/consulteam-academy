<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="t d" font-family="Segoe UI,Arial,sans-serif"><title id="t">Incendie d’origine électrique</title><desc id="d">Cinq réflexes pour un feu d’origine électrique.</desc><rect width="1000" height="320" fill="#fff"/><text x="20" y="44" font-size="30" font-weight="700" fill="#102c53">Incendie d’origine électrique</text><rect x="20" y="54" width="90" height="5" fill="#f6b63d"/><rect x="20" y="80" width="170" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="20" y="80" width="170" height="8" rx="4" fill="#0b68ae"/><circle cx="50" cy="124" r="22" fill="#102c53"/><text x="50" y="132" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">1</text><text x="82" y="120" font-size="23" font-weight="700" fill="#102c53">Alarme</text><text x="38" y="160" font-size="17.5" fill="#16273d">Donner l’alarme</text><text x="38" y="182" font-size="17.5" fill="#16273d">et alerter les</text><text x="38" y="204" font-size="17.5" fill="#16273d">secours.</text><path d="M194 165 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="#102c53" stroke-width="3"/><rect x="218" y="80" width="170" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="218" y="80" width="170" height="8" rx="4" fill="#0b68ae"/><circle cx="248" cy="124" r="22" fill="#102c53"/><text x="248" y="132" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">2</text><text x="280" y="120" font-size="23" font-weight="700" fill="#102c53">Couper</text><text x="236" y="160" font-size="17.5" fill="#16273d">Couper</text><text x="236" y="182" font-size="17.5" fill="#16273d">l’alimentation</text><text x="236" y="204" font-size="17.5" fill="#16273d">si c’est sans</text><text x="236" y="226" font-size="17.5" fill="#16273d">danger.</text><path d="M391 165 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="#102c53" stroke-width="3"/><rect x="415" y="80" width="170" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="415" y="80" width="170" height="8" rx="4" fill="#b3261e"/><circle cx="445" cy="124" r="22" fill="#102c53"/><text x="445" y="132" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">3</text><text x="477" y="120" font-size="23" font-weight="700" fill="#102c53">Pas d’eau</text><text x="433" y="160" font-size="17.5" fill="#16273d">Pas d’eau sur</text><text x="433" y="182" font-size="17.5" fill="#16273d">une installation</text><text x="433" y="204" font-size="17.5" fill="#16273d">sous tension.</text><path d="M589 165 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="#102c53" stroke-width="3"/><rect x="613" y="80" width="170" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="613" y="80" width="170" height="8" rx="4" fill="#0b68ae"/><circle cx="643" cy="124" r="22" fill="#102c53"/><text x="643" y="132" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">4</text><text x="675" y="120" font-size="23" font-weight="700" fill="#102c53">Extincteur</text><text x="631" y="160" font-size="17.5" fill="#16273d">Adapté,</text><text x="631" y="182" font-size="17.5" fill="#16273d">seulement si</text><text x="631" y="204" font-size="17.5" fill="#16273d">formé et feu</text><text x="631" y="226" font-size="17.5" fill="#16273d">petit.</text><path d="M786 165 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="#102c53" stroke-width="3"/><rect x="810" y="80" width="170" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="810" y="80" width="170" height="8" rx="4" fill="#0b68ae"/><circle cx="840" cy="124" r="22" fill="#102c53"/><text x="840" y="132" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">5</text><text x="872" y="120" font-size="23" font-weight="700" fill="#102c53">Évacuer</text><text x="828" y="160" font-size="17.5" fill="#16273d">Rejoindre le</text><text x="828" y="182" font-size="17.5" fill="#16273d">point de</text><text x="828" y="204" font-size="17.5" fill="#16273d">rassemblement.</text><text x="20" y="304" font-size="16" fill="#53657a">Type d’extincteur et consignes : celles de l’établissement.</text></svg>