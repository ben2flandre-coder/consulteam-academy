<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Amélioration continue : le cycle PDCA appliqué au PMS</title><desc id="d">Quatre cases en boucle : planifier, réaliser, contrôler, améliorer.</desc><rect width="1200" height="675" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Amélioration continue : le cycle PDCA appliqué au PMS</text><rect x="150" y="120" width="400" height="190" rx="14" fill="#eef3f9" stroke="#0b68ae" stroke-width="2.5"/><text x="350" y="195" font-size="38" fill="#0b68ae" text-anchor="middle" font-weight="700">Planifier</text><text x="350" y="245" font-size="22" fill="#102c53" text-anchor="middle" font-weight="400">décrire le plan, fixer les limites</text><rect x="650" y="120" width="400" height="190" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="850" y="195" font-size="38" fill="#102c53" text-anchor="middle" font-weight="700">Réaliser</text><text x="850" y="245" font-size="22" fill="#102c53" text-anchor="middle" font-weight="400">appliquer et enregistrer</text><rect x="650" y="360" width="400" height="190" rx="14" fill="#eef3f9" stroke="#0b68ae" stroke-width="2.5"/><text x="850" y="435" font-size="38" fill="#0b68ae" text-anchor="middle" font-weight="700">Contrôler</text><text x="850" y="485" font-size="22" fill="#102c53" text-anchor="middle" font-weight="400">audit interne, relevés, indicateurs</text><rect x="150" y="360" width="400" height="190" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="350" y="435" font-size="38" fill="#102c53" text-anchor="middle" font-weight="700">Améliorer</text><text x="350" y="485" font-size="22" fill="#102c53" text-anchor="middle" font-weight="400">corriger et mettre à jour le plan</text><line x1="550" y1="215" x2="644.0" y2="215.0" stroke="#f6b63d" stroke-width="6"/><polygon points="650,215 635.6,222.0 635.6,208.0" fill="#f6b63d"/><line x1="850" y1="310" x2="850.0" y2="354.0" stroke="#f6b63d" stroke-width="6"/><polygon points="850,360 843.0,345.6 857.0,345.6" fill="#f6b63d"/><line x1="650" y1="455" x2="556.0" y2="455.0" stroke="#f6b63d" stroke-width="6"/><polygon points="550,455 564.4,448.0 564.4,462.0" fill="#f6b63d"/><line x1="350" y1="360" x2="350.0" y2="316.0" stroke="#f6b63d" stroke-width="6"/><polygon points="350,310 357.0,324.4 343.0,324.4" fill="#f6b63d"/><text x="40" y="653" font-size="18" fill="#5a6b80" text-anchor="start" font-weight="400">Roue de Deming.</text></svg>