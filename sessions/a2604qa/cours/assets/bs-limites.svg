<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc"><title id="title">BS : trois limites techniques cumulatives</title><desc id="desc">Sur un circuit terminal : les seuils ne suffisent jamais à autoriser une opération.. TENSION 400 V CA ou 600 V CC Alimentation du circuit à identifier avec certitude. PROTECTION 32 A CA ou 16 A CC Courant assigné de la protection du circuit. CONDUCTEURS 6 mm² Cu ou 10 mm² Al Section des conducteurs à vérifier avant de décider.. Hors tension · Sans voisinage · Opération élémentaire · Aucun exécutant sous ses ordres</desc><rect width="1300" height="760" fill="white"/><rect width="1300" height="16" fill="#0b2545"/><g font-family="Arial, sans-serif" fill="#172941"><text x="60" y="65" font-size="17" letter-spacing="3" fill="#53677d">CONSULTEAM ACADEMY · RECYCLAGE</text><text x="60" y="115" font-size="39" font-weight="800">BS : trois limites techniques cumulatives</text><text x="60" y="156" font-size="21" fill="#53677d">Sur un circuit terminal : les seuils ne suffisent jamais à autoriser une opération.</text><rect x="60" y="190" width="365" height="385" rx="20" fill="#f1f6fb" stroke="#ceddea"/><circle cx="102" cy="232" r="20" fill="#0b2545"/><text x="102" y="239" text-anchor="middle" fill="white" font-size="18" font-weight="700">1</text><text x="90" y="300" font-size="22" font-weight="700">TENSION</text><text x="90" y="354" font-size="32" font-weight="800" fill="#095ea4">400 V CA</text><text x="90" y="405" font-size="19">ou 600 V CC</text><text x="90" y="441" font-size="19">Alimentation du circuit</text><text x="90" y="477" font-size="19">à identifier avec certitude.</text><rect x="455" y="190" width="365" height="385" rx="20" fill="#f1f6fb" stroke="#ceddea"/><circle cx="497" cy="232" r="20" fill="#0b2545"/><text x="497" y="239" text-anchor="middle" fill="white" font-size="18" font-weight="700">2</text><text x="485" y="300" font-size="22" font-weight="700">PROTECTION</text><text x="485" y="354" font-size="32" font-weight="800" fill="#095ea4">32 A CA</text><text x="485" y="405" font-size="19">ou 16 A CC</text><text x="485" y="441" font-size="19">Courant assigné de la</text><text x="485" y="477" font-size="19">protection du circuit.</text><rect x="850" y="190" width="365" height="385" rx="20" fill="#f1f6fb" stroke="#ceddea"/><circle cx="892" cy="232" r="20" fill="#0b2545"/><text x="892" y="239" text-anchor="middle" fill="white" font-size="18" font-weight="700">3</text><text x="880" y="300" font-size="22" font-weight="700">CONDUCTEURS</text><text x="880" y="354" font-size="32" font-weight="800" fill="#095ea4">6 mm² Cu</text><text x="880" y="405" font-size="19">ou 10 mm² Al</text><text x="880" y="441" font-size="19">Section des conducteurs</text><text x="880" y="477" font-size="19">à vérifier avant de décider.</text><rect x="60" y="607" width="1155" height="70" rx="12" fill="#fff2d4"/><text x="85" y="650" font-size="20" font-weight="700">Hors tension · Sans voisinage · Opération élémentaire · Aucun exécutant sous ses ordres</text><text x="60" y="721" font-size="15" fill="#53677d">RMBD · Benoît Deflandre · 10/10/2026 · Source : FAQ INRS / NF C 18-510 applicable</text></g></svg>