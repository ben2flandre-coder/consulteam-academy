<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t d"><title id="t">Installer un nouvel appareil dans un tableau : les étapes</title><desc id="d">Huit étapes : cadrer, vérifier la place et la réserve, choisir l&#x27;appareil, consigner, clipser et raccorder au peigne, raccorder l&#x27;aval, repérer et mettre à jour le schéma, essayer.</desc><style>.lbl,.num{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}</style><rect width="960" height="660" fill="#ffffff"/><text class="lbl" x="24" y="34" font-size="20" font-weight="700" text-anchor="start" fill="#102c53">Installer un nouvel appareil dans un tableau : les étapes</text><text class="lbl" x="24" y="56" font-size="13" font-weight="400" text-anchor="start" fill="#53657a">Déroulé type, à adapter à l&#x27;installation et aux consignes du chargé de travaux</text><rect x="40" y="76" width="880" height="56" rx="8" fill="#f4f7fb" stroke="#102c53" stroke-width="1.5" /><circle cx="70" cy="104.0" r="14" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="109.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">1</text><text class="lbl" x="100" y="99" font-size="15" font-weight="700" text-anchor="start" fill="#102c53">Cadrer l&#x27;opération</text><text class="lbl" x="100" y="119" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">C&#x27;est une modification de l&#x27;installation : vérifier le titre et le périmètre avant d&#x27;agir (S1)</text><line x1="70" y1="132" x2="70" y2="146" stroke="#53657a" stroke-width="2" /><rect x="40" y="146" width="880" height="56" rx="8" fill="#fff" stroke="#102c53" stroke-width="1.5" /><circle cx="70" cy="174.0" r="14" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="179.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">2</text><text class="lbl" x="100" y="169" font-size="15" font-weight="700" text-anchor="start" fill="#102c53">Vérifier la place et la réserve</text><text class="lbl" x="100" y="189" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">Emplacement libre sur la rangée ; une réserve minimale de 20 % est prescrite en logement (S14)</text><line x1="70" y1="202" x2="70" y2="216" stroke="#53657a" stroke-width="2" /><rect x="40" y="216" width="880" height="56" rx="8" fill="#f4f7fb" stroke="#102c53" stroke-width="1.5" /><circle cx="70" cy="244.0" r="14" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="249.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">3</text><text class="lbl" x="100" y="239" font-size="15" font-weight="700" text-anchor="start" fill="#102c53">Choisir l&#x27;appareil</text><text class="lbl" x="100" y="259" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">Calibre, courbe, pouvoir de coupure supérieur au courant de court-circuit, type de différentiel (S7, S9)</text><line x1="70" y1="272" x2="70" y2="286" stroke="#53657a" stroke-width="2" /><rect x="40" y="286" width="880" height="56" rx="8" fill="#fff" stroke="#102c53" stroke-width="1.5" /><circle cx="70" cy="314.0" r="14" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="319.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">4</text><text class="lbl" x="100" y="309" font-size="15" font-weight="700" text-anchor="start" fill="#102c53">Consigner et vérifier l&#x27;absence de tension</text><text class="lbl" x="100" y="329" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">Séparer, condamner, identifier, puis VAT neutre compris (S22, S16)</text><line x1="70" y1="342" x2="70" y2="356" stroke="#53657a" stroke-width="2" /><rect x="40" y="356" width="880" height="56" rx="8" fill="#f4f7fb" stroke="#102c53" stroke-width="1.5" /><circle cx="70" cy="384.0" r="14" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="389.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">5</text><text class="lbl" x="100" y="379" font-size="15" font-weight="700" text-anchor="start" fill="#102c53">Clipser l&#x27;appareil et alimenter par le peigne</text><text class="lbl" x="100" y="399" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">Accrocher sur le rail, insérer le peigne, serrer la borne amont (S9)</text><line x1="70" y1="412" x2="70" y2="426" stroke="#53657a" stroke-width="2" /><rect x="40" y="426" width="880" height="56" rx="8" fill="#fff" stroke="#102c53" stroke-width="1.5" /><circle cx="70" cy="454.0" r="14" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="459.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">6</text><text class="lbl" x="100" y="449" font-size="15" font-weight="700" text-anchor="start" fill="#102c53">Raccorder le circuit aval</text><text class="lbl" x="100" y="469" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">Section adaptée au calibre, conducteur de terre au bornier, bornes serrées (S9)</text><line x1="70" y1="482" x2="70" y2="496" stroke="#53657a" stroke-width="2" /><rect x="40" y="496" width="880" height="56" rx="8" fill="#f4f7fb" stroke="#102c53" stroke-width="1.5" /><circle cx="70" cy="524.0" r="14" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="529.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">7</text><text class="lbl" x="100" y="519" font-size="15" font-weight="700" text-anchor="start" fill="#102c53">Repérer et mettre à jour le schéma</text><text class="lbl" x="100" y="539" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">Étiquette du circuit, schéma du tableau complété (S15)</text><line x1="70" y1="552" x2="70" y2="566" stroke="#53657a" stroke-width="2" /><rect x="40" y="566" width="880" height="56" rx="8" fill="#fff" stroke="#102c53" stroke-width="1.5" /><circle cx="70" cy="594.0" r="14" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="599.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">8</text><text class="lbl" x="100" y="589" font-size="15" font-weight="700" text-anchor="start" fill="#102c53">Fermer, déconsigner, essayer</text><text class="lbl" x="100" y="609" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">Remettre le plastron, lever la consigne, essai de fonctionnement (S16)</text><text class="lbl" x="24" y="644" font-size="12" font-weight="400" text-anchor="start" fill="#53657a">Sources : S1, S7, S9, S14, S15, S16, S22. Déroulé pédagogique : le formateur le valide pour le contexte ADI.</text></svg>