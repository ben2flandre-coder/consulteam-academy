<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Nettoyage et désinfection : six temps</title><desc id="d">Six étapes de l’élimination des résidus au séchage.</desc><rect width="1200" height="675" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Nettoyage et désinfection : six temps</text><circle cx="94" cy="190" r="30" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="94" y="202" font-size="32" fill="#102c53" text-anchor="middle" font-weight="700">1</text><rect x="140" y="140" width="260" height="100" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="270.0" y="183.16" font-size="24" fill="#102c53" text-anchor="middle" font-weight="700">Éliminer</text><text x="270.0" y="213.16" font-size="24" fill="#102c53" text-anchor="middle" font-weight="700">les résidus</text><line x1="400" y1="190" x2="434.0" y2="190.0" stroke="#0b68ae" stroke-width="4"/><polygon points="440,190 425.6,197.0 425.6,183.0" fill="#0b68ae"/><circle cx="474" cy="190" r="30" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="474" y="202" font-size="32" fill="#102c53" text-anchor="middle" font-weight="700">2</text><rect x="520" y="140" width="260" height="100" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="650.0" y="183.16" font-size="24" fill="#102c53" text-anchor="middle" font-weight="700">Nettoyer</text><text x="650.0" y="213.16" font-size="24" fill="#102c53" text-anchor="middle" font-weight="700">au détergent</text><line x1="780" y1="190" x2="814.0" y2="190.0" stroke="#0b68ae" stroke-width="4"/><polygon points="820,190 805.6,197.0 805.6,183.0" fill="#0b68ae"/><circle cx="854" cy="190" r="30" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="854" y="202" font-size="32" fill="#102c53" text-anchor="middle" font-weight="700">3</text><rect x="900" y="140" width="260" height="100" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="1030.0" y="198.16" font-size="24" fill="#102c53" text-anchor="middle" font-weight="700">Rincer</text><circle cx="94" cy="390" r="30" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="94" y="402" font-size="32" fill="#102c53" text-anchor="middle" font-weight="700">4</text><rect x="140" y="340" width="260" height="100" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="270.0" y="398.16" font-size="24" fill="#102c53" text-anchor="middle" font-weight="700">Désinfecter</text><line x1="400" y1="390" x2="434.0" y2="390.0" stroke="#0b68ae" stroke-width="4"/><polygon points="440,390 425.6,397.0 425.6,383.0" fill="#0b68ae"/><circle cx="474" cy="390" r="30" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="474" y="402" font-size="32" fill="#102c53" text-anchor="middle" font-weight="700">5</text><rect x="520" y="340" width="260" height="100" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="650.0" y="383.16" font-size="24" fill="#102c53" text-anchor="middle" font-weight="700">Rincer</text><text x="650.0" y="413.16" font-size="24" fill="#102c53" text-anchor="middle" font-weight="700">si nécessaire</text><line x1="780" y1="390" x2="814.0" y2="390.0" stroke="#0b68ae" stroke-width="4"/><polygon points="820,390 805.6,397.0 805.6,383.0" fill="#0b68ae"/><circle cx="854" cy="390" r="30" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="854" y="402" font-size="32" fill="#102c53" text-anchor="middle" font-weight="700">6</text><rect x="900" y="340" width="260" height="100" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="1030.0" y="398.16" font-size="24" fill="#102c53" text-anchor="middle" font-weight="700">Laisser sécher</text><rect x="60" y="520" width="1080" height="110" rx="14" fill="#fff7e0" stroke="#f6b63d" stroke-width="2.5"/><text x="80" y="562.0" font-size="23" fill="#102c53" text-anchor="start" font-weight="700">On ne désinfecte pas une surface sale.</text><text x="80" y="590.75" font-size="23" fill="#102c53" text-anchor="start" font-weight="700">Respecter dosage, temps de contact et fiche de données du produit.</text><text x="40" y="653" font-size="18" fill="#5a6b80" text-anchor="start" font-weight="400">Suivre le plan de nettoyage et de désinfection de l’établissement.</text></svg>