<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Hiérarchie des mesures de prévention</title><desc id="d">Cinq niveaux de la suppression du danger à l’EPI.</desc><rect width="1200" height="675" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Hiérarchie des mesures de prévention</text><rect x="100" y="95" width="1000" height="84" rx="12" fill="#e6f3ec" stroke="#1e7a46" stroke-width="2.5"/><text x="600" y="149" font-size="30" fill="#102c53" text-anchor="middle" font-weight="700">1 · Supprimer le danger</text><rect x="160" y="193" width="880" height="84" rx="12" fill="#eaf3e2" stroke="#1e7a46" stroke-width="2.5"/><text x="600" y="247" font-size="30" fill="#102c53" text-anchor="middle" font-weight="700">2 · Réduire à la source, substituer</text><rect x="220" y="291" width="760" height="84" rx="12" fill="#fff1c9" stroke="#c25b00" stroke-width="2.5"/><text x="600" y="345" font-size="30" fill="#102c53" text-anchor="middle" font-weight="700">3 · Protection collective</text><rect x="280" y="389" width="640" height="84" rx="12" fill="#fdeede" stroke="#c25b00" stroke-width="2.5"/><text x="600" y="443" font-size="30" fill="#102c53" text-anchor="middle" font-weight="700">4 · Organisation, formation</text><rect x="340" y="487" width="520" height="84" rx="12" fill="#f6d0cc" stroke="#b3261e" stroke-width="2.5"/><text x="600" y="541" font-size="30" fill="#102c53" text-anchor="middle" font-weight="700">5 · Protection individuelle (EPI)</text><text x="40" y="620" font-size="24" fill="#0b68ae" text-anchor="start" font-weight="700">Plus on agit en haut, plus la prévention est efficace.</text><text x="40" y="653" font-size="18" fill="#5a6b80" text-anchor="start" font-weight="400">Principes généraux de prévention, Code du travail L. 4121-2.</text></svg>