<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Le message d’alerte</title><desc id="d">Quatre informations à donner aux secours.</desc><rect width="1200" height="675" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Le message d’alerte</text><rect x="60" y="130" width="520" height="160" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="90" y="190" font-size="34" fill="#0b68ae" text-anchor="start" font-weight="700">Qui j’appelle</text><text x="90" y="240" font-size="26" fill="#102c53" text-anchor="start" font-weight="400">15 · 18 · 112</text><rect x="620" y="130" width="520" height="160" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="650" y="190" font-size="34" fill="#0b68ae" text-anchor="start" font-weight="700">Où</text><text x="650" y="240" font-size="26" fill="#102c53" text-anchor="start" font-weight="400">adresse exacte, repère, accès</text><rect x="60" y="320" width="520" height="160" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="90" y="380" font-size="34" fill="#0b68ae" text-anchor="start" font-weight="700">Quoi</text><text x="90" y="430" font-size="26" fill="#102c53" text-anchor="start" font-weight="400">ce qui s’est passé</text><rect x="620" y="320" width="520" height="160" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="650" y="380" font-size="34" fill="#0b68ae" text-anchor="start" font-weight="700">Combien</text><text x="650" y="430" font-size="26" fill="#102c53" text-anchor="start" font-weight="400">nombre de victimes, état, gestes faits</text><rect x="60" y="520" width="1080" height="100" rx="14" fill="#fff7e0" stroke="#f6b63d" stroke-width="2.5"/><text x="80" y="560.0" font-size="24" fill="#102c53" text-anchor="start" font-weight="700">Répondre aux questions, ne raccrocher que si le régulateur le demande.</text><text x="80" y="590.0" font-size="24" fill="#102c53" text-anchor="start" font-weight="700">Envoyer quelqu’un chercher le défibrillateur et accueillir les secours.</text><text x="40" y="653" font-size="18" fill="#5a6b80" text-anchor="start" font-weight="400">Principes SST (INRS).</text></svg>