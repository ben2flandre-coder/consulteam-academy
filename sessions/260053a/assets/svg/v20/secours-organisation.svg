<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Préparer la récupération avant de commencer</title><desc id="desc">Le téléphone donne l’alerte ; il ne récupère pas la victime.</desc><rect width="1100" height="620" fill="#fff"/><style>text{font-family:Segoe UI,Arial,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect x="0" y="0" width="14" height="620" rx="0" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="40" y="56" font-size="34" fill="#102c53" font-weight="800">Préparer la récupération avant de commencer</text><text x="40" y="94" font-size="23" fill="#52677d" font-weight="500">Le téléphone donne l’alerte ; il ne récupère pas la victime.</text><circle cx="548" cy="331" r="109" fill="#102c53" stroke="none" stroke-width="4"/><text x="479" y="321" font-size="30" fill="#fff" font-weight="800">SECOURS</text><text x="484" y="361" font-size="28" fill="#f6b63d" font-weight="800">PRÉPARÉ</text><rect x="44" y="155" width="325" height="133" rx="14" fill="#eef3f8" stroke="none" stroke-width="3"/><text x="65" y="200" font-size="23" fill="#102c53" font-weight="500">Qui alerte ?</text><text x="65" y="240" font-size="23" fill="#102c53" font-weight="500">Lieu précis, accès, guidage</text><rect x="731" y="155" width="325" height="133" rx="14" fill="#eef3f8" stroke="none" stroke-width="3"/><text x="752" y="200" font-size="23" fill="#102c53" font-weight="500">Qui intervient ?</text><text x="752" y="240" font-size="23" fill="#102c53" font-weight="500">Compétences et rôles définis</text><rect x="44" y="374" width="325" height="136" rx="14" fill="#eef3f8" stroke="none" stroke-width="3"/><text x="65" y="418" font-size="23" fill="#102c53" font-weight="500">Avec quels moyens ?</text><text x="65" y="458" font-size="23" fill="#102c53" font-weight="500">Matériel prévu, disponible</text><rect x="731" y="374" width="325" height="136" rx="14" fill="#eef3f8" stroke="none" stroke-width="3"/><text x="752" y="418" font-size="23" fill="#102c53" font-weight="500">Par quel chemin ?</text><text x="752" y="458" font-size="23" fill="#102c53" font-weight="500">Accès et procédure prévus</text><path d="M369 225 L442 290" fill="none" stroke="#f6b63d" stroke-width="5"/><path d="M656 290 L731 225" fill="none" stroke="#f6b63d" stroke-width="5"/><path d="M369 437 L442 375" fill="none" stroke="#f6b63d" stroke-width="5"/><path d="M656 375 L731 437" fill="none" stroke="#f6b63d" stroke-width="5"/><path d="M40 570 L1060 570" fill="none" stroke="#d6e0ea" stroke-width="2"/><text x="40" y="603" font-size="19" fill="#52677d" font-weight="500">L’initiation et le SST ne constituent pas, seuls, une compétence de sauvetage technique</text></svg>