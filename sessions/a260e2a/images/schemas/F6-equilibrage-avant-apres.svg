<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d"><title id="t">Équilibrage des phases : avant et après</title><desc id="d">Barres du courant par phase L1, L2, L3 avant et après répartition des circuits monophasés, avec la moyenne, le courant dans le neutre et le déséquilibre calculés.</desc><style>.lbl,.num{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}</style><rect width="960" height="640" fill="#ffffff"/><text class="lbl" x="24" y="34" font-size="20" font-weight="700" text-anchor="start" fill="#102c53">Équilibrer un tableau triphasé : exemple chiffré fictif</text><text class="lbl" x="24" y="56" font-size="13" font-weight="400" text-anchor="start" fill="#53657a">8 circuits monophasés de 16, 16, 10, 10, 8, 6, 6 et 4 A, charges résistives</text><rect x="40" y="90" width="300" height="470" rx="14" fill="#f4f7fb" stroke="#102c53" stroke-width="3" /><text class="lbl" x="190" y="118" font-size="16" font-weight="700" text-anchor="middle" fill="#102c53">Avant</text><rect x="70" y="176.0" width="60" height="294.0" rx="3" fill="#b3261e" stroke="#102c53" stroke-width="1.5" /><text class="lbl" x="100" y="198.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">42 A</text><text class="lbl" x="100" y="492" font-size="14" font-weight="700" text-anchor="middle" fill="#16273d">L1</text><rect x="160" y="344.0" width="60" height="126.0" rx="3" fill="#d9a300" stroke="#102c53" stroke-width="1.5" /><text class="lbl" x="190" y="366.0" font-size="14" font-weight="700" text-anchor="middle" fill="#16273d">18 A</text><text class="lbl" x="190" y="492" font-size="14" font-weight="700" text-anchor="middle" fill="#16273d">L2</text><rect x="250" y="358.0" width="60" height="112.0" rx="3" fill="#0b68ae" stroke="#102c53" stroke-width="1.5" /><text class="lbl" x="280" y="380.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">16 A</text><text class="lbl" x="280" y="492" font-size="14" font-weight="700" text-anchor="middle" fill="#16273d">L3</text><line x1="55" y1="292.69" x2="325" y2="292.69" stroke="#16794a" stroke-width="2" stroke-dasharray="6 4" /><text class="lbl" x="190" y="142" font-size="12" font-weight="700" text-anchor="middle" fill="#16794a">moyenne 25,33 A (ligne verte)</text><circle cx="310" cy="276.69" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="310" y="281.69" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">2</text><circle cx="70" cy="146.0" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="70" y="151.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">1</text><rect x="60" y="500" width="260" height="48" rx="6" fill="#fff" stroke="#102c53" stroke-width="1.5" /><text class="lbl" x="70" y="520" font-size="13" font-weight="700" text-anchor="start" fill="#16273d">Courant dans le neutre : 25,06 A</text><text class="lbl" x="70" y="539" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">Déséquilibre : 65,8 %</text><circle cx="302" cy="540" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="302" y="545" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">4</text><circle cx="302" cy="512" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="302" y="517" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">3</text><rect x="360" y="90" width="300" height="470" rx="14" fill="#f4f7fb" stroke="#102c53" stroke-width="3" /><text class="lbl" x="510" y="118" font-size="16" font-weight="700" text-anchor="middle" fill="#102c53">Après</text><rect x="390" y="302.0" width="60" height="168.0" rx="3" fill="#b3261e" stroke="#102c53" stroke-width="1.5" /><text class="lbl" x="420" y="324.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">24 A</text><text class="lbl" x="420" y="492" font-size="14" font-weight="700" text-anchor="middle" fill="#16273d">L1</text><rect x="480" y="288.0" width="60" height="182.0" rx="3" fill="#d9a300" stroke="#102c53" stroke-width="1.5" /><text class="lbl" x="510" y="310.0" font-size="14" font-weight="700" text-anchor="middle" fill="#16273d">26 A</text><text class="lbl" x="510" y="492" font-size="14" font-weight="700" text-anchor="middle" fill="#16273d">L2</text><rect x="570" y="288.0" width="60" height="182.0" rx="3" fill="#0b68ae" stroke="#102c53" stroke-width="1.5" /><text class="lbl" x="600" y="310.0" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">26 A</text><text class="lbl" x="600" y="492" font-size="14" font-weight="700" text-anchor="middle" fill="#16273d">L3</text><line x1="375" y1="292.69" x2="645" y2="292.69" stroke="#16794a" stroke-width="2" stroke-dasharray="6 4" /><text class="lbl" x="510" y="142" font-size="12" font-weight="700" text-anchor="middle" fill="#16794a">moyenne 25,33 A (ligne verte)</text><rect x="380" y="500" width="260" height="48" rx="6" fill="#fff" stroke="#102c53" stroke-width="1.5" /><text class="lbl" x="390" y="520" font-size="13" font-weight="700" text-anchor="start" fill="#16273d">Courant dans le neutre : 2,0 A</text><text class="lbl" x="390" y="539" font-size="13" font-weight="400" text-anchor="start" fill="#16273d">Déséquilibre : 5,3 %</text><text class="lbl" x="690" y="90" font-size="16" font-weight="700" text-anchor="start" fill="#102c53">Légende</text><circle cx="702" cy="109" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="702" y="114" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">1</text><text class="lbl" x="722" y="114" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Barre : somme des courants</text><text class="lbl" x="722" y="132" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">des circuits branchés sur la</text><text class="lbl" x="722" y="150" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">phase</text><circle cx="702" cy="173" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="702" y="178" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">2</text><text class="lbl" x="722" y="178" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Ligne verte : courant moyen</text><text class="lbl" x="722" y="196" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">des trois phases</text><circle cx="702" cy="219" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="702" y="224" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">3</text><text class="lbl" x="722" y="224" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Neutre : somme vectorielle</text><text class="lbl" x="722" y="242" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">des trois courants, pas leur</text><text class="lbl" x="722" y="260" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">somme simple</text><circle cx="702" cy="283" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="702" y="288" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">4</text><text class="lbl" x="722" y="288" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Déséquilibre : écart maximal</text><text class="lbl" x="722" y="306" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">à la moyenne, divisé par la</text><text class="lbl" x="722" y="324" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">moyenne (S13)</text><text class="lbl" x="690" y="380" font-size="12" font-weight="700" text-anchor="start" fill="#102c53">Méthode : classer les circuits du plus fort</text><text class="lbl" x="690" y="398" font-size="12" font-weight="700" text-anchor="start" fill="#102c53">au plus faible, puis brancher chacun sur la</text><text class="lbl" x="690" y="416" font-size="12" font-weight="700" text-anchor="start" fill="#102c53">phase la moins chargée à cet instant.</text><text class="lbl" x="690" y="448" font-size="12" font-weight="400" text-anchor="start" fill="#b3261e">Phases équilibrées ne veut pas dire neutre</text><text class="lbl" x="690" y="466" font-size="12" font-weight="400" text-anchor="start" fill="#b3261e">sans courant : les harmoniques de rang 3</text><text class="lbl" x="690" y="484" font-size="12" font-weight="400" text-anchor="start" fill="#b3261e">des charges non linéaires s&#x27;y ajoutent</text><text class="lbl" x="690" y="502" font-size="12" font-weight="400" text-anchor="start" fill="#b3261e">(S11).</text><text class="lbl" x="24" y="624" font-size="12" font-weight="400" text-anchor="start" fill="#53657a">Calcul : script preuves/calcul-equilibrage (phaseurs, 6561 répartitions testées). Formule : S13. Neutre : S12. Exemple fictif.</text></svg>