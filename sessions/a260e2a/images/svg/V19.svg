<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Moteur triphasé : séparation et masse</title><desc id="desc">Schéma électrique de principe incomplet — impropre au câblage ou au dimensionnement.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S01, S04.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V19 · Moteur triphasé : séparation et masse</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Schéma électrique de principe incomplet — impropre au câblage ou au dimensionnement.</text><text x="75" y="288" font-size="26" fill="#173b50">L1</text><path d="M140,280 L400,280" fill="none" stroke="#173b50" stroke-width="4" /><path d="M400,280 L530,280" fill="none" stroke="#173b50" stroke-width="4" /><path d="M620,280 L750,280" fill="none" stroke="#173b50" stroke-width="4" /><path d="M530,280 L608,227" fill="none" stroke="#173b50" stroke-width="4" /><circle cx="530" cy="280" r="7" fill="#173b50"/><circle cx="620" cy="280" r="7" fill="#f7fafb" stroke="#173b50" stroke-width="3"/><path d="M750,280 L1040,280" fill="none" stroke="#173b50" stroke-width="4" /><circle cx="1040" cy="280" r="7" fill="#173b50"/><path d="M1040,280 L1150,280" fill="none" stroke="#173b50" stroke-width="4" /><text x="75" y="398" font-size="26" fill="#173b50">L2</text><path d="M140,390 L400,390" fill="none" stroke="#173b50" stroke-width="4" /><path d="M400,390 L530,390" fill="none" stroke="#173b50" stroke-width="4" /><path d="M620,390 L750,390" fill="none" stroke="#173b50" stroke-width="4" /><path d="M530,390 L608,337" fill="none" stroke="#173b50" stroke-width="4" /><circle cx="530" cy="390" r="7" fill="#173b50"/><circle cx="620" cy="390" r="7" fill="#f7fafb" stroke="#173b50" stroke-width="3"/><path d="M750,390 L1040,390" fill="none" stroke="#173b50" stroke-width="4" /><circle cx="1040" cy="390" r="7" fill="#173b50"/><path d="M1040,390 L1150,390" fill="none" stroke="#173b50" stroke-width="4" /><text x="75" y="508" font-size="26" fill="#173b50">L3</text><path d="M140,500 L400,500" fill="none" stroke="#173b50" stroke-width="4" /><path d="M400,500 L530,500" fill="none" stroke="#173b50" stroke-width="4" /><path d="M620,500 L750,500" fill="none" stroke="#173b50" stroke-width="4" /><path d="M530,500 L608,447" fill="none" stroke="#173b50" stroke-width="4" /><circle cx="530" cy="500" r="7" fill="#173b50"/><circle cx="620" cy="500" r="7" fill="#f7fafb" stroke="#173b50" stroke-width="3"/><path d="M750,500 L1040,500" fill="none" stroke="#173b50" stroke-width="4" /><circle cx="1040" cy="500" r="7" fill="#173b50"/><path d="M1040,500 L1150,500" fill="none" stroke="#173b50" stroke-width="4" /><path d="M570,205 L570,535" fill="none" stroke="#173b50" stroke-width="4" stroke-dasharray="10 8" /><text x="420" y="635" font-size="25" fill="#173b50">Séparation simultanée</text><text x="420" y="669" font-size="25" fill="#173b50">des trois phases représentée</text><rect x="1150" y="210" width="350" height="430" rx="22" fill="#e6f4f1" stroke="#173b50" stroke-width="3"/><circle cx="1325" cy="410" r="100" fill="white" stroke="#173b50" stroke-width="4"/><text x="1285" y="405" font-size="55" fill="#173b50">M</text><text x="1290" y="460" font-size="32" fill="#173b50">3~</text><path d="M140,725 L1325,725" fill="none" stroke="#087554" stroke-width="4" /><path d="M1325,725 L1325,640" fill="none" stroke="#087554" stroke-width="4" /><circle cx="1325" cy="640" r="7" fill="#173b50"/><text x="75" y="733" font-size="26" fill="#173b50">PE</text><text x="990" y="775" font-size="22" fill="#173b50">Liaison à la masse représentée</text><text x="80" y="825" font-size="25" fill="#173b50">Exemple 3 phases + PE sans neutre · protections et commande non représentées.</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S01, S04</text></g></svg>