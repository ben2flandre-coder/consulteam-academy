<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 330" width="1280" height="660" role="img" aria-labelledby="trit trid" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="640" height="330" fill="#FFFFFF"/><title id="trit">Triangle du feu et modes d’extinction</title><desc id="trid">Un feu a besoin d’un combustible, d’un comburant et d’une énergie d’activation. Refroidir retire l’énergie, étouffer écarte l’oxygène, isoler retire le combustible.</desc><polygon points="160,52 40,262 280,262" fill="#FBE4DF" stroke="#C8281E" stroke-width="4" stroke-linejoin="round"/><g transform="translate(160,190) scale(1.5)"><path d="M0,-30 C9,-16 22,-8 22,8 C22,22 12,30 0,30 C-12,30 -22,22 -22,8 C-22,-2 -15,-8 -10,-18 C-6,-12 -3,-8 0,-30 Z" fill="#F28C28"/><path d="M0,-8 C6,0 13,5 13,14 C13,23 7,28 0,28 C-7,28 -13,23 -13,14 C-13,7 -7,2 0,-8 Z" fill="#FFC843"/></g><text x="160" y="34" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="18" font-weight="700" fill="#2C3E50">Combustible</text><text x="58" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="18" font-weight="700" fill="#2C3E50">Comburant</text><text x="262" y="292" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="18" font-weight="700" fill="#2C3E50">Énergie</text><text x="58" y="313" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="400" fill="#4B4B4B">l’oxygène</text><text x="262" y="313" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="400" fill="#4B4B4B">la chaleur</text><rect x="330" y="40" width="300" height="72" rx="10" fill="#FFFFFF" stroke="#C9CDD2" stroke-width="1.5"/><rect x="330" y="40" width="8" height="72" rx="4" fill="#C8281E"/><text x="354" y="71" text-anchor="start" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="18" font-weight="700" fill="#2C3E50">Refroidir</text><text x="354" y="95" text-anchor="start" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="400" fill="#4B4B4B">retire l’énergie : l’eau</text><rect x="330" y="128" width="300" height="72" rx="10" fill="#FFFFFF" stroke="#C9CDD2" stroke-width="1.5"/><rect x="330" y="128" width="8" height="72" rx="4" fill="#C8281E"/><text x="354" y="159" text-anchor="start" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="18" font-weight="700" fill="#2C3E50">Étouffer</text><text x="354" y="183" text-anchor="start" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="400" fill="#4B4B4B">écarte l’oxygène : CO2, poudre</text><rect x="330" y="216" width="300" height="72" rx="10" fill="#FFFFFF" stroke="#C9CDD2" stroke-width="1.5"/><rect x="330" y="216" width="8" height="72" rx="4" fill="#C8281E"/><text x="354" y="247" text-anchor="start" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="18" font-weight="700" fill="#2C3E50">Isoler</text><text x="354" y="271" text-anchor="start" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="400" fill="#4B4B4B">retire le combustible (gaz coupé)</text><text x="480" y="24" text-anchor="middle" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif" font-size="15" font-weight="700" fill="#4B4B4B">Pour éteindre, on supprime un côté</text></svg>
