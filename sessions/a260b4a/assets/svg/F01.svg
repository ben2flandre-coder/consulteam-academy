<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="t d" font-family="Segoe UI,Arial,sans-serif"><title id="t">Accident électrique : les quatre réflexes</title><desc id="d">Quatre étapes : couper, dégager, alerter, secourir.</desc><rect width="1000" height="320" fill="#fff"/><text x="20" y="44" font-size="30" font-weight="700" fill="#102c53">Accident électrique : les quatre réflexes</text><rect x="20" y="54" width="90" height="5" fill="#f6b63d"/><rect x="20" y="80" width="219" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="20" y="80" width="219" height="8" rx="4" fill="#0b68ae"/><circle cx="50" cy="124" r="22" fill="#102c53"/><text x="50" y="132" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">1</text><text x="82" y="120" font-size="23" font-weight="700" fill="#102c53">Couper</text><text x="38" y="160" font-size="17.5" fill="#16273d">Mettre hors tension</text><text x="38" y="182" font-size="17.5" fill="#16273d">sans toucher la</text><text x="38" y="204" font-size="17.5" fill="#16273d">victime.</text><path d="M243 165 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="#102c53" stroke-width="3"/><rect x="267" y="80" width="219" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="267" y="80" width="219" height="8" rx="4" fill="#0b68ae"/><circle cx="297" cy="124" r="22" fill="#102c53"/><text x="297" y="132" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">2</text><text x="329" y="120" font-size="23" font-weight="700" fill="#102c53">Dégager</text><text x="285" y="160" font-size="17.5" fill="#16273d">Si la coupure est</text><text x="285" y="182" font-size="17.5" fill="#16273d">impossible : dégager</text><text x="285" y="204" font-size="17.5" fill="#16273d">sans s’exposer ni</text><text x="285" y="226" font-size="17.5" fill="#16273d">exposer d’autres</text><path d="M490 165 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="#102c53" stroke-width="3"/><rect x="514" y="80" width="219" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="514" y="80" width="219" height="8" rx="4" fill="#0b68ae"/><circle cx="544" cy="124" r="22" fill="#102c53"/><text x="544" y="132" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">3</text><text x="576" y="120" font-size="23" font-weight="700" fill="#102c53">Alerter</text><text x="532" y="160" font-size="17.5" fill="#16273d">Secouriste du site,</text><text x="532" y="182" font-size="17.5" fill="#16273d">puis 15, 18 ou 112.</text><path d="M737 165 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="#102c53" stroke-width="3"/><rect x="761" y="80" width="219" height="170" rx="12" fill="#f3f5f8" stroke="#cbd5e1"/><rect x="761" y="80" width="219" height="8" rx="4" fill="#0b68ae"/><circle cx="791" cy="124" r="22" fill="#102c53"/><text x="791" y="132" font-size="24" font-weight="700" fill="#f6b63d" text-anchor="middle">4</text><text x="823" y="120" font-size="23" font-weight="700" fill="#102c53">Secourir</text><text x="779" y="160" font-size="17.5" fill="#16273d">Rester auprès de la</text><text x="779" y="182" font-size="17.5" fill="#16273d">victime ; avis</text><text x="779" y="204" font-size="17.5" fill="#16273d">médical pour toute</text><text x="779" y="226" font-size="17.5" fill="#16273d">électrisation.</text><text x="20" y="304" font-size="16" fill="#53657a">Principe de prudence : en cas de doute, ne pas approcher, faire alerter.</text></svg>