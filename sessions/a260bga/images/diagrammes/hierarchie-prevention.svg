<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="t d" font-family="Segoe UI,system-ui,Arial,sans-serif"><title id="t">Hiérarchie des mesures</title><desc id="d">Pyramide à quatre niveaux : supprimer, réduire, protéger collectivement, puis EPI en dernier recours.</desc><rect x="1" y="1" width="718" height="403" rx="16" fill="#fff" stroke="#e4dde9" stroke-width="2"/><text x="360" y="34" font-size="21" fill="#1b2a41" text-anchor="middle" font-weight="700" >Hiérarchie des mesures de prévention</text><polygon points="100,130 320,130 282,64 138,64" fill="#e5007d"/><text x="210" y="102.0" font-size="26" fill="#fff" text-anchor="middle" font-weight="800" >1</text><text x="470" y="91" font-size="17" fill="#e5007d" text-anchor="start" font-weight="700" >Supprimer</text><text x="470" y="113" font-size="13" fill="#5b5166" text-anchor="start" font-weight="400" >supprimer la manutention, l’opération dangereuse</text><polygon points="62,204 358,204 320,138 100,138" fill="#db0d5d"/><text x="210" y="176.0" font-size="26" fill="#fff" text-anchor="middle" font-weight="800" >2</text><text x="470" y="165" font-size="17" fill="#db0d5d" text-anchor="start" font-weight="700" >Réduire</text><text x="470" y="187" font-size="13" fill="#5b5166" text-anchor="start" font-weight="400" >alléger, fractionner, mécaniser, réorganiser</text><polygon points="24,278 396,278 358,212 62,212" fill="#d21b3e"/><text x="210" y="250.0" font-size="26" fill="#fff" text-anchor="middle" font-weight="800" >3</text><text x="470" y="239" font-size="17" fill="#d21b3e" text-anchor="start" font-weight="700" >Protéger collectivement</text><text x="470" y="261" font-size="13" fill="#5b5166" text-anchor="start" font-weight="400" >garde-corps, aspiration, balisage, carter</text><polygon points="-14,352 434,352 396,286 24,286" fill="#c8281e"/><text x="210" y="324.0" font-size="26" fill="#fff" text-anchor="middle" font-weight="800" >4</text><text x="470" y="313" font-size="17" fill="#c8281e" text-anchor="start" font-weight="700" >EPI, en dernier recours</text><text x="470" y="335" font-size="13" fill="#5b5166" text-anchor="start" font-weight="400" >en complément, adapté, en bon état, porté</text><line x1="690" y1="72" x2="690.0" y2="325.5" stroke="#5b5166" stroke-width="3" stroke-linecap="round"/><polygon points="690,330 686.0853101929989,321.8959760788259 693.9146898070011,321.8959760788259" fill="#5b5166"/><text x="700" y="60" font-size="11.5" fill="#5b5166" text-anchor="end" font-weight="400" >+ efficace</text><text x="700" y="356" font-size="11.5" fill="#5b5166" text-anchor="end" font-weight="400" >complément</text></svg>