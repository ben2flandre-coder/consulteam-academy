<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Ce qui est observé peut être attesté</title><desc id="desc">Le support consulté et le geste réalisé sont des preuves différentes.</desc><rect width="1100" height="620" fill="#fff"/><style>text{font-family:Segoe UI,Arial,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect x="0" y="0" width="14" height="620" rx="0" fill="#f6b63d" stroke="none" stroke-width="3"/><text x="40" y="56" font-size="34" fill="#102c53" font-weight="800">Ce qui est observé peut être attesté</text><text x="40" y="94" font-size="23" fill="#52677d" font-weight="500">Le support consulté et le geste réalisé sont des preuves différentes.</text><rect x="70" y="153" width="960" height="70" rx="14" fill="#102c53" stroke="none" stroke-width="3"/><text x="94" y="198" font-size="25" fill="#fff" font-weight="800">ACTIVITÉ</text><text x="590" y="198" font-size="25" fill="#fff" font-weight="800">TRACE DE L’OBSERVATION</text><rect x="70" y="237" width="960" height="65" rx="14" fill="#eef3f8" stroke="none" stroke-width="3"/><text x="94" y="278" font-size="25" fill="#102c53" font-weight="700">Démonstration regardée</text><text x="590" y="278" font-size="24" fill="#0b68ae" font-weight="500">Vu, sans maîtrise présumée</text><rect x="70" y="313" width="960" height="65" rx="14" fill="#eef3f8" stroke="none" stroke-width="3"/><text x="94" y="354" font-size="25" fill="#102c53" font-weight="700">Geste essayé au sol</text><text x="590" y="354" font-size="24" fill="#0b68ae" font-weight="500">Essai et corrections notés</text><rect x="70" y="389" width="960" height="65" rx="14" fill="#eef3f8" stroke="none" stroke-width="3"/><text x="94" y="430" font-size="25" fill="#102c53" font-weight="700">Critère démontré en situation</text><text x="590" y="430" font-size="24" fill="#0b68ae" font-weight="500">Acquis / EC / NA, contexte indiqué</text><rect x="70" y="465" width="960" height="65" rx="14" fill="#eef3f8" stroke="none" stroke-width="3"/><text x="94" y="506" font-size="25" fill="#102c53" font-weight="700">Exercice non réalisé</text><text x="590" y="506" font-size="24" fill="#0b68ae" font-weight="500">Non observé, motif et suite</text><path d="M40 570 L1060 570" fill="none" stroke="#d6e0ea" stroke-width="2"/><text x="40" y="603" font-size="19" fill="#52677d" font-weight="500">Schéma de principe • à confronter à la notice et au site réel</text></svg>