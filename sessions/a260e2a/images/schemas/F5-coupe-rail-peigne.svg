t="400" text-anchor="start" fill="#16273d">libère avec un outil</text><circle cx="682" cy="215" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="220" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">4</text><text class="lbl" x="702" y="220" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Appareil modulaire (boîtier</text><text class="lbl" x="702" y="238" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">isolant)</text><circle cx="682" cy="261" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="266" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">5</text><text class="lbl" x="702" y="266" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Peigne d&#x27;alimentation (haut)</text><circle cx="682" cy="291" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="296" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">6</text><text class="lbl" x="702" y="296" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Borne amont (à vis ou</text><text class="lbl" x="702" y="314" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">automatique)</text><circle cx="682" cy="337" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="342" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">7</text><text class="lbl" x="702" y="342" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Conducteur aval</text><circle cx="682" cy="367" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="372" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">8</text><text class="lbl" x="702" y="372" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Borne aval</text><circle cx="682" cy="397" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="402" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">9</text><text class="lbl" x="702" y="402" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Plastron : cache les parties</text><text class="lbl" x="702" y="420" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">actives, laisse passer les</text><text class="lbl" x="702" y="438" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">manettes</text><circle cx="682" cy="461" r="12" fill="#102c53" stroke="#102c53" stroke-width="1"/><text class="num" x="682" y="466" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">10</text><text class="lbl" x="702" y="466" font-size="14" font-weight="400" text-anchor="start" fill="#16273d">Manette</text><text class="lbl" x="670" y="490" font-size="12" font-weight="400" text-anchor="start" fill="#b3261e">Flèche rouge : levier sur la griffe pour sortir</text><text class="lbl" x="670" y="508" font-size="12" font-weight="400" text-anchor="start" fill="#b3261e">l&#x27;appareil (S8).</text><text class="lbl" x="24" y="584" font-size="12" font-weight="400" text-anchor="start" fill="#53657a">Pose, peigne, bornes et levier : S8, S9 ; composition d&#x27;un tableau : S6. Disposition simplifiée.</text></svg>