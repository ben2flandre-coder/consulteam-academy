<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">Une visite de vérification en sept gestes</title><desc id="d">Préparer, inspecter, déclencheurs, organes reliés, asservissements, alimentation et batterie, compte rendu.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#102c53}.b{font-weight:700}.s{font-size:12.5px}.m{font-size:15px}.w{fill:#fff}</style><rect width="760" height="340" rx="16" fill="#f4f7fb"/><text x="30" y="34" class="b m">Une visite de vérification, geste par geste</text><rect x="30" y="64" width="160" height="104" rx="14" fill="#fff" stroke="#102c53" stroke-width="3"/><circle cx="58" cy="92" r="17" fill="#102c53"/><text x="58" y="98" text-anchor="middle" class="b m w">1</text><text x="110" y="130" text-anchor="middle" class="b m">Préparer</text><text x="110" y="152" text-anchor="middle" class="s">et consigner</text><rect x="210" y="64" width="160" height="104" rx="14" fill="#fff" stroke="#102c53" stroke-width="3"/><circle cx="238" cy="92" r="17" fill="#102c53"/><text x="238" y="98" text-anchor="middle" class="b m w">2</text><text x="290" y="130" text-anchor="middle" class="b m">Inspecter</text><text x="290" y="152" text-anchor="middle" class="s">détecteurs, câblage, ECS</text><rect x="390" y="64" width="160" height="104" rx="14" fill="#fff" stroke="#102c53" stroke-width="3"/><circle cx="418" cy="92" r="17" fill="#102c53"/><text x="418" y="98" text-anchor="middle" class="b m w">3</text><text x="470" y="130" text-anchor="middle" class="b m">Déclencheurs</text><text x="470" y="152" text-anchor="middle" class="s">manuels</text><rect x="570" y="64" width="160" height="104" rx="14" fill="#fff" stroke="#102c53" stroke-width="3"/><circle cx="598" cy="92" r="17" fill="#102c53"/><text x="598" y="98" text-anchor="middle" class="b m w">4</text><text x="650" y="130" text-anchor="middle" class="b m">Organes</text><text x="650" y="152" text-anchor="middle" class="s">reliés à l'ECS</text><rect x="30" y="194" width="160" height="104" rx="14" fill="#fff" stroke="#102c53" stroke-width="3"/><circle cx="58" cy="222" r="17" fill="#102c53"/><text x="58" y="228" text-anchor="middle" class="b m w">5</text><text x="110" y="260" text-anchor="middle" class="b m">Asservissements</text><text x="110" y="282" text-anchor="middle" class="s">par détecteurs</text><rect x="210" y="194" width="160" height="104" rx="14" fill="#fff" stroke="#c0392b" stroke-width="3"/><circle cx="238" cy="222" r="17" fill="#c0392b"/><text x="238" y="228" text-anchor="middle" class="b m w">6</text><text x="290" y="260" text-anchor="middle" class="b m">Alimentation</text><text x="290" y="282" text-anchor="middle" class="s">et batterie AES</text><rect x="390" y="194" width="160" height="104" rx="14" fill="#fff" stroke="#102c53" stroke-width="3"/><circle cx="418" cy="222" r="17" fill="#102c53"/><text x="418" y="228" text-anchor="middle" class="b m w">7</text><text x="470" y="260" text-anchor="middle" class="b m">Compte rendu</text><text x="470" y="282" text-anchor="middle" class="s">dossier à jour</text><rect x="570" y="194" width="160" height="104" rx="14" fill="#fff1d4"/><text x="650" y="236" text-anchor="middle" class="b m">⚠ Risque électrique</text><text x="650" y="258" text-anchor="middle" class="s">repérer la source</text><text x="650" y="276" text-anchor="middle" class="s">avant chaque geste</text></svg>