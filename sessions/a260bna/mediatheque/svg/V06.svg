<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Arrêt d’urgence et consignation</title><desc id="desc">Une machine immobile peut conserver des énergies dangereuses.. Schéma pédagogique de principe, sans échelle, non exécutable. Références S04, S08.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b6672"/></marker></defs><rect width="1600" height="1000" fill="#f7fafb"/><g font-family="Arial, sans-serif"><rect width="1600" height="150" fill="#102f43"/><text x="55" y="58" font-size="36" fill="#ffffff">V06 · Arrêt d’urgence et consignation</text><text x="55" y="108" font-size="23" fill="#b2e8e4">Une machine immobile peut conserver des énergies dangereuses.</text><circle cx="345" cy="425" r="130" fill="#e5b400"/><circle cx="345" cy="425" r="85" fill="#b32d34"/><text x="190" y="650" font-size="29" fill="#173b50">Arrêt d’urgence</text><rect x="750" y="240" width="740" height="450" rx="16" fill="#e6f4f1" stroke="#497281" stroke-width="2"/><text x="774" y="282" font-size="27" fill="#173b50">Consignation adaptée</text><text x="774" y="323" font-size="22" fill="#173b50">Identifier les énergies dangereuses</text><text x="774" y="355" font-size="22" fill="#173b50">Empêcher leur réapparition</text><text x="774" y="387" font-size="22" fill="#173b50">Traiter les énergies accumulées</text><text x="774" y="419" font-size="22" fill="#173b50">Contrôler l’état de sécurité</text><text x="100" y="770" font-size="24" fill="#173b50">Le bouton représenté est symbolique : aucun circuit de sécurité ni niveau de performance validé.</text><rect x="35" y="875" width="1530" height="100" rx="10" fill="#fff0cc"/><text x="55" y="911" font-size="23" fill="#173b50">SUPPORT PÉDAGOGIQUE — PAS UNE PROCÉDURE VALIDÉE POUR LE SITE</text><text x="55" y="948" font-size="21" fill="#173b50">Sans échelle · aucun calibre, délai ou EPI déduit du dessin · sources : S04, S08</text></g></svg>