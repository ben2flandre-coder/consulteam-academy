<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif"><title id="t">Contamination croisée</title><desc id="d">Schéma : un produit cru contamine un produit prêt à consommer par quatre vecteurs.</desc><rect width="1200" height="675" fill="#ffffff"/><rect width="1200" height="12" fill="#f6b63d"/><text x="40" y="62" font-size="34" font-weight="700" fill="#102c53">Contamination croisée</text><rect x="40" y="230" width="230" height="110" rx="14" fill="#fdeede" stroke="#c25b00" stroke-width="2.5"/><text x="155.0" y="294.52" font-size="28" fill="#c25b00" text-anchor="middle" font-weight="700">Produit cru</text><rect x="930" y="230" width="230" height="110" rx="14" fill="#e6f3ec" stroke="#1e7a46" stroke-width="2.5"/><text x="1045.0" y="277.59" font-size="26" fill="#1e7a46" text-anchor="middle" font-weight="700">Produit prêt</text><text x="1045.0" y="310.09" font-size="26" fill="#1e7a46" text-anchor="middle" font-weight="700">à consommer</text><rect x="400" y="100" width="400" height="80" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="600.0" y="148.16" font-size="24" fill="#102c53" text-anchor="middle" font-weight="700">Mains non lavées</text><line x1="270" y1="285" x2="395.9947299054879" y2="144.46741664387895" stroke="#c25b00" stroke-width="3" stroke-dasharray="10 8"/><polygon points="400,140 395.6,155.4 385.2,146.1" fill="#c25b00"/><line x1="800" y1="140" x2="925.9947299054878" y2="280.53258335612105" stroke="#b3261e" stroke-width="3" stroke-dasharray="10 8"/><polygon points="930,285 915.2,278.9 925.6,269.6" fill="#b3261e"/><rect x="400" y="205" width="400" height="80" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="600.0" y="253.16" font-size="24" fill="#102c53" text-anchor="middle" font-weight="700">Même planche ou couteau</text><line x1="270" y1="285" x2="394.2653259476683" y2="246.76451509302512" stroke="#c25b00" stroke-width="3" stroke-dasharray="10 8"/><polygon points="400,245 388.3,255.9 384.2,242.6" fill="#c25b00"/><line x1="800" y1="245" x2="924.2653259476683" y2="283.2354849069749" stroke="#b3261e" stroke-width="3" stroke-dasharray="10 8"/><polygon points="930,285 914.2,287.4 918.3,274.1" fill="#b3261e"/><rect x="400" y="310" width="400" height="80" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="600.0" y="358.16" font-size="24" fill="#102c53" text-anchor="middle" font-weight="700">Plan de travail mal nettoyé</text><line x1="270" y1="285" x2="394.6334368540005" y2="347.31671842700024" stroke="#c25b00" stroke-width="3" stroke-dasharray="10 8"/><polygon points="400,350 384.0,349.8 390.2,337.3" fill="#c25b00"/><line x1="800" y1="350" x2="924.6334368540005" y2="287.68328157299976" stroke="#b3261e" stroke-width="3" stroke-dasharray="10 8"/><polygon points="930,285 920.2,297.7 914.0,285.2" fill="#b3261e"/><rect x="400" y="415" width="400" height="80" rx="14" fill="#eef3f9" stroke="#102c53" stroke-width="2.5"/><text x="600.0" y="463.16" font-size="24" fill="#102c53" text-anchor="middle" font-weight="700">Torchon ou éponge partagé</text><line x1="270" y1="285" x2="396.3552993545752" y2="450.2338530021368" stroke="#c25b00" stroke-width="3" stroke-dasharray="10 8"/><polygon points="400,455 385.7,447.8 396.8,439.3" fill="#c25b00"/><line x1="800" y1="455" x2="926.3552993545752" y2="289.7661469978632" stroke="#b3261e" stroke-width="3" stroke-dasharray="10 8"/><polygon points="930,285 926.8,300.7 915.7,292.2" fill="#b3261e"/><rect x="60" y="530" width="1080" height="110" rx="14" fill="#fff7e0" stroke="#f6b63d" stroke-width="2.5"/><text x="80" y="570.0" font-size="23" fill="#102c53" text-anchor="start" font-weight="700">Les microbes voyagent par des vecteurs.</text><text x="80" y="598.75" font-size="23" fill="#102c53" text-anchor="start" font-weight="700">On les arrête : lavage des mains, ustensiles dédiés, nettoyage-désinfection, ordre des tâches.</text><text x="40" y="653" font-size="18" fill="#5a6b80" text-anchor="start" font-weight="400">Schéma pédagogique.</text></svg>