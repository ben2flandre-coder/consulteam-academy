<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d"><title id="t">Principe d&#x27;un interrupteur différentiel</title><desc id="d">Schéma de principe : les conducteurs de phase et de neutre traversent un tore ; un enroulement alimente un relais sensible qui commande le mécanisme ; un circuit d&#x27;essai avec bouton test dérive un courant hors du tore.</desc><style>.lbl,.num{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}</style><rect width="960" height="600" fill="#ffffff"/><text class="lbl" x="24" y="34" font-size="20" font-weight="700" text-anchor="start" fill="#102c53">Principe d&#x27;un interrupteur différentiel</text><text class="lbl" x="24" y="56" font-size="13" font-weight="400" text-anchor="start" fill="#53657a">Schéma de principe, non à l&#x27;échelle</text><rect x="40" y="90" width="600" height="430" rx="16" fill="#f4f7fb" stroke="#102c53" stroke-width="3" /><text class="lbl" x="60" y="125" font-size="14" font-weight="700" text-anchor="start" fill="#53657a">Amont</text><text class="lbl" x="580" y="125" font-size="14" font-weight="700" text-anchor="end" fill="#53657a">Aval (circuits protégés)</text><polyline points="40,190 200,190" fill="none" stroke="#b3261e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><polyline points="40,300 200,300" fill="none" stroke="#0b68ae" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text class="lbl" x="48" y="180" font-size="13" font-weight="700" text-anchor="start" fill="#b3261e">Phase</text><text class="lbl" x="48" y="290" font-size="13" font-weight="700" text-anchor="start" fill="#0b68ae">Neutre</text><circle cx="130" cy="190" r="5" fill="#fff" stroke="#b3261e" stroke-width="2"/><line x1="130" y1="190" x2="166" y2="172" stroke="#b3261e" stroke-width="3" /><circle cx="130" cy="300" r="5" fill="#fff" stroke="#0b68ae" stroke-width="2"/><line x1="130" y1="300" x2="166" y2="282" stroke="#0b68ae" stroke-wi